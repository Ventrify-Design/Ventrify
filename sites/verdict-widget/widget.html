<!doctype html>
<html lang="en" data-brand="verdictscore" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pre-screen</title>
<meta name="description" content="Free pre-screen for founders: upload your deck and find out whether it is worth putting in front of an investor.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/brand.css">
<style>
/* ══ WHITE-LABEL THEME LAYER ═══════════════════════════════════════════════
   ONE RULE, AND EVERY DECISION BELOW FOLLOWS FROM IT:

       THE FRAME IS THEIRS.   THE VERDICT IS OURS.

   The partner owns the chrome — their logo, their colour, their typeface,
   their corner radius, their light or dark ground. A founder who has been
   reading TCA's site for a minute should feel they are still on it.

   VerdictScore owns everything that IS VerdictScore: the violet mark, the
   upsell card, the score. Those never take the partner's colour, on any site,
   ever. That is what stops white-labelling from quietly giving the product
   away — and what makes the mark worth recognising by the fifth partner.

   Nothing below hardcodes a colour that a partner can set. --acc is theirs,
   --vs is ours, and the two never swap. */
:root{
  --vs:#7C5CFC; --vs-lo:#9B82FF; --vs-hi:#B9A7FF; --vs-pale:#E7E1FF; --vs-ink:#140E2B;
  --acc:#7C5CFC; --acc-ink:#fff;                /* overwritten from the embed tag */
  /* the lockup reads these. They are OURS and never the partner's — see the
     rule at the top of this file. */
  --brand-accent:var(--vs); --brand-accent-2:var(--vs-lo);
  --acc-film:color-mix(in srgb,var(--acc) 14%,transparent);
  --vs-film:color-mix(in srgb,var(--vs) 15%,transparent);
  --r:16px; --r2:12px; --r3:10px;               /* the partner's corner language */
  --ground:#141218;
  --surface:rgba(255,255,255,.035);
  --field:rgba(255,255,255,.05);
  --edge:rgba(255,255,255,.13);
  --edge-hi:rgba(255,255,255,.2);
  --t1:#fff; --t2:rgba(255,255,255,.78); --t3:rgba(255,255,255,.58); --t4:rgba(255,255,255,.42);
  --glow:0 10px 30px -10px color-mix(in srgb,var(--acc) 65%,transparent);
}
[data-theme="light"]{
  --ground:#fff;
  --surface:rgba(16,19,26,.034);
  --field:rgba(16,19,26,.045);
  --edge:rgba(16,19,26,.12);
  --edge-hi:rgba(16,19,26,.2);
  --t1:#14171F; --t2:rgba(20,23,31,.8); --t3:rgba(20,23,31,.62); --t4:rgba(20,23,31,.48);
  /* the violet that survives a white ground — the -600 step, not the -400 */
  --vs-hi:#6B46F0; --vs-pale:#4C2FB8;
  --brand-accent:#6B46F0; --brand-accent-2:#7C5CFC;
  --glow:0 10px 26px -12px color-mix(in srgb,var(--acc) 55%,transparent);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--t1);
  font:400 15px/1.6 var(--w-body,Inter,system-ui,-apple-system,"Segoe UI",sans-serif);
  -webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{font-family:var(--w-display,"Inter Tight",Inter,system-ui,sans-serif);
  letter-spacing:-.022em;font-weight:600;line-height:1.22}

.panel{display:flex;flex-direction:column;height:100%;background:var(--ground)}
[data-theme="dark"] .panel{background:
  radial-gradient(120% 70% at 50% -10%, var(--acc-film), transparent 68%), var(--ground)}
[data-theme="light"] .panel{background:
  radial-gradient(120% 60% at 50% -12%, color-mix(in srgb,var(--acc) 7%,transparent), transparent 66%), var(--ground)}

/* ── head: the PARTNER's lockup. Ours is not here. ──────────────────────── */
.head{flex:0 0 auto;display:flex;align-items:center;gap:.85rem;
  padding:.95rem 1.1rem;border-bottom:1px solid var(--edge)}
.head .logo{display:block;height:34px;width:auto;max-width:160px;
  object-fit:contain;object-position:left center}
.head .wordmark{font:700 17px/1 var(--w-display,"Inter Tight",sans-serif);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .bar{width:1px;align-self:stretch;background:var(--edge);flex:0 0 auto;margin:.1rem 0}
.head .what{font-size:15px;color:var(--t3);white-space:nowrap}
.x{margin-left:auto;flex:0 0 auto;width:44px;height:44px;border-radius:var(--r3);
  border:1px solid var(--edge);background:var(--surface);color:var(--t3);cursor:pointer;
  display:grid;place-items:center;font-size:18px;line-height:1;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),color .18s ease}
.x:hover{color:var(--t1);transform:scale(1.07)}
.x:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── body ───────────────────────────────────────────────────────────────── */
.body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:1.25rem 1.1rem .4rem}
.step{animation:in .34s cubic-bezier(.34,1.56,.64,1) both}
.step.tall{display:flex;flex-direction:column;min-height:100%}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{display:inline-block;font:600 11px/1 var(--w-display,"Inter Tight",sans-serif);
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc-text);margin-bottom:.7rem}
h1{font-size:22px;margin-bottom:.55rem}
.lede{color:var(--t3);font-size:14.5px;margin-bottom:1.1rem}

.facts{display:grid;gap:.5rem;margin-bottom:1.2rem}
.fact{display:flex;gap:.6rem;align-items:flex-start;font-size:14px;color:var(--t2)}
.fact .ic{flex:0 0 auto;width:20px;height:20px;border-radius:6px;margin-top:1px;
  background:var(--acc-film);display:grid;place-items:center;font-size:11px;color:var(--acc-text)}
.fact b{color:var(--t1);font-weight:500}

/* ── form ───────────────────────────────────────────────────────────────── */
.f{display:grid;gap:.85rem}
label{display:block;font-size:13.5px;color:var(--t2);margin-bottom:.32rem;font-weight:500}
label .opt{color:var(--t4);font-weight:400}
input[type=text],input[type=email],input[type=url]{width:100%;
  /* 16px is not a style choice: anything smaller makes iOS zoom the whole
     partner page on focus, and the founder lands in a half-scrolled host site. */
  font:400 16px/1.4 inherit;color:var(--t1);
  background:var(--field);border:1px solid var(--edge);border-radius:var(--r3);
  padding:.72rem .8rem;min-height:46px;transition:border-color .18s ease,background .18s ease}
input::placeholder{color:var(--t4)}
input:focus{outline:none;border-color:var(--acc);background:var(--acc-film)}
input[aria-invalid=true]{border-color:#E5484D}
.err{display:none;font-size:13px;color:#E5484D;margin-top:.3rem}
input[aria-invalid=true] ~ .err{display:block}

.drop{border:1.5px dashed var(--edge-hi);border-radius:var(--r2);padding:1.1rem .9rem;text-align:center;
  background:var(--surface);cursor:pointer;
  transition:border-color .18s ease,background .18s ease,transform .18s cubic-bezier(.34,1.56,.64,1)}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc-film)}
.drop.over{transform:scale(1.015)}
.drop:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.drop .big{font:600 14.5px/1.3 var(--w-display,"Inter Tight",sans-serif);margin-bottom:.2rem}
.drop .sm{font-size:13px;color:var(--t4)}
.drop.has{border-style:solid;border-color:color-mix(in srgb,var(--acc) 55%,transparent);
  background:var(--acc-film);text-align:left;display:flex;align-items:center;gap:.65rem}
.drop.has .fi{flex:0 0 auto;min-width:34px;height:30px;padding:0 .4rem;border-radius:8px;
  display:grid;place-items:center;letter-spacing:.02em;
  background:var(--acc);color:var(--acc-ink);font:700 11px/1 var(--w-display,sans-serif)}
.drop.has .nm{min-width:0;flex:1 1 auto}
.drop.has .nm b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop.has .nm span{font-size:13px;color:var(--t4)}

.hint{font-size:13px;color:var(--t4);margin-top:.35rem}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--field);border-radius:4px;padding:.1rem .3rem;color:var(--t2)}

.check{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;
  padding:.7rem .75rem;border-radius:var(--r3);background:var(--surface);
  border:1px solid var(--edge);min-height:46px}
.check input{flex:0 0 auto;width:18px;height:18px;margin-top:1px;accent-color:var(--acc)}
.check span{font-size:13.5px;color:var(--t2)}
.check b{color:var(--t1);font-weight:600}

/* ── buttons. The primary is the PARTNER's colour: it is their invitation. ─ */
.btn{display:flex;align-items:center;justify-content:center;gap:.45rem;width:100%;
  min-height:48px;border:0;border-radius:var(--r3);cursor:pointer;
  font:600 15px/1 var(--w-display,"Inter Tight",sans-serif);letter-spacing:-.005em;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background .2s ease}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.btn.p{background:var(--acc);color:var(--acc-ink);box-shadow:var(--glow)}
.btn.p:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn.p:active{transform:translateY(0);filter:brightness(.96)}
.btn.p[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.g{background:var(--surface);color:var(--t1);border:1px solid var(--edge)}
.btn.g:hover{background:var(--field);transform:translateY(-1px)}
/* the one button that is OURS, because it sells our product */
.btn.v{background:var(--vs);color:#fff;box-shadow:0 10px 26px -12px color-mix(in srgb,var(--vs) 70%,transparent)}
.btn.v:hover{transform:translateY(-2px);filter:brightness(1.08)}
.back{background:none;border:0;color:var(--t4);font:500 13.5px/1 inherit;cursor:pointer;
  padding:.6rem .2rem;min-height:44px;display:inline-flex;align-items:center;gap:.3rem}
.back:hover{color:var(--t2)}
.stick{position:sticky;bottom:0;z-index:2;padding:.9rem 0 1rem;
  background:linear-gradient(to top,var(--ground) 62%,transparent)}

/* ── progress ───────────────────────────────────────────────────────────── */
.runs{display:grid;gap:.6rem;margin:1.3rem 0}
.run{display:flex;gap:.7rem;align-items:flex-start;padding:.75rem .85rem;border-radius:var(--r2);
  border:1px solid var(--edge);background:var(--surface);
  opacity:.38;transition:opacity .35s ease,border-color .35s ease,background .35s ease}
.run.on{opacity:1}
.run.done{opacity:1;border-color:color-mix(in srgb,var(--acc) 42%,transparent);background:var(--acc-film)}
.run .m{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--edge-hi);font-size:11px;color:var(--t4);margin-top:1px}
.run.on .m{border-color:var(--acc);border-right-color:transparent;animation:spin .8s linear infinite}
.run.done .m{border-color:var(--acc);background:var(--acc);color:var(--acc-ink);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.run .t{min-width:0}
.run .t b{display:block;font:500 14px/1.35 var(--w-display,"Inter Tight",sans-serif)}
.run .t span{font-size:13px;color:var(--t4)}

.wait{margin-top:auto;margin-bottom:1rem;border-radius:var(--r2);padding:.85rem .9rem;
  border:1px solid var(--edge);background:var(--surface)}
.wait b{display:block;font:600 11px/1 var(--w-display,"Inter Tight",sans-serif);letter-spacing:.14em;
  text-transform:uppercase;color:var(--t4);margin-bottom:.4rem}
.wait p{font-size:13.5px;color:var(--t3)}

/* ── done ───────────────────────────────────────────────────────────────── */
.tick{width:52px;height:52px;border-radius:50%;margin:.3rem auto 1rem;display:grid;place-items:center;
  background:var(--acc);color:var(--acc-ink);font-size:25px;
  animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.mid{text-align:center}
.mid h1{font-size:20px}
.addr{display:block;width:max-content;max-width:100%;margin:.8rem auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;
  background:var(--field);border:1px solid var(--edge);border-radius:8px;
  padding:.45rem .7rem;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{display:flex;gap:.5rem;align-items:flex-start;font-size:13.5px;margin-top:1rem;
  padding:.7rem .75rem;border-radius:var(--r3);color:var(--t2);
  background:rgba(245,196,81,.13);border:1px solid rgba(245,196,81,.42)}
.warn .i{color:#D99E12;flex:0 0 auto}
[data-theme="dark"] .warn .i{color:#F5C451}

/* ── the upsell. OURS — violet on every partner's site, by design. ──────── */
.sell{margin-top:1.1rem;margin-bottom:1rem;border-radius:var(--r2);padding:1rem;position:relative;
  border:1px solid color-mix(in srgb,var(--vs) 38%,transparent);
  background:linear-gradient(160deg,var(--vs-film),var(--surface))}
.sell .lbl{display:flex;align-items:center;gap:.4rem;font:600 11px/1 var(--w-display,"Inter Tight",sans-serif);
  letter-spacing:.14em;text-transform:uppercase;color:var(--vs-pale);margin-bottom:.5rem}
.sell .lbl .v{width:16px;height:16px;border-radius:4px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--vs-lo),var(--vs));color:#fff}
.v svg{width:62%;height:62%;display:block}
.sell h3{font-size:16px;margin-bottom:.3rem;display:flex;align-items:baseline;gap:.45rem;flex-wrap:wrap}
.sell .price{font:700 16px/1 var(--w-display,"Inter Tight",sans-serif);color:var(--vs-pale)}
.sell p{font-size:13.5px;color:var(--t3);margin-bottom:.6rem}
.sell .gate{display:flex;gap:.5rem;align-items:flex-start;font-size:13.5px;color:var(--t2);
  padding:.6rem .65rem;border-radius:var(--r3);background:var(--surface);margin-bottom:.75rem}
.sell .gate b{color:var(--t1);font-weight:600}
.sell .gate .sc{flex:0 0 auto;font:700 13px/1 var(--w-display,"Inter Tight",sans-serif);color:#fff;
  background:var(--vs);border-radius:5px;padding:.24rem .38rem;margin-top:1px}

/* ── foot: THE HOMAGE. One violet tile, same on every partner's site, never
      recoloured and never removable. It is the only thing a founder carries
      away from five different angel groups that is the same. ─────────────── */
.foot{flex:0 0 auto;padding:.6rem 1.1rem;border-top:1px solid var(--edge);
  display:flex;align-items:center;gap:.5rem;font-size:12.5px;color:var(--t4)}
.foot #footnote{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{display:inline-flex;align-items:center;gap:.4rem;margin-left:auto;flex:0 0 auto;
  background:none;border:0;cursor:pointer;padding:.45rem 0;min-height:44px;
  font:inherit;color:var(--t4);transition:color .18s ease}
.by:hover{color:var(--t2)}
.by:focus-visible{outline:2px solid var(--vs);outline-offset:2px;border-radius:4px}
/* THE REAL LOCKUP, not an imitation of it. Height 26px is the optical floor
   named in shared/m3/brand-lockup.js — the chevron is a layered form with a
   counter cut out of it and below that the layers collapse into a smudge. */
/* THE WORDMARK IS INK, NOT UI TEXT. "Verdict" and the dark half of the chevron are
     fill="currentColor" in brand-lockup.js, so without this they inherit .by's muted
     --t3 and the logo renders grey — a washed-out version of a mark that is black in
     the original. Pinned to --t1 (#14171F light, #fff dark) and deliberately NOT
     changed on hover: a brand mark is not a link affordance. */
  .by .brand-lockup{height:26px;width:auto;display:block;flex:0 0 auto;color:var(--t1)}
.by .v{width:18px;height:18px;border-radius:5px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--vs-lo),var(--vs));color:#fff}
.by .pb{color:var(--t4);white-space:nowrap}
.by{color:var(--t3)}
.by:hover{color:var(--t1)}
.by b{font-weight:600;color:var(--t3)}
.by:hover b{color:var(--t1)}

/* HOUSE RULE: nothing under 14px once the panel goes full-screen on a phone. */
@media(max-width:640px){
  .lede,.fact,.check span,.hint,.sell p,.sell .gate,.run .t span,.foot,.head .what,
  label,.drop .sm,.drop.has .nm span,.drop.has .fi,.err,.addr,code,.sell .lbl,.eyebrow,.back,
  .wait p,.wait b,.warn,.by,.by .pb,.sell .price,.sell .gate .sc{font-size:14px}
  .body{padding:1.1rem 1rem .4rem}
  .foot{gap:.45rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="panel">
  <header class="head" id="head"></header>
  <main class="body" id="body"></main>
  <footer class="foot">
    <span id="footnote">Free &middot; no account needed</span>
    <button class="by" id="by" type="button">
      <span class="pb">Powered by</span><span id="lockup"></span>
    </button>
  </footer>
</div>
<script type="module" src="./widget.js"></script>
</body>
</html>
