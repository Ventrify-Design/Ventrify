<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal — Ventrify</title>
  <meta name="description" content="Log in to your Ventrify client portal to track project progress, view deliverables, and manage your venture build.">
  <meta property="og:title" content="Client Portal — Ventrify">
  <meta property="og:description" content="Access your Ventrify client portal.">
  <meta property="og:type" content="website">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/shared.css">
  <style>
    .portal-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .portal-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .portal-logo {
      margin-bottom: 3rem;
    }
    .portal-logo img {
      height: 28px;
      width: auto;
      display: block;
      margin: 0 auto;
      opacity: 0.7;
    }

    .portal-heading {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .portal-sub {
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .portal-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .portal-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 980px;
      padding: 0.9rem 1.5rem;
      font-size: 0.92rem;
      color: var(--text);
      font-family: var(--font-body);
      outline: none;
      text-align: center;
      letter-spacing: 0.15em;
      transition: border-color 0.2s ease;
    }
    .portal-input::placeholder {
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .portal-input:focus {
      border-color: var(--brand-light);
    }

    .portal-btn {
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 980px;
      padding: 0.9rem 2rem;
      font-family: var(--font-heading);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.2s ease, opacity 0.2s ease;
    }
    .portal-btn:hover {
      background: var(--brand-light);
    }
    .portal-btn:active {
      opacity: 0.85;
    }
    .portal-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .portal-error {
      display: none;
      font-size: 0.82rem;
      color: #e54545;
      margin-top: 0.5rem;
    }

    .portal-divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 2.5rem auto;
    }

    .portal-help {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .portal-help a {
      color: var(--brand);
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .portal-help a:hover {
      color: var(--brand-light);
    }

    .portal-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2rem;
      transition: color 0.2s ease;
    }
    .portal-back:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

<div class="portal-page">
  <!-- Subtle background orbs -->
  <div class="orb" style="width:500px;height:500px;background:radial-gradient(circle,rgba(110,58,250,0.04) 0%,transparent 70%);top:-100px;right:-100px;"></div>
  <div class="orb" style="width:350px;height:350px;background:radial-gradient(circle,rgba(0,184,160,0.03) 0%,transparent 70%);bottom:-50px;left:-50px;"></div>

  <div class="portal-card">
    <!-- Logo -->
    <div class="portal-logo">
      <img src="ventrify.svg" alt="Ventrify">
    </div>

    <!-- Heading -->
    <h1 class="portal-heading">Client Portal</h1>
    <p class="portal-sub">Enter your access code to view your project progress, deliverables, and milestones.</p>

    <!-- Login Form -->
    <form class="portal-form" id="portalForm" onsubmit="return handlePortalLogin(event)">
      <input
        type="text"
        class="portal-input"
        id="portalCode"
        placeholder="Enter access code"
        autocomplete="off"
        spellcheck="false"
        required
      >
      <button type="submit" class="portal-btn" id="portalBtn">
        Log In
      </button>
      <div class="portal-error" id="portalError">
        Invalid access code. Please check and try again.
      </div>
    </form>

    <!-- Divider -->
    <div class="portal-divider"></div>

    <!-- Help text -->
    <p class="portal-help">
      Don't have an access code?<br>
      <a href="contact.html">Get in touch</a> to start your venture.
    </p>

    <!-- Back link -->
    <a href="index.html" class="portal-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Ventrify
    </a>
  </div>
</div>

<script>
  function handlePortalLogin(e) {
    e.preventDefault();
    const code = document.getElementById('portalCode').value.trim();
    const btn = document.getElementById('portalBtn');
    const error = document.getElementById('portalError');

    if (!code) return false;

    btn.disabled = true;
    btn.textContent = 'Verifying…';
    error.style.display = 'none';

    // Simulate verification delay — replace with real auth when portal is built
    setTimeout(() => {
      // For now, show error since no portals are connected yet
      error.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Log In';
    }, 1200);

    return false;
  }
</script>
</body>
</html>
