<!DOCTYPE html>
<html lang="en" data-brand="verdictscore">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign in — VerdictScore</title>
  <meta name="description" content="Sign in to VerdictScore. Evidence-led venture assessment for angels, networks, VCs and accelerators.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The brand's faces. These MUST match what --font-text / --font-display name in
     brand.css: the page used to fetch Roboto (M3's default, which brand-map.css
     overrides) and never fetch Inter at all, so the product rendered in Inter only
     on machines that happened to have it installed locally. tools/font-sync.mjs
     now fails the build if a page stops fetching a family its tokens name. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
  <!-- BRAND LAYER, in the load-bearing order brand-map.css documents: brand.css
       FIRST (the tokens everything resolves against), brand-map LAST (the M3 role
       overrides, which lose to ds.css at equal specificity if ds.css loads later).
       This page carries no shell — there is no tenant yet to put in one — so it
       links the token + component sheets and nothing else. -->
  <link rel="stylesheet" href="../assets/brand/brand.css">
  <link rel="stylesheet" href="../shared/m3/theme.css">
  <link rel="stylesheet" href="../shared/m3/ds.css">
  <link rel="stylesheet" href="../shared/m3/workspace-chrome.css">
  <link rel="stylesheet" href="../shared/m3/brand-map.css">
</head>
<body class="signin">
  <main class="signin-shell">
    <div class="m3-card signin-card" id="signin-card"></div>
    <p class="signin-foot">
      Don&rsquo;t have a workspace yet?
      <a href="../pricing.html">View pricing</a> &middot;
      <a href="mailto:hello@ventrify.io?subject=VerdictScore%20demo%20request">Book a demo</a>
    </p>
  </main>

  <script type="module">
    import { FIREBASE_ENABLED } from '../firebase/config.js';
    import { sendMagicLink, completeMagicLinkIfPresent } from '../firebase/auth.js';
    import { formField } from '../shared/m3/ds.js';
    import { brandLockup } from '../shared/m3/brand-lockup.js';

    // ── PRESENTATION ───────────────────────────────────────────────────────
    // This page is the ONE screen with no tenant: nobody has signed in, so there
    // is no org name, colour or logo to defer to. It is therefore the only place
    // the product's own lockup belongs at full size (everywhere else the drawer
    // head is the customer's — see drawer() in ds.js).
    const card = document.getElementById('signin-card');
    const mark = () => `<div class="signin-mark">${brandLockup({ label: 'VerdictScore' })}</div>`;

    function renderForm() {
      card.innerHTML = `
        ${mark()}
        <h1 class="signin-title">Sign in to your workspace</h1>
        <p class="signin-sub">Evidence-led venture assessment — the operator view of every venture your team is scoring.</p>
        <form class="signin-form" id="login-form">
          ${formField({ label: 'Work email', id: 'login-email', type: 'email', placeholder: 'you@yourfund.com', attr: ' autocomplete="email" required' })}
          <button type="submit" class="m3-btn filled signin-go" id="login-btn">Send me a sign-in link</button>
        </form>
        <p class="signin-meta" id="login-meta">No password — we email you a one-time link to sign in.</p>`;
      wire();
    }

    function showSent(addr) {
      card.innerHTML = `
        ${mark()}
        <h1 class="signin-title">Check your inbox.</h1>
        <p class="signin-sub">A one-time sign-in link is on its way to <strong>${esc(addr)}</strong>.
        Open it in <em>this</em> browser to finish signing in. The link expires in about an hour.</p>
        <p class="signin-meta">Wrong address? <a href="./">Start over</a></p>`;
    }

    function showError(err) {
      const code = (err && (err.code || err.message)) || String(err);
      const meta = document.getElementById('login-meta');
      if (!meta) return;
      meta.innerHTML = 'Couldn&rsquo;t send the link: <strong>' + esc(code) + '</strong>';
      meta.classList.add('err');
    }

    const esc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    // ── AUTH ───────────────────────────────────────────────────────────────
    // Carried over UNCHANGED from the pre-migration page. This is the front door:
    // every operator reaches the product through it and there is no second way in,
    // so the migration is presentational and the flow below is the same calls in
    // the same order — magic link out, magic link completed on return, and the
    // FIREBASE_ENABLED=false branch that lets the demo walk straight in.
    const DASH = 'dashboard-m3.html';   // Material-3 is the only workspace UI

    function wire() {
      const form = document.getElementById('login-form');
      const email = document.getElementById('login-email');
      const btn = document.getElementById('login-btn');
      if (!FIREBASE_ENABLED) {
        form.addEventListener('submit', (e) => { e.preventDefault(); window.location.href = DASH; });
        return;
      }
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const addr = email.value.trim();
        if (!addr) return;
        btn.disabled = true; btn.textContent = 'Sending…';
        try {
          await sendMagicLink(addr, window.location.origin + '/workspace/');
          showSent(addr);
        } catch (err) {
          showError(err);
          btn.disabled = false; btn.textContent = 'Send me a sign-in link';
        }
      });
    }

    renderForm();
    if (FIREBASE_ENABLED) {
      // Returning from a clicked email link? Finish the sign-in, then go in.
      completeMagicLinkIfPresent()
        .then((user) => { if (user) window.location.href = DASH; })
        .catch(showError);
    }
  </script>
</body>
</html>
