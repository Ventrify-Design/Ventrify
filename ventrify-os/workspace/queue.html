<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action queue — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="agents.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    await window.WORKSPACE_READY;
    const W = window.WORKSPACE;
    const A = window.WORKSPACE_AGENTS;
    const { actions, helpers, programs } = W;

    // workflow-orchestrator: rank-order the operator's next actions across
    // every engagement they own, computed deterministically from live state.
    // In demo mode the sample programs don't carry the orchestrator's signal
    // fields (briefSubmitted:false, draftedAwaitingOperator, gate phrasing),
    // so fall back to the curated sample queue, which reads as a full
    // multi-operator org view. When Firebase lands this swaps for a
    // Firestore subscription to the agent's published action set.
    const useLiveQueue = (W.demoMode || 'off') === 'off';
    const liveQueue = A ? A.computeActionQueue(programs, W.currentOperatorId) : [];
    const displayActions = useLiveQueue ? liveQueue : actions;

    const typeIcon = {
      'gate-ready': '&#x2713;',
      'cards-to-review': '&#x270E;',
      'stuck-program': '&#x26A0;',
      'qa-flag': '&#x1F50D;',
      'l3-rebuild': '&#x21BB;',
      'intake': '&#x2728;'
    };
    const typeLabel = {
      'gate-ready': 'Gate ready',
      'cards-to-review': 'Cards to review',
      'stuck-program': 'Stuck',
      'qa-flag': 'QA flag',
      'l3-rebuild': 'L3 rebuild',
      'intake': 'New intake'
    };

    function actionCardHTML(a) {
      const program = helpers.getProgram(a.programId);
      return `
        <div class="action-card urgency-${a.urgency}">
          <div class="action-icon type-${a.type}">${typeIcon[a.type] || '&#x2022;'}</div>
          <div class="action-body">
            <div class="action-title">${a.title}</div>
            <div class="action-detail">${a.detail}</div>
            <div class="action-meta">
              <span class="text-mono">${typeLabel[a.type]}</span> &middot;
              ${program ? `<span>${program.name}</span> &middot;` : ''}
              <span>${a.age}</span>
            </div>
          </div>
          <div class="action-cta">
            <button class="btn btn-primary btn-sm">${a.cta}</button>
            <a href="program.html?id=${a.programId}" class="text-small dim" style="font-size:0.78rem;">Open engagement &rarr;</a>
          </div>
        </div>
      `;
    }

    const byUrgency = { high: [], medium: [], low: [] };
    displayActions.forEach(a => { byUrgency[a.urgency].push(a); });

    function sectionHTML(label, items, sub) {
      if (!items.length) return '';
      return `
        <div class="section">
          <div class="section-head">
            <div>
              <div class="section-title">${label} <span class="text-mono dim" style="font-size:0.78rem;letter-spacing:0.06em;">&middot; ${items.length}</span></div>
              <div class="section-sub">${sub}</div>
            </div>
          </div>
          <div class="action-list">
            ${items.map(actionCardHTML).join('')}
          </div>
        </div>
      `;
    }

    const isEmpty = displayActions.length === 0;
    const emptyBlock = isEmpty
      ? `
        <div class="card" style="text-align:center;padding:3rem 2rem;">
          <div style="font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--brand-primary,var(--primary,#0036FF));margin-bottom:0.6rem;">Queue clear</div>
          <h2 style="font-size:1.2rem;font-weight:600;letter-spacing:-0.01em;margin-bottom:0.5rem;color:var(--text,#141414);">Nothing for you to do.</h2>
          <p style="font-size:0.9rem;color:var(--text-muted,#656565);max-width:480px;margin:0 auto;line-height:1.6;">New work surfaces here when an agent completes a run, a founder responds in their Studio, or a gate is ready to sign. Start an engagement to populate the queue.</p>
          <a href="new-engagement.html" class="btn btn-primary" style="margin-top:1.5rem;">New engagement</a>
        </div>
      `
      : `
        ${sectionHTML('High urgency', byUrgency.high, 'Blocking a gate or a founder. Address first.')}
        ${sectionHTML('Medium urgency', byUrgency.medium, 'Should be cleared this week.')}
        ${sectionHTML('Low urgency', byUrgency.low, 'Awareness items. No immediate action required.')}
      `;

    const main = `
      <div class="page-header">
        <div class="page-eyebrow">Action queue</div>
        <h1 class="page-title">Your work this week</h1>
        <p class="page-sub">Everything the platform needs from you, across every engagement. Prioritised by urgency. Gate sign-offs and stuck founders surface to the top.</p>
        <p class="text-mono dim" style="font-size:0.72rem;letter-spacing:0.06em;text-transform:uppercase;margin-top:0.5rem;">Prioritised automatically${useLiveQueue ? '' : ' · sample data'}</p>
      </div>

      ${emptyBlock}
    `;

    window.renderShell(main);
  </script>
</body>
</html>
