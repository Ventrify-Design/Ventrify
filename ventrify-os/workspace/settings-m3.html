<!DOCTYPE html>
<html lang="en" data-brand="verdictscore">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Settings — Ventrify OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The brand's faces. These MUST match what --font-text / --font-display name in
     brand.css: the page used to fetch Roboto (M3's default, which brand-map.css
     overrides) and never fetch Inter at all, so the product rendered in Inter only
     on machines that happened to have it installed locally. tools/font-sync.mjs
     now fails the build if a page stops fetching a family its tokens name. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<!-- BRAND LAYER. Order is load-bearing and brand-map.css documents why:
     the :root variables would resolve from anywhere, but the handful of real
     SELECTORS in brand-map lose to ds.css at equal specificity if ds.css
     loads later. brand.css FIRST (the tokens everything else resolves
     against), brand-map LAST (the M3 role overrides). -->
<link rel="stylesheet" href="../assets/brand/brand.css">
<link rel="stylesheet" href="../shared/m3/theme.css">
<link rel="stylesheet" href="../shared/m3/ds.css">
<!-- The EDITORIAL layer (section-hero, statement/book/coverage lockups, the .mrow row
     system, the eyebrow). Named for the assessment because that is where it was written,
     but it is the shared reading language of the product — the Portfolio already loads it
     and is not an assessment. Without it these pages can only draw boxes: the components
     exist in ds.js and render, but land unstyled. That, not taste, is why they read thin. -->
<link rel="stylesheet" href="../shared/m3/assess-editorial.css">
<link rel="stylesheet" href="../shared/m3/transitions.css">
<link rel="stylesheet" href="../shared/m3/workspace-chrome.css">
<link rel="stylesheet" href="../shared/m3/brand-map.css">
</head>
<body>
<div id="app"></div>
<script src="sample-data.js"></script>
<script src="agents.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  import * as DS from '../shared/m3/ds.js';
  import { wsNavConfig, wsBrandConfig, wsAccountConfig, mountOrgSwitcherM3 } from './workspace-m3.js';
  import { workspaceHero, brandPreview, brandSwatches } from '../shared/m3/workspace-cards.js';

  await window.WORKSPACE_READY;
  const W = window.WORKSPACE;
  const { org, operators, programs, storage } = W;
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const initialsOf = s => { const parts = (s || '').trim().split(/\s+/); return (((parts[0] || '?')[0] || '?') + (parts.length > 1 ? (parts[parts.length - 1][0] || '') : '')).toUpperCase().slice(0, 2); };

  if (!org) {
    document.getElementById('app').outerHTML = DS.pageShell({ active: 'settings', nav: wsNavConfig(), brand: wsBrandConfig(), account: wsAccountConfig(), masthead: DS.masthead({ eyebrow: 'Settings', headline: 'No organisation configured' }), body: `<div class="brief"><div class="m3-card" style="text-align:center;padding:48px">Contact your administrator for Workspace access.</div></div>` });
    DS.initShell(); mountOrgSwitcherM3();
    // Halts by never resolving, not by throwing — see the same idiom in
    // admin-m3.html, and app.js's three `return new Promise(() => {})` guards.
    // A throw here is a real uncaught Error in the console, indistinguishable
    // from a page that actually broke; this one fired for anyone
    // whose account has no organisation configured.
    await new Promise(() => {});
  }

  // ---- persist a brand patch (VERBATIM /api/update-org from settings.html) ----
  async function persistPatch(patch) {
    if (W.mode === 'live') {
      const { auth } = await import('../firebase/firebase.js');
      const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
      const resp = await fetch('/api/update-org', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken, orgId: org.id, patch }) });
      const d = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(d.error === 'logo_too_large' ? 'That logo is too large — use an image under ~300KB or an SVG.' : (d.error || ('HTTP ' + resp.status)));
    } else { storage.writeJSON('workspace.organisation', { ...org, ...patch }); }
  }
  // repaint the M3 drawer brand live (not the legacy topbar) + save
  function applyBrandM3(patch) {
    const logo = document.querySelector('.drawer-brand .logo');
    const nameEl = document.querySelector('.drawer-brand .wm-name');
    if (logo && patch.primaryColor) logo.style.background = patch.primaryColor;
    if (nameEl && patch.name !== undefined) nameEl.textContent = patch.name;
    if (logo && patch.logoUrl !== undefined) logo.innerHTML = patch.logoUrl ? `<img src="${esc(patch.logoUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">` : `<span style="font-size:13px;font-weight:700">${esc(initialsOf(org.name))}</span>`;
    // The hero is a PREVIEW of exactly this, so it repaints from the same patch
    // and through the same component — re-rendered, never patched by hand, so
    // the preview cannot drift from what brandPreview() would draw on reload.
    const prev = document.querySelector('.brand-prev');
    if (prev) prev.outerHTML = brandPreview(org);
  }
  function saveOrgPatch(patch) {
    Object.assign(org, patch); applyBrandM3(patch);
    persistPatch(patch).then(() => window.__toast('Saved')).catch(e => window.__toast(String(e.message || e), true));
  }
  function readDataUrl(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error('read failed')); r.readAsDataURL(file); }); }
  async function processLogo(file) {
    if (file.type === 'image/svg+xml') return readDataUrl(file);
    const src = await readDataUrl(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('not an image')); i.src = src; });
    const scale = Math.min(1, 256 / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/png');
  }
  window.__removeLogo = async () => {
    if (!(await window.__confirm({ title: 'Remove the logo?', message: 'The Workspace falls back to your initials.', confirmLabel: 'Remove', danger: true }))) return;
    try { Object.assign(org, { logoUrl: null }); applyBrandM3({ logoUrl: null }); await persistPatch({ logoUrl: null }); location.reload(); }
    catch (e) { window.__toast(String((e && e.message) || e), true); }
  };

  const SW = ['#0036FF', '#7A3FFF', '#00B8A0', '#FF3F7A', '#FF7A3F', '#141414'];
  // The picker used to default to #0036FF with nothing saved, while the drawer
  // mark and the hero preview both fell back to the theme primary — so the page
  // showed two different "current" colours at once. An unset colour is now unset
  // everywhere: no swatch ringed, no hex, and the preview on the theme default.
  const cur = (org.primaryColor || '').toUpperCase();
  // The "where it shows" sentence moved to the hero's coda — repeating it here
  // put the same 26 words twice on one screen.
  const brandCard = `<div class="m3-card" style="padding:22px">
    <div class="title-l" style="margin-bottom:18px">Brand kit</div>
    <div style="margin-bottom:22px;max-width:380px">${DS.formField({ label: 'Organisation name', id: 'b-name', value: org.name || '' })}</div>
    <div style="margin-bottom:22px"><div class="overline" style="margin-bottom:10px">Primary colour</div>
      ${brandSwatches(SW, cur)}
    </div>
    <div><div class="overline" style="margin-bottom:10px">Logo</div>
      <div style="display:flex;align-items:center;gap:14px;padding:14px;border:1px dashed var(--md-sys-color-outline-variant);border-radius:12px;flex-wrap:wrap">
        <div id="b-logo" style="width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:${esc(org.primaryColor || 'var(--md-sys-color-primary)')};color:${org.primaryColor ? DS.inkOn(org.primaryColor) : 'var(--md-sys-color-on-primary)'};font-weight:700">${org.logoUrl ? `<img src="${esc(org.logoUrl)}" alt="" style="width:100%;height:100%;object-fit:cover">` : `<span>${esc(initialsOf(org.name))}</span>`}</div>
        <div style="flex:1 1 150px"><div class="body-m" style="font-weight:500">${org.logoUrl ? 'Replace logo' : 'Upload a logo'}</div><div class="body-s variant">PNG or SVG. Square works best.</div></div>
        <span style="display:flex;gap:6px"><button class="m3-btn text" onclick="document.getElementById('b-logo-input').click()">Upload</button>${org.logoUrl ? `<button class="m3-btn text" style="color:var(--md-sys-color-error)" onclick="window.__removeLogo()">Remove</button>` : ''}</span>
        <input type="file" id="b-logo-input" accept="image/png,image/svg+xml,image/jpeg" hidden>
      </div>
    </div>
  </div>`;

  const Plan = window.VentrifyPlan, plan = W.plan;
  const presetDef = (Plan.PLAN_PRESETS[plan.preset] || {});
  // DS.row is the one canonical list row (21 variants were folded into it).
  // This page had re-implemented it inline with its own padding, hairline and
  // type — so a change to row spacing anywhere else never reached Settings.
  // DS.row ESCAPES trail.value, so these callers hand it text, not markup. The
  // muted tail is a real slot (`valueMuted`), not a <span> smuggled through a
  // value — which is what the inline version was doing for "Enterprise only".
  const row = (l, v, muted) => DS.row({ variant: 'spec', title: l,
    trail: { kind: 'value', value: muted ? '' : v, valueMuted: muted ? v : '' } });
  function capUsage(type, label) { if (!Plan.orgCan(plan, type)) return ''; const used = Plan.usageFor(programs, type); const lim = Plan.limitFor(plan, type); return row(label, lim == null ? `${used} · unlimited` : `${used} of ${lim}`); }
  const orgCard = `<div class="m3-card" style="padding:22px"><div class="title-l" style="margin-bottom:10px">Organisation</div>${row('Slug', org.slug || '—')}${row('Created', org.createdAt ? new Date(org.createdAt).toLocaleDateString() : '—')}${row('Custom domain', 'Enterprise only', true)}</div>`;
  const planCard = `<div class="m3-card" style="padding:22px"><div class="title-l" style="margin-bottom:10px">Plan &amp; usage</div>${row('Plan', Plan.planLabel(plan))}${capUsage('assessment', 'Assessments')}${capUsage('build', 'MVP builds')}${row('Operators', String(operators.length))}<div style="margin-top:14px;display:flex;gap:8px"><a class="m3-btn text" href="../pricing.html" target="_blank">View pricing</a><button class="m3-btn filled" onclick="window.__requestUpgrade&&window.__requestUpgrade()">Request upgrade</button></div></div>`;
  const dangerCard = `<div class="m3-card" style="padding:22px;border:1px solid color-mix(in srgb, var(--md-sys-color-error) 30%, transparent)"><div class="title-l" style="margin-bottom:6px">Danger zone</div><div class="body-m variant" style="margin-bottom:14px">Wipes every locally-stored value and returns to first-run setup.</div><button class="m3-btn outlined" style="color:var(--md-sys-color-error);border-color:color-mix(in srgb, var(--md-sys-color-error) 40%, transparent)" onclick="window.__resetWorkspace&&window.__resetWorkspace()">Clear all workspace data</button></div>`;

  document.getElementById('app').outerHTML = DS.pageShell({
    active: 'settings', nav: wsNavConfig(), brand: wsBrandConfig(), account: wsAccountConfig(),
    masthead: DS.masthead({ eyebrow: 'Settings', headline: esc(org.name) }),
    body: `<div class="brief">
      ${workspaceHero({ org, plan, Plan, programs, operators })}
      <div class="ws-settings">
        <div class="ws-stack">${brandCard}${orgCard}</div>
        <div class="ws-stack">${planCard}</div>
        <div class="ws-span">${dangerCard}</div>
      </div>
    </div>`
  });
  DS.initShell(); mountOrgSwitcherM3();

  // ---- bindings ----
  const nameInput = document.getElementById('b-name');
  if (nameInput) nameInput.addEventListener('blur', () => { const n = nameInput.value.trim(); if (n && n !== org.name) saveOrgPatch({ name: n }); });
  function applyColor(hex) {
    if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return; const up = hex.toUpperCase();
    saveOrgPatch({ primaryColor: up });
    document.getElementById('b-pick').value = up; document.getElementById('b-hex').value = up;
    // selection is a CLASS now, not a hand-written box-shadow per swatch — so the
    // ring lives with the rest of the component's states in the stylesheet.
    document.querySelectorAll('.bsw').forEach(s => s.classList.toggle('on', s.dataset.color.toUpperCase() === up));
    const tile = document.querySelector('.bsw-custom');
    if (tile) { tile.style.background = up; const g = tile.querySelector('.material-symbols-rounded'); if (g) g.style.color = DS.inkOn(up); }
    const lg = document.getElementById('b-logo');
    if (lg && !org.logoUrl) { lg.style.background = up; lg.style.color = DS.inkOn(up); }
  }
  document.querySelectorAll('.bsw').forEach(s => s.addEventListener('click', () => applyColor(s.dataset.color)));
  document.getElementById('b-pick')?.addEventListener('input', e => applyColor(e.target.value));
  document.getElementById('b-hex')?.addEventListener('change', e => applyColor(e.target.value));
  document.getElementById('b-logo-input')?.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try { const dataUrl = await processLogo(file); Object.assign(org, { logoUrl: dataUrl }); applyBrandM3({ logoUrl: dataUrl }); await persistPatch({ logoUrl: dataUrl }); location.reload(); }
    catch (err) { window.__toast(String((err && err.message) || err), true); }
  });
</script>
</body>
</html>
