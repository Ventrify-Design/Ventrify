<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="agents.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    await window.WORKSPACE_READY;
    const W = window.WORKSPACE;
    const { operators, org, helpers } = W;
    const isLive = W.mode === 'live';
    const orgName = (org && org.name) || 'your Workspace';
    const seatsLimit = (org && org.operatorSeatsLimit) || 'Unlimited';
    // Team management is owner/super-admin only (mirrors the API enforcement). Demo
    // mode is a local sandbox, so allow it there.
    const me = (helpers.currentOperator && helpers.currentOperator()) || {};
    const ownerEmail = String((org && org.ownerEmail) || '').toLowerCase();
    const canManage = !isLive || !!W.isSuperAdmin || (ownerEmail !== '' && String(me.email || '').toLowerCase() === ownerEmail);

    function toast(msg, isError) {
      let t = document.getElementById('team-toast');
      if (!t) { t = document.createElement('div'); t.id = 'team-toast'; t.className = 'settings-toast'; document.body.appendChild(t); }
      t.innerHTML = (isError ? '<span style="font-size:0.65rem;">&#9888;</span> ' : '<span style="font-size:0.65rem;">✓</span> ') + msg;
      t.style.background = isError ? 'var(--danger,#C0392B)' : '';
      t.classList.remove('hide'); t.classList.add('show');
      clearTimeout(t._h); t._h = setTimeout(() => { t.classList.remove('show'); t.classList.add('hide'); }, isError ? 3200 : 1800);
    }
    const ERR = { already_operator: 'That email is already an operator.', last_operator: 'You can’t remove the last operator.', bad_email: 'Enter a valid email address.', forbidden: 'Only the workspace owner can manage the team.', not_an_operator: 'That person isn’t an operator.', cannot_remove_owner: 'The workspace owner can’t be removed.' };

    async function apiOperator(action, email) {
      const { auth } = await import('../firebase/firebase.js');
      const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
      const resp = await fetch('/api/manage-operator', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken, orgId: org.id, action, email }) });
      const d = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(ERR[d.error] || d.error || ('HTTP ' + resp.status));
      return d;
    }

    window.__toggleInvite = function() {
      const f = document.getElementById('invite-form'); if (!f) return;
      const open = f.style.display !== 'none'; f.style.display = open ? 'none' : 'flex';
      if (!open) { const i = document.getElementById('invite-email'); if (i) i.focus(); }
    };
    window.__addOperator = async function() {
      const input = document.getElementById('invite-email');
      const email = ((input && input.value) || '').trim().toLowerCase();
      if (!email) { toast('Enter an email address.', true); return; }
      const btn = document.getElementById('invite-send'); if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
      try {
        if (isLive) { const d = await apiOperator('add', email); toast(d.emailSent ? `Invite sent to ${email}` : `${email} added — they can sign in at this Workspace`); }
        else { const list = W.storage.readJSON('workspace.operators', []); list.push({ id: email, email, name: email.split('@')[0], role: 'Operator', avatar: email.slice(0, 2).toUpperCase(), avatarColor: (org && org.primaryColor) || '#0036FF' }); W.storage.writeJSON('workspace.operators', list); toast(`${email} added`); }
        setTimeout(() => window.location.reload(), 950);
      } catch (e) { toast(String(e.message || e), true); if (btn) { btn.disabled = false; btn.textContent = 'Send invite'; } }
    };
    window.__removeOperator = async function(email) {
      if (!window.confirm(`Remove ${email} from the Workspace? They lose access immediately.`)) return;
      try {
        if (isLive) await apiOperator('remove', email);
        else W.storage.writeJSON('workspace.operators', W.storage.readJSON('workspace.operators', []).filter(o => (o.email || '').toLowerCase() !== email));
        toast(`${email} removed`); setTimeout(() => window.location.reload(), 750);
      } catch (e) { toast(String(e.message || e), true); }
    };

    function operatorCardHTML(op) {
      const assignedPrograms = helpers.programsForOperator(op.id);
      const programNames = assignedPrograms.map(p => p.name).join(' &middot; ') || '<span class="dim">No engagements assigned</span>';
      const canRemove = canManage && isLive && !op.isCurrentUser && String(op.email || '').toLowerCase() !== ownerEmail && operators.length > 1;
      return `
        <div class="team-card">
          <div class="team-card-head">
            <div class="avatar avatar-lg" style="background:${op.avatarColor};">${op.avatar}</div>
            <div style="flex:1;min-width:0;">
              <div class="team-card-name">${op.name}${op.isCurrentUser ? ' <span class="team-you">You</span>' : ''}</div>
              <div class="team-card-email">${op.email}</div>
            </div>
            ${canRemove ? `<button class="team-remove" title="Remove operator" onclick="window.__removeOperator('${op.email}')">Remove</button>` : ''}
          </div>
          <div class="team-card-role">${op.role}</div>
          <div class="team-card-programs">
            <div class="text-small dim text-mono" style="letter-spacing:0.06em;text-transform:uppercase;font-size:0.66rem;margin-bottom:0.5rem;">Assigned (${assignedPrograms.length})</div>
            ${programNames}
          </div>
        </div>
      `;
    }

    const main = `
      <div class="page-header">
        <div class="page-eyebrow">Team</div>
        <h1 class="page-title">Operators on ${orgName}</h1>
        <p class="page-sub">Everyone with Workspace access for your organisation. Add an operator and they get a one-click sign-in link to this same Workspace.</p>
      </div>

      <div class="section">
        <div class="section-head">
          <div>
            <div class="section-title">Active operators &middot; ${operators.length}</div>
            <div class="section-sub">Seats used: ${operators.length} of ${seatsLimit}</div>
          </div>
          ${canManage ? `<button class="btn btn-primary btn-sm" onclick="window.__toggleInvite()">Invite operator</button>` : ''}
        </div>

        <div id="invite-form" class="team-invite" style="display:none;">
          <input id="invite-email" type="email" autocomplete="off" placeholder="teammate@email.com" class="team-invite-input">
          <button id="invite-send" class="btn btn-primary btn-sm" onclick="window.__addOperator()">Send invite</button>
          <button class="btn btn-ghost btn-sm" onclick="window.__toggleInvite()">Cancel</button>
        </div>

        ${operators.length === 0
          ? `<div class="card" style="text-align:center;padding:2.5rem 2rem;color:var(--text-muted,#656565);font-size:0.9rem;">No operators yet. <a href="setup.html" style="color:var(--brand-primary,var(--primary,#0036FF));">Run setup</a> to add yourself as the first operator.</div>`
          : `<div class="team-grid">${operators.map(operatorCardHTML).join('')}</div>`
        }
      </div>
    `;

    window.renderShell(main);
    document.getElementById('invite-email')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); window.__addOperator(); } });
  </script>
</body>
</html>
