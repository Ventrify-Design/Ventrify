<!DOCTYPE html>
<html lang="en" data-brand="verdictscore">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Team — Ventrify OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<!-- BRAND LAYER. Order is load-bearing and brand-map.css documents why:
     the :root variables would resolve from anywhere, but the handful of real
     SELECTORS in brand-map lose to ds.css at equal specificity if ds.css
     loads later. brand.css FIRST (the tokens everything else resolves
     against), brand-map LAST (the M3 role overrides). -->
<link rel="stylesheet" href="../assets/brand/brand.css">
<link rel="stylesheet" href="../shared/m3/theme.css">
<link rel="stylesheet" href="../shared/m3/ds.css">
<!-- The EDITORIAL layer (section-hero, statement/book/coverage lockups, the .mrow row
     system, the eyebrow). Named for the assessment because that is where it was written,
     but it is the shared reading language of the product — the Portfolio already loads it
     and is not an assessment. Without it these pages can only draw boxes: the components
     exist in ds.js and render, but land unstyled. That, not taste, is why they read thin. -->
<link rel="stylesheet" href="../shared/m3/assess-editorial.css">
<link rel="stylesheet" href="../shared/m3/transitions.css">
<link rel="stylesheet" href="../shared/m3/workspace-chrome.css">
<link rel="stylesheet" href="../shared/m3/brand-map.css">
</head>
<body>
<div id="app"></div>
<script src="sample-data.js"></script>
<script src="agents.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  import * as DS from '../shared/m3/ds.js';
  import { personCard, operatorsHero, teamMetrics } from '../shared/m3/workspace-cards.js';
  import { wsNavConfig, wsBrandConfig, wsAccountConfig, mountOrgSwitcherM3 } from './workspace-m3.js';

  await window.WORKSPACE_READY;
  const W = window.WORKSPACE;
  const { operators, org, programs, helpers } = W;
  const isLive = W.mode === 'live';
  const orgName = (org && org.name) || 'your workspace';
  const me = (helpers.currentOperator && helpers.currentOperator()) || {};
  const ownerEmail = String((org && org.ownerEmail) || '').toLowerCase();
  const canManage = !isLive || !!W.isSuperAdmin || (ownerEmail !== '' && String(me.email || '').toLowerCase() === ownerEmail);
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const ERR = { already_operator: 'That email is already an operator.', last_operator: 'You can’t remove the last operator.', bad_email: 'Enter a valid email address.', forbidden: 'Only the workspace owner can manage the team.', not_an_operator: 'That person isn’t an operator.', cannot_remove_owner: 'The workspace owner can’t be removed.' };

  // ---- /api/manage-operator (VERBATIM from team.html) ----
  async function apiOperator(action, email) {
    const { auth } = await import('../firebase/firebase.js');
    const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
    const resp = await fetch('/api/manage-operator', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken, orgId: org.id, action, email }) });
    const d = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(ERR[d.error] || d.error || ('HTTP ' + resp.status));
    return d;
  }
  window.__inviteOperator = () => {
    window.openAux({
      mode: 'push', title: 'Invite operator', subtitle: 'Grant Workspace access',
      body: `<div style="padding:4px 2px">
        <div class="body-m" style="color:var(--md-sys-color-on-surface-variant);margin-bottom:12px">They get a one-click sign-in link to this same workspace.</div>
        ${DS.formField({ label: 'Invite email', id: 'inv-email', type: 'email', placeholder: 'teammate@email.com', attr: ' autocomplete="off"' })}
        <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="m3-btn filled" onclick="window.__addOperator()">Send invite</button></div>
      </div>`
    });
    setTimeout(() => { const i = document.getElementById('inv-email'); if (i) { i.focus(); i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); window.__addOperator(); } }); } }, 60);
  };
  window.__addOperator = async () => {
    const email = ((document.getElementById('inv-email') || {}).value || '').trim().toLowerCase();
    if (!email) { window.__toast('Enter an email address.', true); return; }
    try {
      if (isLive) { const d = await apiOperator('add', email); window.__toast(d.emailSent ? `Invite sent to ${email}` : `${email} added.`); }
      else { const list = W.storage.readJSON('workspace.operators', []); list.push({ id: email, email, name: email.split('@')[0], role: 'Operator', avatar: email.slice(0, 2).toUpperCase(), avatarColor: (org && org.primaryColor) || '#0036FF' }); W.storage.writeJSON('workspace.operators', list); window.__toast(`${email} added`); }
      setTimeout(() => location.reload(), 900);
    } catch (e) { window.__toast(String(e.message || e), true); }
  };
  window.__removeOperator = async (email) => {
    if (!(await window.__confirm({ title: 'Remove operator?', message: `${email} loses Workspace access immediately.`, confirmLabel: 'Remove', danger: true }))) return;
    try {
      if (isLive) await apiOperator('remove', email);
      else W.storage.writeJSON('workspace.operators', W.storage.readJSON('workspace.operators', []).filter(o => (o.email || '').toLowerCase() !== email));
      window.__toast(`${email} removed`); setTimeout(() => location.reload(), 700);
    } catch (e) { window.__toast(String(e.message || e), true); }
  };

  // One card per operator. The aside carries the LOAD — the count as a figure and
  // the ventures by name — because "who is actually carrying what" is the only
  // question this page exists to answer, and it previously read as a grey line of
  // run-together names with no weight at all.
  function operatorCard(op) {
    const assigned = helpers.programsForOperator(op.id);
    const isOwner = ownerEmail !== '' && String(op.email || '').toLowerCase() === ownerEmail;
    const canRemove = canManage && isLive && !op.isCurrentUser && !isOwner && operators.length > 1;
    const names = assigned.length
      ? `<div class="op-load-names">${assigned.map(p => `<span>${esc(p.name)}</span>`).join('')}</div>`
      : `<div class="op-load-none">Nothing assigned yet</div>`;
    return personCard({
      avatar: op.avatar, avatarColor: op.avatarColor, name: op.name, sub: op.email,
      badge: op.isCurrentUser ? DS.statusPill({ kind: 'ok', label: 'You' }) : (isOwner ? DS.statusPill({ kind: 'info', label: 'Owner' }) : ''),
      pill: DS.statusPill({ kind: 'info', label: op.role }),
      action: canRemove ? `<button class="m3-btn text" style="color:var(--md-sys-color-error)" onclick="window.__removeOperator('${esc(op.email)}')">Remove</button>` : '',
      aside: `<div class="op-load">
        <div class="op-load-n${assigned.length ? '' : ' dim'}">${assigned.length}</div>
        <div class="op-load-b"><div class="op-load-l">${assigned.length === 1 ? 'venture carried' : 'ventures carried'}</div>${names}</div>
      </div>`,
    });
  }

  // Ranked heaviest-first, so the hero's claim about the load and the order of the
  // roster below it are the same statement read twice — not two orders to reconcile.
  const m = teamMetrics(operators, programs, org);
  const roster = m.ranked.map(r => r.op);
  const body = `<div class="brief">
    ${operatorsHero(operators, programs, org)}
    ${operators.length
      ? `<div class="ws-grid">${roster.map(operatorCard).join('')}</div>`
      : `<div class="m3-card" style="text-align:center;padding:40px;color:var(--md-sys-color-on-surface-variant)">No operators yet.</div>`}
  </div>`;

  document.getElementById('app').outerHTML = DS.pageShell({
    active: 'team', nav: wsNavConfig(), brand: wsBrandConfig(), account: wsAccountConfig(),
    masthead: DS.masthead({ eyebrow: 'Team', headline: orgName, actions: canManage ? [{ variant: 'filled', icon: 'person_add', label: 'Invite operator', onclick: 'window.__inviteOperator()' }] : [] }),
    body
  });
  DS.initShell();
  mountOrgSwitcherM3();
</script>
</body>
</html>
