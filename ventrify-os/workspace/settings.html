<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="agents.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    await window.WORKSPACE_READY;
    const W = window.WORKSPACE;
    const { org, operators, programs, storage } = W;

    // Defensive: if no org yet (shouldn't happen post-setup, but) show prompt
    if (!org) {
      window.renderShell(`
        <div style="text-align:center;padding:5rem 2rem;">
          <h1 style="font-size:1.4rem;margin-bottom:0.5rem;color:var(--text,#141414);">No organisation configured</h1>
          <p style="margin-bottom:1.5rem;color:var(--text-muted,#656565);">Run the first-time setup to create your organisation before opening settings.</p>
          <a href="setup.html" class="btn btn-primary">Open setup</a>
        </div>
      `);
      throw new Error('halt-render');
    }

    // -------- Helpers ---------------------------------------------------
    function initialsOf(s) {
      const parts = (s || '').trim().split(/\s+/);
      const a = (parts[0] || '?')[0] || '?';
      const b = parts.length > 1 ? (parts[parts.length - 1][0] || '') : '';
      return (a + b).toUpperCase().slice(0, 2);
    }

    // Persist a brand patch where it belongs: Firestore (live, applies to the whole
    // org) via the operator-only API, or localStorage (demo/local).
    async function persistPatch(patch) {
      if (W.mode === 'live') {
        const { auth } = await import('../firebase/firebase.js');
        const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
        const resp = await fetch('/api/update-org', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken, orgId: org.id, patch })
        });
        const d = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(d.error === 'logo_too_large' ? 'That logo is too large — use an image under ~300KB or an SVG.' : (d.error || ('HTTP ' + resp.status)));
      } else {
        storage.writeJSON('workspace.organisation', { ...org, ...patch });
      }
    }

    // Re-apply the brand live (CSS var + topbar) without a reload.
    function applyBrandLive(patch) {
      if (patch.primaryColor) {
        const tag = document.getElementById('org-brand-vars') || (() => { const t = document.createElement('style'); t.id = 'org-brand-vars'; document.head.appendChild(t); return t; })();
        tag.textContent = `:root { --brand-primary: ${patch.primaryColor}; --primary: ${patch.primaryColor}; }`;
      }
      if (patch.name !== undefined || patch.logoUrl !== undefined || patch.primaryColor !== undefined) updateTopbarBrand();
    }

    // Optimistic: apply locally, persist, toast (or surface the error).
    function saveOrgPatch(patch) {
      Object.assign(org, patch);
      applyBrandLive(patch);
      persistPatch(patch).then(() => flashSaved()).catch(e => flashSaved(String(e.message || e), true));
    }

    function updateTopbarBrand() {
      const brandLogo = document.querySelector('.topbar-logo-branded .topbar-logo-mark');
      const brandName = document.querySelector('.topbar-logo-branded .topbar-logo-name');
      if (brandLogo) {
        brandLogo.setAttribute('style', `background:${org.primaryColor || '#0036FF'};`);
        if (org.logoUrl) {
          brandLogo.innerHTML = `<img src="${org.logoUrl}" alt="${org.name}">`;
        } else {
          brandLogo.innerHTML = `<span class="topbar-logo-mark-text">${initialsOf(org.name)}</span>`;
        }
      }
      if (brandName) brandName.textContent = org.name;
      // Topbar tier pill / "Powered by" stays static (those are inline texts).
    }

    function flashSaved(msg, isError) {
      let t = document.getElementById('settings-saved-toast');
      if (!t) { t = document.createElement('div'); t.id = 'settings-saved-toast'; t.className = 'settings-toast'; document.body.appendChild(t); }
      t.innerHTML = isError ? `<span style="font-size:0.65rem;">&#9888;</span> ${msg || 'Could not save'}` : '<span style="font-size:0.65rem;">✓</span> Saved';
      t.style.background = isError ? 'var(--danger,#C0392B)' : '';
      t.classList.remove('hide');
      t.classList.add('show');
      clearTimeout(t._hideTimer);
      t._hideTimer = setTimeout(() => {
        t.classList.remove('show');
        t.classList.add('hide');
      }, isError ? 2800 : 1400);
    }

    // -------- Card markup ----------------------------------------------
    const brandCard = `
      <div class="settings-card span-2">
        <h3>Brand kit</h3>
        <p class="text-small dim" style="margin-bottom:1.25rem;">Your name, primary colour, and logo render across the Workspace topbar and every Studio belonging to your organisation. Changes apply live and save instantly.</p>

        <div class="settings-field">
          <label class="settings-label" for="brand-name">Organisation name</label>
          <input class="settings-input" id="brand-name" type="text" value="${(org.name || '').replace(/"/g, '&quot;')}">
        </div>

        <div class="settings-field">
          <label class="settings-label">Primary colour</label>
          <div class="color-row">
            ${['#0036FF','#7A3FFF','#00B8A0','#FF3F7A','#FF7A3F','#141414'].map(c => `
              <span class="color-swatch ${(org.primaryColor || '').toUpperCase() === c.toUpperCase() ? 'selected' : ''}"
                    data-color="${c}" style="background:${c};"></span>
            `).join('')}
            <div class="color-input-wrap">
              <input type="color" id="brand-color-pick" value="${org.primaryColor || '#0036FF'}">
              <input type="text" id="brand-color-hex" value="${(org.primaryColor || '#0036FF').toUpperCase()}" maxlength="7">
            </div>
          </div>
        </div>

        <div class="settings-field">
          <label class="settings-label">Logo</label>
          <div class="logo-dropzone" id="brand-logo-dropzone" onclick="document.getElementById('brand-logo-input').click()">
            <div class="logo-preview" id="brand-logo-preview" style="background:${org.primaryColor || 'rgba(0,0,0,0.05)'};color:#fff;">
              ${org.logoUrl ? `<img src="${org.logoUrl}" alt="logo">` : `<span>${initialsOf(org.name)}</span>`}
            </div>
            <div class="logo-dropzone-body">
              <div class="logo-dropzone-title">${org.logoUrl ? 'Click to replace' : 'Click to upload'}</div>
              <div class="logo-dropzone-sub">PNG or SVG. Square works best.</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button type="button" class="logo-trigger" onclick="event.stopPropagation(); document.getElementById('brand-logo-input').click();">Upload</button>
              ${org.logoUrl ? `<button type="button" class="logo-trigger" onclick="event.stopPropagation(); window.__removeLogo();" style="color:var(--danger,#c0392b);">Remove</button>` : ''}
            </div>
            <input type="file" id="brand-logo-input" class="logo-input" accept="image/png,image/svg+xml,image/jpeg">
          </div>
        </div>
      </div>
    `;

    const orgCard = `
      <div class="settings-card">
        <h3>Organisation</h3>
        <div class="settings-row"><span class="l">Slug</span><span class="v text-mono">${org.slug || '—'}</span></div>
        <div class="settings-row"><span class="l">Workspace URL</span><span class="v text-mono">ventrify.io/${org.slug || 'workspace'}</span></div>
        <div class="settings-row"><span class="l">Created</span><span class="v">${org.createdAt ? new Date(org.createdAt).toLocaleDateString() : '—'}</span></div>
        <div class="settings-row"><span class="l">Custom domain</span><span class="v dim">Enterprise only</span></div>
      </div>
    `;

    const tierCard = `
      <div class="settings-card">
        <h3>Licence &amp; capacity</h3>
        <div class="settings-row"><span class="l">Tier</span><span class="v">${org.tier}</span></div>
        <div class="settings-row"><span class="l">Operators</span><span class="v">${operators.length} of ${org.operatorSeatsLimit || 'Unlimited'}</span></div>
        <div class="settings-row"><span class="l">Engagements running</span><span class="v">${programs.length} of ${org.programsLimit || 'Unlimited'}</span></div>
        <div style="margin-top:1rem;display:flex;gap:0.5rem;">
          <a href="../pricing.html" class="btn btn-outline btn-sm">View pricing</a>
          <a href="mailto:hello@ventrify.io?subject=Upgrade%20tier" class="btn btn-ghost btn-sm">Talk to us</a>
        </div>
      </div>
    `;

    const integrationsCard = `
      <div class="settings-card">
        <h3>Integrations</h3>
        <p class="text-small dim" style="margin-bottom:0.85rem;">Used to provision engagement repos and Studio access for founders. Wiring goes live in the next milestone.</p>
        <div class="settings-row"><span class="l">GitHub (engagement repos)</span><span class="v pill">Not connected</span></div>
        <div class="settings-row"><span class="l">Firebase (Studio + auth)</span><span class="v pill">Not connected</span></div>
        <div class="settings-row"><span class="l">Stripe (billing)</span><span class="v pill">Not connected</span></div>
        <div class="settings-row"><span class="l">Slack notifications</span><span class="v pill">Not connected</span></div>
      </div>
    `;

    const dangerCard = `
      <div class="settings-card settings-card-danger">
        <h3>Danger zone</h3>
        <p class="text-small dim" style="margin-bottom:0.85rem;">Wipes every locally-stored value &mdash; organisation, operators, engagements, action queue, demo flag &mdash; and returns to first-run setup.</p>
        <button class="btn btn-outline btn-sm" onclick="window.__resetWorkspace()" style="color:var(--danger,#c0392b);border-color:rgba(192,57,43,0.3);">Clear all workspace data</button>
      </div>
    `;

    const main = `
      <div class="page-header">
        <div class="page-eyebrow">Settings</div>
        <h1 class="page-title">Workspace settings</h1>
        <p class="page-sub">Organisation, brand kit, licence and integrations for ${org.name}.</p>
      </div>

      <div class="settings-grid">
        ${brandCard}
        ${orgCard}
        ${tierCard}
        ${integrationsCard}
        ${dangerCard}
      </div>
    `;

    window.renderShell(main);

    // -------- Bindings --------------------------------------------------
    // Brand name — save on blur (after typing)
    const nameInput = document.getElementById('brand-name');
    if (nameInput) {
      nameInput.addEventListener('blur', () => {
        const next = nameInput.value.trim();
        if (next && next !== org.name) saveOrgPatch({ name: next });
        // Update logo placeholder text if no logo
        if (!org.logoUrl) {
          const text = document.querySelector('#brand-logo-preview span');
          if (text) text.textContent = initialsOf(org.name);
        }
      });
    }

    // Colour — swatch / picker / hex all stay in sync and save instantly
    function applyColor(hex) {
      if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
      const up = hex.toUpperCase();
      saveOrgPatch({ primaryColor: up });
      document.getElementById('brand-color-pick').value = up;
      document.getElementById('brand-color-hex').value = up;
      document.querySelectorAll('.color-swatch').forEach(s => {
        s.classList.toggle('selected', s.dataset.color.toUpperCase() === up);
      });
      const preview = document.getElementById('brand-logo-preview');
      if (preview) preview.style.background = up;
    }
    document.querySelectorAll('.color-swatch').forEach(s => {
      s.addEventListener('click', () => applyColor(s.dataset.color));
    });
    document.getElementById('brand-color-pick')?.addEventListener('input', e => applyColor(e.target.value));
    document.getElementById('brand-color-hex')?.addEventListener('change', e => applyColor(e.target.value));

    // SVG passes through (small); raster is downscaled to ≤256px PNG so the data URL
    // stays well within the org doc's size budget.
    function readDataUrl(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error('read failed')); r.readAsDataURL(file); }); }
    async function processLogo(file) {
      if (file.type === 'image/svg+xml') return readDataUrl(file);
      const src = await readDataUrl(file);
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('not an image')); i.src = src; });
      const scale = Math.min(1, 256 / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      return c.toDataURL('image/png');
    }
    // Logo upload
    document.getElementById('brand-logo-input')?.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await processLogo(file);
        Object.assign(org, { logoUrl: dataUrl });
        applyBrandLive({ logoUrl: dataUrl });
        await persistPatch({ logoUrl: dataUrl });
        window.location.reload();   // reflect Remove button + new preview
      } catch (err) { flashSaved(String((err && err.message) || err), true); }
    });
    window.__removeLogo = async function() {
      if (!window.confirm('Remove the logo? The Workspace will fall back to your initials.')) return;
      try { Object.assign(org, { logoUrl: null }); await persistPatch({ logoUrl: null }); window.location.reload(); }
      catch (err) { flashSaved(String((err && err.message) || err), true); }
    };
  </script>
</body>
</html>
