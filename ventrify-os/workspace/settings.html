<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="app.js"></script>
  <script>
    const W = window.WORKSPACE;
    const { org, operators, programs } = W;

    const main = `
      <div class="page-header">
        <div class="page-eyebrow">Settings</div>
        <h1 class="page-title">Workspace settings</h1>
        <p class="page-sub">Organisation, licence, billing, and integration controls for ${org.name}.</p>
      </div>

      <div class="settings-grid">
        <div class="settings-card">
          <h3>Organisation</h3>
          <div class="settings-row"><span class="l">Name</span><span class="v">${org.name}</span></div>
          <div class="settings-row"><span class="l">Workspace URL</span><span class="v text-mono text-small">ventrify.io/workspace/mercer</span></div>
          <div class="settings-row"><span class="l">Time zone</span><span class="v">Europe/London</span></div>
          <div class="settings-row"><span class="l">Default currency</span><span class="v">USD</span></div>
        </div>

        <div class="settings-card">
          <h3>Licence &amp; capacity</h3>
          <div class="settings-row"><span class="l">Tier</span><span class="v">${org.tier} <span class="pill pill-primary" style="margin-left:6px;">Most popular</span></span></div>
          <div class="settings-row"><span class="l">Operators</span><span class="v">${operators.length} of ${org.operatorSeatsLimit}</span></div>
          <div class="settings-row"><span class="l">Programs running</span><span class="v">${programs.length} of ${org.programsLimit}</span></div>
          <div class="settings-row"><span class="l">Renewal date</span><span class="v">${org.renewalDate}</span></div>
          <div style="margin-top:1rem;display:flex;gap:0.5rem;">
            <a href="../pricing.html" class="btn btn-outline btn-sm">View pricing</a>
            <a href="mailto:hello@ventrify.io?subject=Upgrade%20tier" class="btn btn-ghost btn-sm">Talk to us</a>
          </div>
        </div>

        <div class="settings-card">
          <h3>Success contact</h3>
          <div style="display:flex;gap:12px;align-items:center;padding:0.5rem 0;">
            <div class="avatar avatar-lg" style="background:#7A3FFF;">NP</div>
            <div>
              <div style="font-weight:600;">${org.successContact.name}</div>
              <div class="text-small dim">${org.successContact.email}</div>
            </div>
          </div>
          <p class="text-small dim" style="margin-top:0.75rem;">Cohort &amp; Enterprise tiers include a dedicated success contact for onboarding, escalations, and quarterly reviews.</p>
          <button class="btn btn-outline btn-sm" style="margin-top:0.75rem;">Book a check-in</button>
        </div>

        <div class="settings-card">
          <h3>Billing</h3>
          <div class="settings-row"><span class="l">Plan</span><span class="v">${org.tier} &middot; $48,000/yr</span></div>
          <div class="settings-row"><span class="l">Next invoice</span><span class="v">${org.renewalDate} &middot; $48,000</span></div>
          <div class="settings-row"><span class="l">Payment method</span><span class="v text-mono">Bank transfer (PO)</span></div>
          <div class="settings-row"><span class="l">VAT / tax ID</span><span class="v">GB123456789</span></div>
          <div style="margin-top:1rem;">
            <button class="btn btn-outline btn-sm">Download last invoice</button>
          </div>
        </div>

        <div class="settings-card">
          <h3>Integrations</h3>
          <div class="settings-row"><span class="l">Founder portal</span><span class="v pill pill-success"><span class="dot"></span>Connected</span></div>
          <div class="settings-row"><span class="l">Engagement repos (GitHub)</span><span class="v pill pill-success"><span class="dot"></span>Connected</span></div>
          <div class="settings-row"><span class="l">Stripe (founder payments)</span><span class="v pill pill-success"><span class="dot"></span>Connected</span></div>
          <div class="settings-row"><span class="l">Slack notifications</span><span class="v pill">Not connected</span></div>
        </div>

        <div class="settings-card">
          <h3>Branding</h3>
          <p class="text-small dim" style="margin-bottom:0.85rem;">White-label your Workspace and founder portals. Available on Enterprise tier.</p>
          <div class="settings-row"><span class="l">Workspace branding</span><span class="v">Ventrify default</span></div>
          <div class="settings-row"><span class="l">Custom domain</span><span class="v dim">Available on Enterprise</span></div>
          <a href="mailto:hello@ventrify.io?subject=White-label%20enquiry" class="btn btn-ghost btn-sm" style="margin-top:0.85rem;">Talk about white-label &rarr;</a>
        </div>
      </div>
    `;

    window.renderShell(main);
  </script>
</body>
</html>
