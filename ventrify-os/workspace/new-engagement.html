<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New engagement — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="app.js"></script>
  <script>
    const W = window.WORKSPACE;
    const { operators, helpers, org } = W;

    // Every engagement on a Ventrify OS licence earns the full deliverable scope.
    // The org's licence tier determines program *volume* (set at setup), not what
    // each engagement contains. So the wizard no longer asks the operator to pick
    // a tier — the org has one already.
    const ALL_HUBS = [
      { id: 'research', name: 'Research Hub', detail: 'L1 cards + L2 evidence + L3 research', required: true },
      { id: 'vision', name: 'Vision Hub', detail: 'Personas, MVP, IA · Gate 2 sign-off' },
      { id: 'strategy', name: 'Strategy Hub', detail: 'Tone of voice, social, 30-day calendar' },
      { id: 'financials', name: 'Financials Hub', detail: '11 files · Gate 2.5 sign-off' },
      { id: 'marketing', name: 'Marketing Launch Hub', detail: 'Launch coordination + assets' },
      { id: 'video', name: 'Video Hub', detail: 'Brief + production assets' },
      { id: 'blog', name: 'Blog Hub', detail: 'Blog content + promo posts' }
    ];

    const AGENT_NAMES = [
      // Core / Substrate (3)
      'founder-lexicon-keeper','workflow-orchestrator','agent-output-validator',
      // Design (7)
      'brand-designer','ux-designer','ui-component-designer','motion-designer',
      'iconography-designer','accessibility-reviewer','design-system-curator',
      // Content (7)
      'copywriter','social-writer','blog-writer','email-writer',
      'pitch-scriptwriter','app-microcopy-writer','copy-reviewer',
      // Visual Production (7)
      'screenshot-cinematographer','graphics-designer','illustrator','photography-curator',
      'app-mockup-composer','video-producer','app-store-marketer',
      // Operations (7)
      'information-architect','backend-architect','engagement-health-monitor','handoff-coordinator',
      'tier-compliance-auditor','portal-publisher','compliance-checker',
      // QA (7)
      'consistency-checker','qa:lexicon','qa:visual','qa:investor-readiness',
      'qa:accessibility','source-verifier','qa:scope-loop-reviewer',
      // Business (9)
      'research-curator','financial-modeler','investor-readiness-reviewer','comparables-researcher',
      'cohort-analyst','tdk-investability-scorer','positioning-strategist','gtm-strategist','pricing-strategist'
    ];

    const INDUSTRIES = ['Climate / Energy','Healthtech','B2B SaaS','Consumer audio','Fintech','Edtech','Consumer','PropTech','LegalTech','Other'];

    // Initial form state
    const opDefault = (helpers.currentOperator() || operators[0] || {}).id || '';
    const state = {
      step: 1,
      basics: { name: '', pitch: '', industry: 'Fintech', founderName: '', founderEmail: '' },
      start: new Date().toISOString().slice(0,10),
      operator: opDefault,
      hubs: ALL_HUBS.map(h => h.id), // default: every hub on
      brand: 'generate'
    };

    function slugify(s) {
      return (s || '').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').slice(0,40) || 'new-venture';
    }
    function initialsOf(s) {
      const parts = (s || '').trim().split(/\s+/);
      const a = (parts[0] || '?')[0] || '?';
      const b = parts.length > 1 ? (parts[parts.length-1][0] || '') : '';
      return (a + b).toUpperCase().slice(0,2);
    }

    function renderProgress() {
      const steps = ['Basics','Workflow','Brand','Launch'];
      let html = '<div class="wizard-progress">';
      steps.forEach((label, i) => {
        const idx = i+1;
        const cls = idx < state.step ? 'done' : (idx === state.step ? 'active' : '');
        if (i > 0) html += `<div class="wizard-step-connector ${idx <= state.step ? 'done' : ''}"></div>`;
        html += `
          <div class="wizard-step-dot ${cls}">
            <div class="dot">${idx < state.step ? '&#10003;' : idx}</div>
            <div class="label">${label}</div>
          </div>`;
      });
      html += '</div>';
      return html;
    }

    function step1HTML() {
      return `
        <div class="wizard-step active">
          <div class="wizard-eyebrow">Step 01 · Basics</div>
          <h1 class="wizard-step-title">Tell us about the venture.</h1>
          <p class="wizard-step-sub">This becomes the engagement record across the data room hubs, the Studio, and the local engagement repo.</p>

          <div class="wiz-grid">
            <div class="wiz-field span-2">
              <label class="wiz-label">Venture name</label>
              <input class="wiz-input" id="f-name" placeholder="e.g. MoneyGym" value="${state.basics.name}">
            </div>
            <div class="wiz-field span-2">
              <label class="wiz-label">One-line pitch</label>
              <textarea class="wiz-textarea" id="f-pitch" placeholder="A behavioural finance app that treats debt repayment like fitness training.">${state.basics.pitch}</textarea>
            </div>
            <div class="wiz-field">
              <label class="wiz-label">Industry</label>
              <select class="wiz-select" id="f-industry">
                ${INDUSTRIES.map(i => `<option ${i===state.basics.industry?'selected':''}>${i}</option>`).join('')}
              </select>
            </div>
            <div class="wiz-field">
              <label class="wiz-label">Founder name</label>
              <input class="wiz-input" id="f-founder" placeholder="e.g. Inez Okonkwo" value="${state.basics.founderName}">
            </div>
            <div class="wiz-field span-2">
              <label class="wiz-label">Founder email</label>
              <input class="wiz-input" type="email" id="f-email" placeholder="inez@moneygym.io" value="${state.basics.founderEmail}">
            </div>
            <div class="wiz-field">
              <label class="wiz-label">Start date</label>
              <input class="wiz-input" type="date" id="f-start" value="${state.start}">
            </div>
            <div class="wiz-field">
              <label class="wiz-label">Assigned program manager</label>
              <select class="wiz-select" id="f-operator">
                ${operators.length ? operators.map(o => `<option value="${o.id}" ${o.id === state.operator ? 'selected' : ''}>${o.name} · ${o.role}</option>`).join('') : '<option>No operators yet</option>'}
              </select>
            </div>
          </div>
        </div>`;
    }

    function step2HTML() {
      const orgName = (org && org.name) || 'Your organisation';
      return `
        <div class="wizard-step active">
          <div class="wizard-eyebrow">Step 02 · Workflow scope</div>
          <h1 class="wizard-step-title">Activate the hubs.</h1>
          <p class="wizard-step-sub">Each hub becomes a live data room in the Studio &mdash; rendered as L1 Provocation Cards · L2 Evidence · L3 Full Research. Research is always on. Untick anything ${orgName} won&rsquo;t need for this venture.</p>

          <div class="hub-checklist" id="hub-list">
            ${ALL_HUBS.map(h => {
              const checked = state.hubs.includes(h.id);
              return `
                <div class="hub-check ${checked ? 'checked' : ''} ${h.required ? 'required' : ''}" data-hub="${h.id}">
                  <div class="hub-check-box"></div>
                  <div class="hub-check-text">
                    <div class="hub-check-name">${h.name} ${h.required ? '<span class="text-mono dim" style="font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;margin-left:6px;">required</span>' : ''}</div>
                    <div class="hub-check-detail">${h.detail}</div>
                  </div>
                </div>`;
            }).join('')}
          </div>

          <div style="margin-top:2.5rem;">
            <div class="wiz-label" style="margin-bottom:0.75rem;">Specialist agents activated &middot; 47 of 47 · 7 domains</div>
            <div class="agents-activated">
              ${AGENT_NAMES.map(a => `<span class="agent-pill">${a}</span>`).join('')}
            </div>
          </div>
        </div>`;
    }

    function step3HTML() {
      return `
        <div class="wizard-step active">
          <div class="wizard-eyebrow">Step 03 · Brand kit</div>
          <h1 class="wizard-step-title">Where does the brand come from?</h1>
          <p class="wizard-step-sub">If the founder has an existing brand, we&rsquo;ll use it. Otherwise <code>brand-designer</code> generates a candidate kit during Phase 0 &mdash; tokens, type, voice &mdash; that the founder reviews and signs off before Phase 1.</p>

          <div class="brand-decision">
            <div class="brand-card ${state.brand === 'existing' ? 'selected' : ''}" data-brand="existing">
              <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <h4>Founder has an existing brand kit</h4>
              <p>Upload logos, type, colours, voice. The fleet references them across every deliverable.</p>
            </div>
            <div class="brand-card ${state.brand === 'generate' ? 'selected' : ''}" data-brand="generate">
              <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="4"/></svg>
              </div>
              <h4>Generate a new brand kit</h4>
              <p>Phase 0 produces a candidate brand from the brief. Founder approves before Phase 1 unlocks.</p>
            </div>
          </div>
        </div>`;
    }

    function step4HTML() {
      const slug = slugify(state.basics.name);
      const op = helpers.getOperator(state.operator);
      const orgName = (org && org.name) || 'your organisation';
      const orgSlug = (org && org.slug) || 'your-org';
      const opName = op ? op.name : '—';
      return `
        <div class="wizard-step active">
          <div class="wizard-eyebrow">Step 04 · Launch</div>
          <h1 class="wizard-step-title">Here&rsquo;s what gets created.</h1>
          <p class="wizard-step-sub">An engagement record in your Workspace, a Studio at the venture slug, and a local engagement repo &mdash; scaffolded from the Ventrify template with all 47 agents armed.</p>

          <div class="preview-card">
            <h4>Engagement summary</h4>
            <div class="preview-row"><span class="l">Venture</span><span class="v">${state.basics.name || 'Untitled'}</span></div>
            <div class="preview-row"><span class="l">Founder</span><span class="v">${state.basics.founderName || '—'} · ${state.basics.founderEmail || '—'}</span></div>
            <div class="preview-row"><span class="l">Industry</span><span class="v">${state.basics.industry}</span></div>
            <div class="preview-row"><span class="l">Operating org</span><span class="v">${orgName}</span></div>
            <div class="preview-row"><span class="l">Start date</span><span class="v">${state.start}</span></div>
            <div class="preview-row"><span class="l">Program manager</span><span class="v">${opName}</span></div>
            <div class="preview-row"><span class="l">Hubs activated</span><span class="v">${state.hubs.length} of 7</span></div>
            <div class="preview-row"><span class="l">Agents engaged</span><span class="v">47 specialists · 7 domains</span></div>
            <div class="preview-row"><span class="l">Brand kit</span><span class="v">${state.brand === 'existing' ? 'Founder-supplied' : 'Generated in Phase 0'}</span></div>
          </div>

          <div class="preview-card">
            <h4>Local engagement repo</h4>
            <p class="preview-card-sub">Cloned from <code>ventrify-engagement-template</code>. Contains the full 47-agent fleet, 18 tool directories, and the seven hub trees ready for Phase 0.</p>
            <div class="preview-tree"><span class="dir">/${slug}-engagement/</span>
├── <span class="dir">CLAUDE.md</span>          <span class="cmt">← operating backbone</span>
├── <span class="dir">tenant.json</span>        <span class="cmt">← ${orgName}</span>
├── <span class="dir">engagement.json</span>    <span class="cmt">← ${state.basics.name || 'this venture'}</span>
├── <span class="dir">brief.md</span>           <span class="cmt">← from intake</span>
├── <span class="dir">/.claude/agents/</span>   <span class="cmt">← 47 agents · 7 domains</span>
├── <span class="dir">/tools/</span>            <span class="cmt">← 18 substrate tools</span>
├── <span class="dir">/research/</span>         <span class="cmt">← L1/L2/L3 → Research Hub</span>
├── <span class="dir">/define/</span>           <span class="cmt">← → Vision Hub</span>
├── <span class="dir">/strategy/</span>         <span class="cmt">← → Strategy Hub</span>
├── <span class="dir">/financials/</span>       <span class="cmt">← 11 files → Financials Hub</span>
├── <span class="dir">/marketing/</span>        <span class="cmt">← tone, calendar, posts</span>
├── <span class="dir">/video/</span>            <span class="cmt">← script, audio brief, scenes</span>
├── <span class="dir">/brand/</span>            <span class="cmt">← tokens.json, logo, imagery</span>
├── <span class="dir">/product/</span>          <span class="cmt">← MVP app · DEMO_MODE</span>
├── <span class="dir">/website/</span>          <span class="cmt">← marketing site (Next.js)</span>
├── <span class="dir">/design-system/</span>    <span class="cmt">← live DS site</span>
└── <span class="dir">/figma-plugins/</span>    <span class="cmt">← 3 Figma plugins</span></div>
          </div>

          <div class="preview-card">
            <h4>The Studio</h4>
            <div class="preview-row"><span class="l">Studio URL</span><span class="v mono">studio.ventrify.io/${orgSlug}/${slug}</span></div>
            <div class="preview-row"><span class="l">Access invite</span><span class="v mono">${state.basics.founderEmail || 'founder@example.com'}</span></div>
            <div class="preview-row"><span class="l">Branding</span><span class="v">Inherits ${orgName} brand kit</span></div>
            <div class="preview-row"><span class="l">Status</span><span class="v">Goes live within sixty seconds of Launch</span></div>
          </div>
        </div>`;
    }

    // ---------------- Success / launch confirmation screen --------------
    function successHTML(programId, slug) {
      const orgSlug = (org && org.slug) || 'your-org';
      const orgName = (org && org.name) || 'your organisation';
      return `
        <div class="success-shell">
          <div class="success-icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h1 class="success-title">Engagement launched.</h1>
          <p class="success-sub"><strong>${state.basics.name}</strong> is now in <strong>Phase 0 · Intake</strong>. The Studio will go live for ${state.basics.founderEmail || 'the founder'} within sixty seconds. Below is the one-time local setup &mdash; copy and run this on the operator&rsquo;s machine to scaffold the engagement repo.</p>

          <div class="launch-cmd-card">
            <div class="launch-cmd-head">
              <span class="launch-cmd-eyebrow">Local setup &middot; one command</span>
              <button class="launch-cmd-copy" onclick="window.__copyLaunchCmd(this)">Copy</button>
            </div>
            <pre class="launch-cmd" id="launch-cmd"># 1. Clone the template
cp -R ~/Desktop/ventrify-engagement-template ~/Desktop/${slug}-engagement
cd ~/Desktop/${slug}-engagement

# 2. Fill in placeholders from this engagement
node tools/init.js \\
  --org "${orgName}" --org-slug "${orgSlug}" \\
  --venture "${state.basics.name}" --venture-slug "${slug}" \\
  --founder "${state.basics.founderName}" --founder-email "${state.basics.founderEmail}" \\
  --industry "${state.basics.industry}" --tier "${(org && org.tier) || 'Cohort'}"

# 3. Install deps + push to your GitHub org
npm install
git init && git add -A && git commit -m "${slug} engagement scaffolded from Ventrify template"
gh repo create ${orgSlug}/${slug}-engagement --private --source=. --remote=origin --push

# 4. Open in Claude Code → workflow-orchestrator opens Phase 0 automatically
claude code .</pre>
          </div>

          <div class="launch-next">
            <h4>What happens next</h4>
            <ul>
              <li><strong>Founder receives Studio invite</strong> — magic link emailed to ${state.basics.founderEmail || 'the founder'} within sixty seconds.</li>
              <li><strong>Welcome Pack PDF queued</strong> — generated by <code>handoff:assemble</code>, sent with the Studio invite.</li>
              <li><strong>workflow-orchestrator runs first briefing</strong> — by tomorrow morning, you&rsquo;ll see ${state.basics.name || 'this venture'} in your Today queue with the next action.</li>
              <li><strong>research-curator drafts L1 cards</strong> — once the brief intake is signed in the Studio, the first 5&ndash;7 Research Hub Provocation Cards drop.</li>
            </ul>
          </div>

          <div class="success-actions">
            <a href="program.html?id=${programId}" class="btn btn-primary">Open engagement &rarr;</a>
            <a href="dashboard.html" class="btn btn-outline">Back to Portfolio</a>
          </div>
        </div>`;
    }

    // Copy-to-clipboard for the launch command
    window.__copyLaunchCmd = function(btn) {
      const text = document.getElementById('launch-cmd').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    };

    function canAdvance() {
      if (state.step === 1) {
        const b = state.basics;
        return !!(b.name.trim() && b.founderName.trim() && b.founderEmail.trim() && state.operator);
      }
      if (state.step === 2) return state.hubs.length > 0;
      return true;
    }

    function navHTML() {
      const onLast = state.step === 4;
      const advanceLabel = onLast ? 'Launch engagement' : 'Continue';
      return `
        <div class="wizard-actions">
          <div class="left">
            ${state.step > 1 ? '<button class="btn btn-ghost" id="btn-back">&larr; Back</button>' : ''}
            <a href="dashboard.html" class="btn btn-ghost">Cancel</a>
          </div>
          <button class="btn btn-primary" id="btn-next" ${canAdvance() ? '' : 'disabled style="opacity:0.5;cursor:not-allowed;"'}>${advanceLabel}</button>
        </div>`;
    }

    function readBasics() {
      const m = el => document.getElementById(el);
      state.basics.name = m('f-name')?.value || '';
      state.basics.pitch = m('f-pitch')?.value || '';
      state.basics.industry = m('f-industry')?.value || 'Fintech';
      state.basics.founderName = m('f-founder')?.value || '';
      state.basics.founderEmail = m('f-email')?.value || '';
      state.start = m('f-start')?.value || state.start;
      state.operator = m('f-operator')?.value || state.operator;
    }

    function persistAndLaunch() {
      const slug = slugify(state.basics.name);
      const programId = 'prg-' + slug + '-' + Math.random().toString(36).slice(2, 6);
      const op = helpers.getOperator(state.operator);
      const newProgram = {
        id: programId,
        slug,
        name: state.basics.name,
        founderName: state.basics.founderName,
        founderAvatar: initialsOf(state.basics.founderName) || 'FF',
        founderAvatarColor: (org && org.primaryColor) || '#0036FF',
        industry: state.basics.industry,
        venturePitch: state.basics.pitch || 'Newly initialised on Ventrify OS.',
        phase: 0,
        gateStatus: 'Phase 0 · welcome pack queued',
        startDate: state.start,
        daysActive: 0,
        lastActivity: 'just now',
        lastActivityDetail: 'Engagement launched via Workspace wizard',
        assignedOperator: state.operator,
        organisationSlug: (org && org.slug) || null,
        health: 'on-track',
        cards: { drafted: 0, awaitingFounder: 0, resolved: 0, awaitingL3Rebuild: 0 },
        hubs: ALL_HUBS.reduce((acc, h) => {
          acc[h.id] = state.hubs.includes(h.id) ? { status: 'pending' } : { status: 'disabled' };
          return acc;
        }, {}),
        mvpDemoModeReady: false,
        brand: state.brand,
        createdAt: new Date().toISOString()
      };
      try {
        const stored = JSON.parse(localStorage.getItem('workspace.programs') || '[]');
        stored.unshift(newProgram);
        localStorage.setItem('workspace.programs', JSON.stringify(stored));
      } catch(e) {}
      return { programId, slug };
    }

    function render() {
      const stepFns = { 1: step1HTML, 2: step2HTML, 3: step3HTML, 4: step4HTML };
      const main = `
        <div class="wizard-shell">
          <a href="dashboard.html" class="text-small dim" style="font-size:0.85rem;display:inline-block;margin-bottom:1rem;">&larr; Cancel and return to Portfolio</a>
          ${renderProgress()}
          ${stepFns[state.step]()}
          ${navHTML()}
        </div>`;
      window.renderShell(main);
      bind();
    }

    function bind() {
      // Step 2 — hub toggles
      document.querySelectorAll('[data-hub]').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.getAttribute('data-hub');
          if (id === 'research') return; // required
          if (state.hubs.includes(id)) state.hubs = state.hubs.filter(h => h !== id);
          else state.hubs.push(id);
          render();
        });
      });
      // Step 3 — brand decision
      document.querySelectorAll('[data-brand]').forEach(card => {
        card.addEventListener('click', () => {
          state.brand = card.getAttribute('data-brand');
          render();
        });
      });
      // Step 1 inputs — keep state in sync and toggle the Continue button's
      // disabled state. IMPORTANT: do NOT call bind() from inside an input
      // handler — that re-attaches listeners on top of existing ones and the
      // count doubles every keystroke, freezing the browser within seconds.
      ['f-name','f-pitch','f-industry','f-founder','f-email','f-start','f-operator'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const evt = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
        el.addEventListener(evt, () => {
          readBasics();
          const btn = document.getElementById('btn-next');
          if (!btn) return;
          if (canAdvance()) {
            btn.disabled = false;
            btn.style.opacity = '';
            btn.style.cursor = '';
          } else {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
          }
        });
      });
      // Back
      const back = document.getElementById('btn-back');
      if (back) back.addEventListener('click', () => {
        if (state.step === 1) readBasics();
        state.step = Math.max(1, state.step - 1);
        render();
      });
      // Next / Launch
      const next = document.getElementById('btn-next');
      if (next) next.addEventListener('click', () => {
        if (!canAdvance()) return;
        if (state.step === 1) readBasics();
        if (state.step < 4) {
          state.step += 1;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          const { programId, slug } = persistAndLaunch();
          window.renderShell(successHTML(programId, slug));
          window.scrollTo({ top: 0 });
        }
      });
    }

    render();
  </script>
</body>
</html>
