<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — Ventrify OS</title>
<script>try{if(localStorage.getItem("ventrify-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="../shared/m3/theme.css">
<link rel="stylesheet" href="../shared/m3/ds.css">
<link rel="stylesheet" href="../shared/m3/transitions.css">
<link rel="stylesheet" href="../shared/m3/workspace-chrome.css">
</head>
<body>
<div id="app"></div>
<script src="sample-data.js"></script>
<script src="agents.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  import * as DS from '../shared/m3/ds.js';
  import { wsNavConfig, wsBrandConfig, wsAccountConfig, mountOrgSwitcherM3 } from './workspace-m3.js';

  await window.WORKSPACE_READY;
  const W = window.WORKSPACE;
  const me = W.helpers.currentOperator();
  const myEmail = ((me && me.email) || '').toLowerCase();
  const isSuper = !!W.isSuperAdmin;
  const isOwner = !!(W.org && String(W.org.ownerEmail || '').toLowerCase() === myEmail);
  const PLAN = window.VentrifyPlan;
  if (!isSuper && !isOwner) { location.href = 'dashboard-m3.html'; throw new Error('halt'); }
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---- plan picker + /api/admin (VERBATIM from admin.html) ----
  function planFieldHTML(prefix, plan) {
    const preset = (plan && plan.preset) || 'full';
    const isCustom = preset === 'custom';
    const capAssess = plan ? plan.capabilities.assess : true;
    const capBuild = plan ? plan.capabilities.build : true;
    const limA = (plan && plan.limits.assessments != null) ? plan.limits.assessments : '';
    const limB = (plan && plan.limits.builds != null) ? plan.limits.builds : '';
    return `<div style="max-width:260px">${DS.formField({ id: `${prefix}-preset`, value: preset, options: ['full', 'assess', 'one-off', 'custom'].map(v => ({ v, l: PLAN.PLAN_PRESETS[v].label })), attr: ` onchange="window.__togglePlanCustom('${prefix}')"` })}</div>
      <div id="${prefix}-custom" style="display:${isCustom ? 'block' : 'none'};margin-top:12px;padding:14px;background:var(--md-sys-color-surface-container-high);border-radius:10px">
        <div style="display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="${prefix}-cap-assess" ${capAssess ? 'checked' : ''}> Assess ventures</label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="${prefix}-cap-build" ${capBuild ? 'checked' : ''}> Build MVPs</label>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          ${DS.formField({ label: 'Max assessments', id: `${prefix}-lim-assess`, value: limA, placeholder: 'unlimited' })}
          ${DS.formField({ label: 'Max builds', id: `${prefix}-lim-build`, value: limB, placeholder: 'unlimited' })}
        </div>
        <div class="body-s variant" style="margin-top:8px">Leave a limit blank for unlimited.</div>
      </div>`;
  }
  window.__togglePlanCustom = (prefix) => { const sel = document.getElementById(prefix + '-preset'); const b = document.getElementById(prefix + '-custom'); if (b) b.style.display = (sel && sel.value === 'custom') ? 'block' : 'none'; };
  function readPlan(prefix) {
    const preset = (document.getElementById(prefix + '-preset') || {}).value || 'full';
    if (preset !== 'custom') return { preset };
    const val = id => (document.getElementById(prefix + '-' + id) || {}).value;
    const ck = id => !!(document.getElementById(prefix + '-' + id) || {}).checked;
    const num = s => (s == null || String(s).trim() === '') ? null : Math.max(0, Math.floor(Number(s)) || 0);
    return { preset: 'custom', capabilities: { assess: ck('cap-assess'), build: ck('cap-build') }, limits: { assessments: num(val('lim-assess')), builds: num(val('lim-build')) } };
  }
  async function adminCall(payload) {
    const { auth } = await import('../firebase/firebase.js');
    const idToken = await auth.currentUser.getIdToken();
    const resp = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...payload, idToken }) });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
    return data;
  }
  window.__createOrg = async () => {
    const name = document.getElementById('org-name').value.trim();
    const slug = document.getElementById('org-slug').value.trim();
    const ownerEmail = document.getElementById('org-owner').value.trim();
    if (!name || !ownerEmail) { window.__toast('Organisation name and owner email are required.', true); return; }
    try { await adminCall({ action: 'create-org', name, slug, ownerEmail, plan: readPlan('neworg') }); location.reload(); }
    catch (e) { window.__toast('Could not create org: ' + e.message, true); }
  };
  window.__setOrgPlan = async (orgId) => { try { await adminCall({ action: 'set-plan', orgId, plan: readPlan('plan-' + orgId) }); location.reload(); } catch (e) { window.__toast('Could not update plan: ' + e.message, true); } };
  window.__addOperator = async (orgId) => { const email = ((document.getElementById('addop-' + orgId) || {}).value || '').trim(); if (!email) return; try { await adminCall({ action: 'add-operator', orgId, email }); location.reload(); } catch (e) { window.__toast('Could not add operator: ' + e.message, true); } };
  window.__removeOperator = async (orgId, email) => { if (!(await window.__confirm({ title: 'Remove operator?', message: email + ' loses Workspace access.', confirmLabel: 'Remove', danger: true }))) return; try { await adminCall({ action: 'remove-operator', orgId, email }); location.reload(); } catch (e) { window.__toast('Could not remove operator: ' + e.message, true); } };
  window.__deleteOrg = async (orgId) => {
    const o = (orgs || []).find(x => x.id === orgId) || {}; const name = o.name || orgId;
    const typed = window.prompt('This permanently deletes "' + name + '" and ALL of its engagements, cards, and scores.\n\nType the organisation name to confirm:');
    if (typed == null) return;
    if (typed.trim() !== name) { window.__toast('Name did not match — deletion cancelled.', true); return; }
    try { const r = await adminCall({ action: 'delete-org', orgId }); const d = r.deleted || {}; window.__toast('Deleted "' + name + '" — removed ' + (d.engagements || 0) + ' engagement(s).'); setTimeout(() => location.reload(), 2200); }
    catch (e) { window.__toast('Could not delete org: ' + e.message, true); }
  };

  let orgs = [], loadError = false;
  if (isSuper) { try { orgs = (await adminCall({ action: 'list-orgs' })).orgs || []; } catch (e) { loadError = true; } }
  else { orgs = [W.org]; }

  function orgCard(o) {
    const ops = o.operatorEmails || []; const owner = String(o.ownerEmail || '').toLowerCase();
    const sp = PLAN.planSummary(PLAN.resolvePlan(o));
    return `<div class="m3-card" style="padding:20px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px">
        <div><div class="title-l">${esc(o.name)}</div><div class="body-s variant" style="font-family:monospace">${esc(o.id)} · owner ${esc(o.ownerEmail || '—')}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          ${DS.statusPill({ kind: 'info', label: sp.label, title: sp.detail || sp.label })}
          ${DS.statusPill({ kind: '', label: `${ops.length} operator${ops.length === 1 ? '' : 's'}` })}
          ${(isSuper && o.id !== 'default') ? `<button class="m3-btn text" style="color:var(--md-sys-color-error)" onclick="window.__deleteOrg('${esc(o.id)}')">Delete org</button>` : ''}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
        ${ops.map(e => `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;background:var(--md-sys-color-surface-container-high);border-radius:8px"><span class="body-m">${esc(e)}${owner === e.toLowerCase() ? ' <span class="overline">OWNER</span>' : ''}</span>${owner === e.toLowerCase() ? '' : `<button class="m3-btn text" onclick="window.__removeOperator('${esc(o.id)}','${esc(e)}')">Remove</button>`}</div>`).join('')}
      </div>
      <div style="display:flex;gap:8px"><input id="addop-${esc(o.id)}" class="field-in" type="email" placeholder="operator@email.com" style="flex:1"><button class="m3-btn filled" onclick="window.__addOperator('${esc(o.id)}')">Add operator</button></div>
      ${isSuper ? `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--md-sys-color-outline-variant)"><div class="overline" style="margin-bottom:6px">Plan</div>${planFieldHTML('plan-' + o.id, PLAN.resolvePlan(o))}<div style="margin-top:12px"><button class="m3-btn outlined" onclick="window.__setOrgPlan('${esc(o.id)}')">Save plan</button></div></div>` : ''}
    </div>`;
  }
  const createOrg = isSuper ? `<div style="margin-bottom:24px"><div class="overline" style="margin-bottom:10px">Create a client org</div><div class="m3-card" style="padding:20px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${DS.formField({ label: 'Organisation name', id: 'org-name', placeholder: 'Acme Accelerator' })}
      ${DS.formField({ label: 'Slug', optional: true, id: 'org-slug', placeholder: 'acme' })}
      <div style="grid-column:1/-1">${DS.formField({ label: 'Owner email', id: 'org-owner', type: 'email', placeholder: 'lead@acme.com' })}</div>
      <div style="grid-column:1/-1"><div class="overline" style="margin-bottom:4px">Plan</div>${planFieldHTML('neworg', null)}</div>
    </div>
    <div style="margin-top:16px"><button class="m3-btn filled" onclick="window.__createOrg()">Create org</button></div>
  </div></div>` : '';

  document.getElementById('app').outerHTML = DS.pageShell({
    active: 'admin', nav: wsNavConfig(), brand: wsBrandConfig(), account: wsAccountConfig(),
    masthead: DS.masthead({ eyebrow: isSuper ? 'Platform admin' : 'Operators', headline: isSuper ? 'Organisations & operators' : 'Your operators', subheading: isSuper ? 'Create client orgs and manage who operates each one.' : `Add or remove operators for ${esc(W.org.name)}.` }),
    body: `<div class="brief">${createOrg}<div class="overline" style="margin-bottom:10px">${isSuper ? 'All organisations' : esc(W.org.name)}</div>${loadError ? `<div class="m3-card" style="padding:24px"><div class="title-l">Couldn’t load organisations</div><div class="body-m variant" style="margin:6px 0 12px">The request failed — this isn’t an empty list.</div><button class="m3-btn outlined" onclick="location.reload()">Retry</button></div>` : orgs.length ? orgs.map(orgCard).join('') : '<div class="m3-card" style="text-align:center;padding:32px;color:var(--md-sys-color-on-surface-variant)">No organisations yet.</div>'}</div>`
  });
  DS.initShell(); mountOrgSwitcherM3();
</script>
</body>
</html>
