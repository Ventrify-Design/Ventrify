<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Assessment · new UI preview — Ventrify OS</title>
<meta name="description" content="Preview of the Material-3 editorial assessment UI, rendered from the live engagement data.">
<script>try{if(localStorage.getItem("ventrify-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<!-- the M3 render layer now lives at ../shared/m3/ (a DEPLOYING location) -->
<link rel="stylesheet" href="../shared/m3/theme.css">
<link rel="stylesheet" href="../shared/m3/ds.css">
<link rel="stylesheet" href="../shared/m3/assess-editorial.css">
<link rel="stylesheet" href="../shared/m3/transitions.css">
</head>
<body>
<div id="app"></div>
<!-- SAME bootstrap as program.html: sample fixtures (demo) + agents + the auth/org loader. -->
<script src="sample-data.js"></script>
<script src="agents.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  // ── Stage 1 of the M3 migration: a FLAGGED, side-by-side preview. It reads the exact same
  // live engagement data as program.html (no pipeline change), maps it through the READ-ONLY
  // adapter, and renders the M3 editorial UI. program.html is untouched; revert = delete this file.
  import * as DS from '../shared/m3/ds.js';
  import { adaptEngagement } from '../shared/m3/adapter.js';
  import { resolveActions } from '../shared/actions.js';

  // The live workspace's routes differ from the DS workshop's — supply real destinations for the drawer.
  const WS_NAV = [
    { key: 'portfolio', icon: 'dashboard', label: 'Portfolio', section: 'Operate', href: 'dashboard.html' },
    { key: 'queue', icon: 'checklist', label: 'Action queue', section: 'Operate', href: 'queue.html' },
    { key: 'team', icon: 'group', label: 'Team', section: 'Manage', href: 'team.html' },
    { key: 'settings', icon: 'settings', label: 'Settings', section: 'Manage', href: 'settings.html' }
  ];

  await window.WORKSPACE_READY;
  const W = window.WORKSPACE;
  const allPrograms = W.programs || [];
  const params = new URLSearchParams(location.search);
  const fallback = allPrograms[0] || null;
  const id = params.get('id') || (fallback && fallback.id);
  const p = allPrograms.find(x => x.id === id) || fallback;

  // Guard: nothing to show
  if (!p) {
    document.getElementById('app').outerHTML = DS.pageShell({
      active: 'portfolio', nav: WS_NAV,
      masthead: DS.masthead({ eyebrow: 'Assessment', headline: 'No engagement loaded', subheading: 'There is no engagement at this URL yet.' }),
      body: `<div class="brief"><div class="m3-card" style="text-align:center;padding:48px 24px"><div class="title-l">No engagement loaded</div><div class="body-m variant" style="margin-top:6px">Open one from your <a href="dashboard.html">portfolio</a>.</div></div></div>`
    });
    DS.initShell();
    throw new Error('halt-render');
  }

  // ── Live data — IDENTICAL reads to program.html. Demo/local mode uses the fixtures already on p. ──
  const live = W.mode === 'live';
  let invSnapshot = p.investabilitySnapshot || null, provCards = p.provCards || [], hubDocs = p.hubDocs || [];
  if (live) {
    try {
      const data = await import('../firebase/data.js');
      const snaps = await data.listInvestabilitySnapshots(p.id); invSnapshot = snaps.length ? snaps[snaps.length - 1] : invSnapshot;
      provCards = await data.listCardsForEngagement(p.id);
      hubDocs = await data.listHubDocs(p.id);
    } catch (e) { console.warn('live assessment data load failed', e); }
  }

  // ── Adapt (read-only) → the M3 ASSESSMENT + SCORE shapes ──
  const pForAdapter = { ...p, investabilitySnapshot: invSnapshot, provCards, hubDocs };
  const { A, S } = adaptEngagement(pForAdapter);

  const acts = resolveActions({ page: 'assess' });
  const classicHref = `program.html?id=${encodeURIComponent(p.id)}`;
  // Bridge back to the classic page — the preview is read-only; runs, uploads and recovery live there.
  const classicAction = { variant: 'text', icon: 'arrow_back', label: 'Classic view', onclick: `location.href='${classicHref}'` };

  // ── Run / lifecycle state — mirrors program.html's assess run-state machine. ──
  // ?sim=<status> is an INERT preview override (queued|running|partial|needs-attention|
  // limit-paused|error|idle|nodeck) so any run state is previewable on demo data.
  const sim = params.get('sim');
  const rs = { ...(p.runState || {}) };
  let forceNoVerdict = false, forceNoDeck = false, forceNoSnap = false;
  if (sim) {
    if (sim === 'nodeck') { rs.status = 'idle'; forceNoDeck = forceNoVerdict = forceNoSnap = true; }
    else if (sim === 'idle') { rs.status = 'idle'; forceNoVerdict = forceNoSnap = true; }
    else if (sim === 'queued') { rs.status = 'queued'; forceNoVerdict = forceNoSnap = true; }
    else { rs.status = sim; if (['running', 'partial'].includes(sim)) forceNoVerdict = true; }
  }
  const snapForDisplay = forceNoSnap ? null : invSnapshot;   // a not-yet-run engagement has no snapshot to show
  const status = rs.status || (A.recommendation ? 'done' : 'idle');
  const active = ['queued', 'running', 'partial'].includes(status);
  const flagged = ['needs-attention', 'limit-paused', 'error'].includes(status);
  const hasVerdict = !!A.recommendation && !forceNoVerdict;
  const hasDeck = !!p.pitchDoc && !forceNoDeck;

  // Where to go to act — every control (run / upload / recover) lives on the classic page.
  function bridgeNote() {
    let msg, icon = 'bolt', warn = false;
    if (!hasDeck) { msg = 'No pitch deck yet — the assessment can’t run without one. Upload it on the classic view.'; icon = 'upload_file'; warn = true; }
    else if (active) { msg = 'This assessment is running. Live progress and the full controls are on the classic view.'; icon = 'autorenew'; }
    else if (flagged) { msg = 'This run needs attention — recover or re-run it from the classic view.'; icon = 'warning'; warn = true; }
    else { msg = 'Ready to run — start the assessment from the classic view.'; icon = 'play_arrow'; }
    return `<div class="m3-card" style="display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px 18px">
      <span class="material-symbols-rounded" style="color:var(--md-sys-color-${warn ? 'error' : 'primary'})">${icon}</span>
      <div style="flex:1" class="body-m">${msg}</div>
      <a class="m3-btn text trail" href="${classicHref}" style="flex:none"><span class="material-symbols-rounded">chevron_right</span>Classic view</a>
    </div>`;
  }

  // The "not scored yet" view — run banner (only for a genuine run state; idle/not-run has none,
  // so it never shows a misleading "Queued") + bridge + a forming score (if one exists) + the lifecycle.
  function statusView() {
    const banner = (active || flagged) ? DS.runBanner(rs) : '';
    const forming = snapForDisplay ? `<hr class="rule"><div class="overline" style="margin-bottom:12px">The score, forming</div>${DS.investabilityComposition(S, 'openInvest')}` : '';
    const life = `<hr class="rule"><div class="overline" style="margin-bottom:12px">Assessment lifecycle</div>${DS.lifecycleStrip(A.lifecycle)}`;
    return `<div class="brief">${banner}${bridgeNote()}${forming}${life}</div>`;
  }

  let body, tabs = false;
  if (hasVerdict) {
    // Verdict exists → the full editorial view. A re-run in flight / a flagged state leads with a slim banner.
    const slim = (active || flagged) ? `<div class="brief" style="padding-bottom:0;margin-bottom:4px">${DS.runBanner(rs)}</div>` : '';
    tabs = ['Verdict', 'Investability', 'Market', 'Team', 'Diligence', 'Research'];
    body = `
      <div class="tab-panel active">${slim}${DS.verdictMemo(A, S)}</div>
      <div class="tab-panel"><div class="brief">${DS.investabilityHero(S, A)}<hr class="rule">${DS.investabilityComposition(S, 'openInvest')}<hr class="rule">${DS.strengthProfile(S, 'openInvest')}</div></div>
      <div class="tab-panel">${DS.marketMemo(A)}</div>
      <div class="tab-panel">${DS.teamMemo(A)}</div>
      <div class="tab-panel">${DS.diligenceEditorial(A)}</div>
      <div class="tab-panel">${DS.researchMemo(A, S)}</div>`;
  } else {
    // No verdict yet → the run / forming status view (no editorial tabs).
    body = `<div class="tab-panel active">${statusView()}</div>`;
  }

  const statusPill = hasVerdict ? A.status
    : (active ? { kind: 'n', label: 'Assessing…', icon: 'autorenew' }
      : flagged ? { kind: 'n', label: 'Needs attention', icon: 'warning' }
        : { kind: 'n', label: hasDeck ? 'Ready to run' : 'Awaiting deck', icon: 'pending' });

  document.getElementById('app').outerHTML = DS.pageShell({
    active: 'portfolio', nav: WS_NAV, aux: {}, rail: acts.rail, railOverflow: acts.overflow,
    masthead: DS.masthead({
      breadcrumb: { label: 'Portfolio', href: 'dashboard.html' }, crumbTail: A.name, avatar: A.initials,
      headline: A.name, status: statusPill, subheading: A.stageLine, compact: A.name,
      actions: [classicAction],
      tabs, activeTab: 0
    }),
    body
  });
  DS.initShell();
  if (tabs) DS.initTabs({ names: ['verdict', 'investability', 'market', 'team', 'diligence', 'research'] });
  window.openInvest = (key) => { const d = DS.categoryDetail(S, key); window.openAux({ mode: 'push', title: d.title, subtitle: d.subtitle, body: d.body }); };
  window.openPeek = () => {};
  window.RAIL_PANELS = { sources: () => DS.sourcesPanel(A) };
  window.openSources = () => window.openAux({ mode: 'push', ...DS.sourcesPanel(A) });
</script>
</body>
</html>
