<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Assessment — Ventrify OS</title>
<meta name="description" content="The Material-3 operator assessment detail, on live engagement data.">
<script>try{if(localStorage.getItem("ventrify-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="../shared/m3/theme.css">
<link rel="stylesheet" href="../shared/m3/ds.css">
<link rel="stylesheet" href="../shared/m3/assess-editorial.css">
<link rel="stylesheet" href="../shared/m3/transitions.css">
<link rel="stylesheet" href="../shared/m3/workspace-chrome.css">
</head>
<body>
<div id="app"></div>
<input type="file" id="ea-file" hidden>
<script src="sample-data.js"></script>
<script src="agents.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  // The M3 assessment DETAIL — a full operator surface (not a preview): it reads the same live
  // engagement data as program.html AND drives the same run/dispatch/ingest/memo pipeline, via the
  // shared engagement-actions.js module (every /api call is verbatim). No pipeline reimplementation.
  import * as DS from '../shared/m3/ds.js';
  import { adaptEngagement } from '../shared/m3/adapter.js';
  import { resolveActions } from '../shared/actions.js';
  import { wsNavConfig, wsBrandConfig, wsAccountConfig, mountOrgSwitcherM3 } from './workspace-m3.js';
  import * as EA from './engagement-actions.js';
  import { dealMemoHTML } from './memo-view.js';

  await window.WORKSPACE_READY;
  const W = window.WORKSPACE;
  const params = new URLSearchParams(location.search);
  const allPrograms = W.programs || [];
  const id = params.get('id') || (allPrograms[0] || {}).id;
  let p = allPrograms.find(x => x.id === id) || allPrograms[0] || null;
  const live = W.mode === 'live';
  const acts = resolveActions({ page: 'assess' });

  if (!p) {
    document.getElementById('app').outerHTML = DS.pageShell({
      active: 'portfolio', nav: wsNavConfig(), brand: wsBrandConfig(), account: wsAccountConfig(),
      masthead: DS.masthead({ eyebrow: 'Assessment', headline: 'No engagement loaded', subheading: 'There is no engagement at this URL yet.' }),
      body: `<div class="brief"><div class="m3-card" style="text-align:center;padding:48px 24px"><div class="title-l">No engagement loaded</div><div class="body-m variant" style="margin-top:6px">Open one from your <a href="dashboard-m3.html">portfolio</a>.</div></div></div>`
    });
    DS.initShell(); mountOrgSwitcherM3();
    throw new Error('halt-render');
  }

  // ── mutable live data (refreshed after actions / on subscription tick) ──
  let invSnapshot = null, invSnapshots = [], provCards = [], hubDocs = [], operatorEvidence = [], A = null, S = null;
  async function loadData() {
    invSnapshot = p.investabilitySnapshot || null; provCards = p.provCards || []; hubDocs = p.hubDocs || [];
    invSnapshots = p.investabilitySnapshots || (invSnapshot ? [invSnapshot] : []);
    operatorEvidence = p.operatorEvidence || [];
    if (live) {
      try {
        const data = await import('../firebase/data.js');
        // Keep the WHOLE history, not just the newest. It was already being fetched and then thrown away —
        // and since the newest snapshot is the one we publish, discarding the rest is precisely what let an
        // operator who disliked 67 run it again and keep 73, with nothing on screen ever saying so.
        const snaps = await data.listInvestabilitySnapshots(p.id);
        invSnapshots = snaps || [];
        invSnapshot = snaps.length ? snaps[snaps.length - 1] : invSnapshot;
        provCards = await data.listCardsForEngagement(p.id);
        hubDocs = await data.listHubDocs(p.id);
        // the evidence ledger — what the operator pointed us at, what the FETCHER observed, and what the
        // SCORER then did about it (signalDelta / compositeDelta, which may be NEGATIVE).
        operatorEvidence = await data.listOperatorEvidence(p.id);
      } catch (e) { console.warn('live assessment data load failed', e); }
    }
    ({ A, S } = adaptEngagement({ ...p, investabilitySnapshot: invSnapshot, provCards, hubDocs, operatorEvidence }));
  }

  // ── run / deck state (?sim= keeps the inert preview override) ──
  function stateBits() {
    const sim = params.get('sim');
    const rs = { ...(p.runState || {}) };
    let fNoVerdict = false, fNoDeck = false, fNoSnap = false;
    if (sim) {
      if (sim === 'nodeck') { rs.status = 'idle'; fNoDeck = fNoVerdict = fNoSnap = true; }
      else if (sim === 'idle') { rs.status = 'idle'; fNoVerdict = fNoSnap = true; }
      else if (sim === 'queued') { rs.status = 'queued'; fNoVerdict = fNoSnap = true; }
      else { rs.status = sim; if (['running', 'partial'].includes(sim)) fNoVerdict = true; }
    }
    const status = rs.status || (A.recommendation ? 'done' : 'idle');
    return {
      rs, status,
      active: ['queued', 'running', 'partial'].includes(status),
      flagged: ['needs-attention', 'limit-paused', 'error'].includes(status),
      recoverable: ['needs-attention', 'error', 'limit-paused'].includes(status),
      hasVerdict: !!A.recommendation && !fNoVerdict,
      hasDeck: !!p.pitchDoc && !fNoDeck,
      snap: fNoSnap ? null : invSnapshot,
      signed: !!p.assessmentSignoff,
    };
  }

  // ── ACTIONS (wired to the shared pipeline module) ──
  const fileInput = document.getElementById('ea-file');
  window.__eaUpload = (docType) => {
    fileInput.dataset.docType = docType;
    fileInput.accept = docType === 'pitch' ? '.pdf,.docx' : '.pdf,.docx,.xlsx,.xls,.xlsm,.txt,.md,.csv,.zip';
    fileInput.multiple = docType !== 'pitch';
    fileInput.click();
  };
  fileInput.onchange = async () => {
    const files = [...(fileInput.files || [])]; const docType = fileInput.dataset.docType; fileInput.value = '';
    if (!files.length) return;
    // EVIDENCE is not a founder document and must never travel the founder-document path: ingestDocs writes
    // to founderDocs, which the runner rebuilds into research/_source-material/** — THE FOUNDER'S ROOM. The
    // rubric treats that directory as a legal term (one anchor counts a class as PRESENT on the FILENAME
    // ALONE), so an operator artefact landing there would lift a founder-burden signal with nobody having
    // asserted anything. It is held in the aux panel and filed as a POINTER instead.
    if (docType === 'evidence') { window.__gapAttach(files[0]); return; }
    window.__toast('Uploading…');
    try {
      const { ingested, skipped } = await EA.ingestDocs({ engagementId: p.id, files, docType, onProgress: m => window.__toast(m) });
      if (skipped.length) window.__toast(`Couldn’t ingest ${skipped.length}: ${skipped.map(s => s.name).join(', ')}`, true);
      else window.__toast(docType === 'pitch' ? 'Pitch deck added.' : `Ingested ${ingested} document${ingested === 1 ? '' : 's'}.`);
      setTimeout(() => location.reload(), skipped.length ? 1600 : 700);
    } catch (e) { window.__toast('Upload failed: ' + ((e && e.message) || e), true); }
  };
  // the masthead's primary is usually .filled, but while a run is live it is the OUTLINED Stop — so grab
  // whichever button is actually there, or Stop would never disable while the cancel is in flight.
  const busy = b => { const btn = document.querySelector('.mh-actions .m3-btn.filled') || document.querySelector('.mh-actions .m3-btn'); if (btn) { btn.disabled = b; btn.style.opacity = b ? '0.6' : ''; } };
  window.__eaRun = async () => { if (await EA.dispatchRun({ engagementId: p.id, phase: 'assess', onBusy: busy })) { window.__toast('Assessment queued — this runs in the cloud.'); if (!live) setTimeout(() => location.reload(), 800); } };
  // STOP — a TRUE stop: cancels the actual GitHub Actions job, then clears runState so the page falls back
  // to "Ready to run". Nothing is published until the very END of a run, so stopping genuinely saves nothing
  // — say that plainly rather than implying partial results are kept.
  window.__eaStop = async () => {
    const ok = await window.__confirm({
      title: 'Stop the assessment?',
      message: 'Nothing has been published yet — the run only publishes at the very end — so stopping saves nothing, and you would need to run it again from the start.',
      confirmLabel: 'Stop run', danger: true
    });
    if (!ok) return;
    if (await EA.stopRun({ engagementId: p.id, onBusy: busy })) {
      window.__toast('Run stopped.');
      await refresh();
    }
  };
  // dismiss a missing document — the operator has dealt with it (re-added elsewhere, or it doesn't belong).
  window.__eaDismissSkipped = async (name) => {
    try { await EA.clearSkippedDoc({ engagementId: p.id, name }); await refresh(); }
    catch (e) { window.__toast('Could not dismiss: ' + ((e && e.message) || e), true); }
  };
  window.__eaRepublish = async () => { if (await EA.republish({ engagementId: p.id, onBusy: busy })) { window.__toast('Recovering your saved results…'); if (!live) setTimeout(() => location.reload(), 800); } };
  window.__eaDownload = () => EA.downloadMemo({ p, snap: invSnapshot, org: W.org });
  window.__eaDelete = async () => {
    if (!(await window.__confirm({ title: `Delete “${p.name}” permanently?`, message: 'This removes the assessment and all its data. This cannot be undone.', confirmLabel: 'Delete', danger: true }))) return;
    try { await EA.deleteEngagement({ engagementId: p.id }); location.href = 'dashboard-m3.html'; }
    catch (e) { window.__toast('Could not delete: ' + ((e && (e.code || e.message)) || e), true); }
  };
  window.__eaSignoff = () => {
    const cur = p.assessmentSignoff;
    window.openAux({
      mode: 'push', title: cur ? 'Update sign-off' : 'Sign off & endorse', subtitle: 'Operator endorsement',
      body: `<div style="padding:4px 2px">
        <div class="body-m" style="color:var(--md-sys-color-on-surface-variant);margin-bottom:12px">Your name and today’s date appear on the assessment and any shared memo, marking it reviewed.</div>
        <textarea id="ea-so-note" class="field-in" rows="4" placeholder="Optional — your take for the IC." style="width:100%;box-sizing:border-box;resize:vertical">${cur && cur.note ? cur.note.replace(/</g, '&lt;') : ''}</textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          ${cur ? `<button class="m3-btn text" onclick="window.__eaRevokeSignoff()">Revoke</button>` : ''}
          <button class="m3-btn filled" onclick="window.__eaDoSignoff()">${cur ? 'Update' : 'Sign off'}</button>
        </div></div>`
    });
  };
  window.__eaDoSignoff = async () => {
    const note = (document.getElementById('ea-so-note') || {}).value || '';
    try { const so = await EA.signOff({ engagementId: p.id, note: note.trim() || null }); p.assessmentSignoff = so; window.closeAux && window.closeAux(); window.__toast('Signed off — your endorsement now appears on the memo.'); refresh(); }
    catch (e) { window.__toast('Could not sign off: ' + ((e && (e.code || e.message)) || e), true); }
  };
  window.__eaRevokeSignoff = async () => {
    try { await EA.revokeSignoff({ engagementId: p.id }); p.assessmentSignoff = null; window.closeAux && window.closeAux(); window.__toast('Sign-off revoked.'); refresh(); }
    catch (e) { window.__toast('Could not revoke: ' + ((e && (e.code || e.message)) || e), true); }
  };

  // ── operator decision: Confirm / Decline the assessed deal (distinct from sign-off) ──
  window.__eaDecide = async (verdict, note = null) => {
    const msg = verdict === 'confirmed' ? 'Confirmed — recorded on the deal.' : 'Declined — recorded on the deal.';
    if (!live) {   // demo: optimistic in-memory (ephemeral), mirroring __eaDoSignoff — no /api server behind the demo
      const me = (W.helpers && W.helpers.currentOperator && W.helpers.currentOperator()) || {};
      p.assessmentDecision = { decision: verdict, by: me.name || me.email || 'You', byEmail: me.email || null, at: new Date().toISOString(), note: note || null };
      window.closeAux && window.closeAux(); window.__toast(msg); refresh(); return;
    }
    try { const dec = await EA.decide({ engagementId: p.id, decision: verdict, note }); p.assessmentDecision = dec; window.closeAux && window.closeAux(); window.__toast(msg); refresh(); }
    catch (e) { window.__toast('Could not record the decision: ' + ((e && (e.code || e.message)) || e), true); }
  };
  // Decline routes through a small aux with an OPTIONAL reason + a misclick guard (mirrors __eaSignoff's panel)
  window.__eaDecideAsk = (verdict) => {
    window.openAux({
      mode: 'push', title: 'Decline deal', subtitle: p.name,
      body: `<div style="padding:4px 2px">
        <div class="body-m" style="color:var(--md-sys-color-on-surface-variant);margin-bottom:12px">You're passing on this deal. Your name and today's date are recorded on the engagement.</div>
        <textarea id="ea-dec-note" class="field-in" rows="4" placeholder="Optional — why you're passing." style="width:100%;box-sizing:border-box;resize:vertical"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          <button class="m3-btn text" onclick="window.closeAux&&window.closeAux()">Cancel</button>
          <button class="m3-btn filled" onclick="window.__eaDecide('declined', (document.getElementById('ea-dec-note')||{}).value || null)"><span class="material-symbols-rounded">do_not_disturb_on</span>Decline deal</button>
        </div></div>`
    });
  };
  window.__eaChangeDecision = () => {
    const dec = p.assessmentDecision || {};
    window.openAux({
      mode: 'push', title: 'Change decision', subtitle: p.name,
      body: `<div style="display:flex;flex-direction:column;gap:6px;padding:4px 2px">
        <div class="body-m" style="color:var(--md-sys-color-on-surface-variant);margin-bottom:6px">Current: <b>${dec.decision === 'confirmed' ? 'Confirmed' : dec.decision === 'declined' ? 'Declined' : '—'}</b>${dec.by ? ' · ' + DS._esc(dec.by) : ''}</div>
        <button class="m3-btn text" style="justify-content:flex-start" onclick="window.closeAux&&window.closeAux();window.__eaDecide('confirmed')"><span class="material-symbols-rounded">check_circle</span>Confirm</button>
        <button class="m3-btn text" style="justify-content:flex-start" onclick="window.closeAux&&window.closeAux();window.__eaDecideAsk('declined')"><span class="material-symbols-rounded">do_not_disturb_on</span>Decline</button>
        <button class="m3-btn text" style="justify-content:flex-start;color:var(--md-sys-color-error)" onclick="window.__eaClearDecision()"><span class="material-symbols-rounded">undo</span>Clear decision</button>
      </div>`
    });
  };
  window.__eaClearDecision = async () => {
    if (!live) { p.assessmentDecision = null; window.closeAux && window.closeAux(); window.__toast('Decision cleared.'); refresh(); return; }
    try { await EA.revokeDecision({ engagementId: p.id }); p.assessmentDecision = null; window.closeAux && window.closeAux(); window.__toast('Decision cleared.'); refresh(); }
    catch (e) { window.__toast('Could not clear the decision: ' + ((e && (e.code || e.message)) || e), true); }
  };
  window.__eaShare = async () => {
    window.__toast('Preparing the share link…');
    try {
      const html = dealMemoHTML(p, invSnapshot, W.org, { shared: true });
      const me = (W.helpers && W.helpers.currentOperator && W.helpers.currentOperator()) || {};
      const pct = invSnapshot && invSnapshot.pct != null ? invSnapshot.pct : null;
      const d = await EA.shareMemo({ engagementId: p.id, html, meta: { name: p.name, pct } });
      p.shareLink = { token: d.token, by: me.email || null, at: new Date().toISOString(), pct };
      const url = d.url || (location.origin + '/m/' + d.token);
      window.openAux({
        mode: 'push', title: 'Shareable memo link', subtitle: 'Read-only · no login',
        body: `<div style="padding:4px 2px">
          <div class="body-m" style="color:var(--md-sys-color-on-surface-variant);margin-bottom:12px">Anyone with this link sees a read-only copy of the deal memo. Re-share after a re-run by hitting Share again — the link stays the same.</div>
          ${DS.formField({ label: 'Memo link', id: 'ea-sh-url', value: String(url), attr: ' readonly onclick="this.select()"' })}
          <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px">
            <button class="m3-btn text" onclick="window.__eaRevokeShare()" style="color:var(--md-sys-color-error)">Revoke link</button>
            <span style="display:flex;gap:8px"><a class="m3-btn text" href="${String(url).replace(/"/g, '&quot;')}" target="_blank" rel="noopener">Open</a><button class="m3-btn filled" onclick="window.__eaCopyShare()">Copy</button></span>
          </div></div>`
      });
    } catch (e) { window.__toast('Could not create the share link: ' + ((e && (e.code || e.message)) || e), true); }
  };
  window.__eaCopyShare = () => { const i = document.getElementById('ea-sh-url'); if (i) { navigator.clipboard && navigator.clipboard.writeText(i.value); window.__toast('Link copied.'); } };
  window.__eaRevokeShare = async () => {
    try { await EA.revokeShare({ engagementId: p.id }); p.shareLink = null; window.closeAux && window.closeAux(); window.__toast('Share link revoked.'); }
    catch (e) { window.__toast('Could not revoke: ' + ((e && (e.code || e.message)) || e), true); }
  };
  // ══════════════════════════════════════════════════════════════════════════════════════════════════
  // THE EVIDENCE GAP — the operator points us at what we could not find.
  //
  // THE RULE THE WHOLE FLOW EXISTS TO KEEP: the operator supplies A POINTER TO EVIDENCE, NOT A CLAIM ABOUT
  // EVIDENCE. He cannot inflate anything, because he asserts nothing — the assessment fetches what he filed,
  // reads it cold, and forms its OWN judgement. If the source CONTRADICTS the claim, THE SCORE FALLS. He
  // cannot know which way it will move before he commits, and he does not get to choose.
  // ══════════════════════════════════════════════════════════════════════════════════════════════════
  let gapOpen = null;                                   // the gap whose panel is currently open
  window.__gapFiles = [];                               // the docDropzone's view of the attached artefact
  let gapPending = null;                                // the actual File, held in memory until it is filed

  const gapRepaint = () => {
    if (!gapOpen) return;
    const d = DS.gapPanel(gapOpen, gapOpen.filing);
    window.openAux({ mode: 'push', title: d.title, subtitle: d.subtitle, body: d.body, footer: d.footer });
    window.__gapDirty();
  };
  window.openGap = (id) => {
    const g = A.gapById && A.gapById[id];
    if (!g) { window.__toast('That gap is no longer on the assessment — re-run to refresh it.'); return; }
    gapOpen = g; gapPending = null; window.__gapFiles = [];
    gapRepaint();
  };
  window.__gapPick = () => { fileInput.dataset.docType = 'evidence'; fileInput.accept = '.pdf,.png,.jpg,.jpeg,.docx,.txt,.md,.html,.csv,.xlsx'; fileInput.multiple = false; fileInput.click(); };
  window.__gapAttach = (f) => {
    gapPending = f;
    window.__gapFiles = [{ icon: 'description', title: f.name, note: `${Math.max(1, Math.round(f.size / 1024))} KB · read as evidence, filename discarded`, status: 'stored' }];
    gapRepaint();
  };
  window.__gapClearFile = () => { gapPending = null; window.__gapFiles = []; gapRepaint(); };
  // The CTA is dead until there is an actual pointer. A note alone files nothing — prose is not evidence.
  window.__gapDirty = () => DS.gapArmCTA(!!gapPending);

  // MORE THAN ONE POINTER. Each link is filed as its OWN record — fetched independently, own content-hash, own
  // provenance — so the runner needs no change: it already iterates every record filed against the engagement.
  // The BEHAVIOUR is in the DS (single source); the page only wires it, exactly as it does for gapArmCTA.
  window.__gapAddUrl = () => { DS.gapAddUrl(); window.__gapDirty && window.__gapDirty(); };
  window.__gapRemoveUrl = (btn) => { DS.gapRemoveUrl(btn); window.__gapDirty && window.__gapDirty(); };

  window.__gapFile = async (id) => {
    const g = (A.gapById && A.gapById[id]) || gapOpen;
    if (!g) return;
    const urls = DS.gapUrls();                                  // the same source the CTA arms from
    const note = ((document.getElementById('gap-note') || {}).value || '').trim();
    if (!urls.length && !gapPending) { window.__toast('Add a link or upload the document first.', true); return; }
    const bad = urls.find(u => !/^https?:\/\//i.test(u));
    if (bad) { window.__toast('Each link needs to be a full URL, starting http:// or https://', true); return; }
    if (!live) { window.__toast('Filing evidence needs the live workspace — this is the demo.'); return; }

    // THE HONEST CONFIRM. It names the DOWN direction before he commits, and it says plainly that signals he
    // did not file against can move too — because a cold re-score re-derives all 35, and pretending otherwise
    // would be the one lie this feature cannot afford.
    const ok = await window.__confirm({
      title: 'File this and re-score?',
      message: 'The assessment fetches what you filed, reads it cold, and scores all 35 signals again from the evidence. The score may rise, fall, or hold — and signals you did not file against can move too. The current score stays on the record either way. Once filed, a record cannot be withdrawn.',
      confirmLabel: 'File & re-score',
    });
    if (!ok) return;

    window.__toast(urls.length > 1 ? `Filing ${urls.length} records…` : 'Filing the record…');
    try {
      await EA.fileEvidence({ engagementId: p.id, gapId: g.id, urls, file: gapPending, note: note || null });
      gapPending = null; window.__gapFiles = [];
      const started = await EA.rescore({ engagementId: p.id });
      window.closeAux && window.closeAux();
      window.__toast(started
        ? 'Filed — re-scoring on the new evidence. This takes about 25 minutes.'
        : 'Filed. Re-score when you are ready.');
      await refresh();
    } catch (e) { window.__toast('Could not file the record: ' + ((e && (e.code || e.message)) || e), true); }
  };
  // A record already filed but not yet scored — the panel's CTA re-dispatches the run rather than filing again.
  window.__gapRescore = async () => {
    if (!live) { window.__toast('Re-scoring needs the live workspace — this is the demo.'); return; }
    const ok = await window.__confirm({
      title: 'Re-score on the filed evidence?',
      message: 'All 35 signals are scored again from the evidence, including the records you filed. The score may rise, fall, or hold.',
      confirmLabel: 'Re-score',
    });
    if (!ok) return;
    if (await EA.rescore({ engagementId: p.id })) { window.closeAux && window.closeAux(); window.__toast('Re-scoring on the new evidence.'); await refresh(); }
  };

  // "More" — the management overflow (delete + re-run + republish + sign-off) as an aux panel.
  window.__eaMore = () => {
    const st = stateBits();
    const item = (icon, label, onclick, danger) => `<button class="m3-btn text" style="justify-content:flex-start;width:100%;${danger ? 'color:var(--md-sys-color-error)' : ''}" onclick="window.closeAux&&window.closeAux();${onclick}"><span class="material-symbols-rounded">${icon}</span>${label}</button>`;
    const rows = [
      st.hasVerdict ? item('verified', st.signed ? 'Update sign-off' : 'Sign off & endorse', 'window.__eaSignoff()') : '',
      // a STALLED run must keep an escape hatch — otherwise a run that never got picked up is a dead end
      (st.hasDeck && (!st.active || DS.runStalled(st.rs))) ? item('restart_alt', (st.hasVerdict || st.active) ? 'Re-run assessment' : 'Run assessment', 'window.__eaRun()') : '',
      (st.active && DS.canStopRun(st.rs)) ? item('stop_circle', 'Stop run', 'window.__eaStop()', true) : '',
      st.recoverable ? item('restore', 'Republish saved results', 'window.__eaRepublish()') : '',
      st.hasDeck ? item('upload_file', 'Add data-room documents', "window.__eaUpload('dataroom')") : '',
      item('delete', 'Delete engagement', 'window.__eaDelete()', true),
    ].filter(Boolean).join('');
    window.openAux({ mode: 'push', title: 'Manage', subtitle: p.name, body: `<div style="display:flex;flex-direction:column;gap:4px;padding:4px 2px">${rows}</div>` });
  };

  // ── masthead actions (≤3, ≤1 filled) ──
  function mastheadActions(st) {
    // Deal memo / Share / Manage now live in the utility rail (window.RAIL_ACTIONS). The masthead keeps
    // ONLY the primary workflow CTA for the current state.
    if (!st.hasDeck) return [{ variant: 'filled', icon: 'upload_file', label: 'Upload deck', onclick: "window.__eaUpload('pitch')" }];
    // assessing — the ONLY masthead control is Stop, and ONLY when the run has reported the GitHub job id
    // (DS.canStopRun). A stop that can't actually kill the job would let the orphaned run finish, publish and
    // email "your assessment is ready" — so we render nothing rather than lie.
    if (st.active) return DS.canStopRun(st.rs) ? [{ variant: 'outlined', icon: 'stop_circle', label: 'Stop run', onclick: 'window.__eaStop()' }] : [];
    if (st.hasVerdict) {                                                          // verdict ready — the operator confirms or declines the deal
      const dec = p.assessmentDecision;
      if (!dec) return [
        { variant: 'filled', icon: 'check_circle', label: 'Confirm', onclick: "window.__eaDecide('confirmed')" },
        { variant: 'outlined', icon: 'do_not_disturb_on', label: 'Decline', onclick: "window.__eaDecideAsk('declined')" },
      ];
      return [{ variant: 'text', icon: 'edit', label: 'Change decision', onclick: 'window.__eaChangeDecision()' }];   // decided — the state shows in the pill
    }
    if (st.recoverable) return [{ variant: 'filled', icon: 'restore', label: 'Republish', onclick: 'window.__eaRepublish()' }, { variant: 'text', icon: 'restart_alt', label: 'Re-run', onclick: 'window.__eaRun()' }];
    return [{ variant: 'filled', icon: 'play_arrow', label: 'Run assessment', onclick: 'window.__eaRun()' }];   // idle + deck
  }
  function statusPill(st) {
    if (st.hasVerdict) {
      const dec = p.assessmentDecision;
      if (dec && dec.decision === 'confirmed') return { kind: 'ok', label: 'Confirmed', icon: 'check_circle' };
      if (dec && dec.decision === 'declined') return { kind: 'n', label: 'Declined', icon: 'do_not_disturb_on' };
      return A.status;   // AI recommendation (Invest/Consider/Pass) — awaiting the operator's call
    }
    if (st.active) return { kind: 'n', label: 'Assessing…', icon: 'autorenew' };
    if (st.flagged) return { kind: 'n', label: 'Needs attention', icon: 'warning' };
    return { kind: 'n', label: st.hasDeck ? 'Ready to run' : 'Awaiting deck', icon: 'pending' };
  }

  // ── body ──
  function statusBody(st) {
    // A RUN IN FLIGHT gets the assessing MEMO — the same editorial surface the finished verdict lives on,
    // caught mid-formation. When the verdict lands nothing MOVES; the placeholders resolve. (The old screen
    // was a run banner bolted to a rail-density checklist in a 1120px reading column.)
    if (st.active) return `<div class="brief" id="ea-memo">${DS.assessingMemo(A, S, st.rs)}</div>`;

    // everything else (no deck / deck ready / flagged) keeps the note-card surface
    const banner = st.flagged ? DS.runBanner(st.rs) : '';
    let note = '';
    if (!st.hasDeck) note = DS.noteCard({ icon: 'upload_file', text: 'Upload a pitch deck to run the assessment — it underpins the ask and the thesis.', actions: `<button class="m3-btn filled" onclick="window.__eaUpload('pitch')"><span class="material-symbols-rounded">upload_file</span>Upload deck</button>` });
    else if (!st.flagged) note = DS.noteCard({ icon: 'play_arrow', text: 'Deck ready. Run the assessment — the agents research, score and draft the verdict.', actions: `<button class="m3-btn filled" onclick="window.__eaRun()"><span class="material-symbols-rounded">play_arrow</span>Run assessment</button>` });
    else note = DS.noteCard({ icon: 'warning', iconColor: 'var(--warning)', text: 'The run needs attention — your results are saved. Republish to re-apply them, or re-run.', actions: `<button class="m3-btn filled" onclick="window.__eaRepublish()">Republish</button><button class="m3-btn text" onclick="window.__eaRun()">Re-run</button>` });
    const forming = st.snap ? `<hr class="rule">${DS.investabilityComposition(S, 'openInvest', { eyebrow: 'Investability', title: 'The score, forming', meta: 'The run rates all 35 signals at the end' })}` : '';
    const life = `<hr class="rule"><section class="sec">
      <div class="sec-head"><span class="eyebrow accent">The engagement</span><span class="t">Where this sits</span><span class="meta">Intake → decision</span></div>
      ${DS.lifecycleStrip(A.lifecycle, { scale: 'editorial' })}
    </section>`;
    return `<div class="brief"><div id="ea-status">${banner}</div>${DS.missingDocs(A)}${note}${forming}${life}</div>`;
  }
  function verdictTabs(st) {
    const slim = (st.active || st.flagged) ? `<div class="brief" style="padding-bottom:0;margin-bottom:4px" id="ea-status">${DS.runBanner(st.rs)}</div>` : '<span id="ea-status"></span>';
    return `
      <div class="tab-panel active">${slim}${DS.missingDocs(A) ? `<div class="brief" style="padding-bottom:0">${DS.missingDocs(A)}</div>` : ''}${DS.verdictMemo(A, S)}</div>
      <div class="tab-panel"><div class="brief">${DS.investabilityHero(S, A)}${DS.scoreProvenance(invSnapshots)}${DS.scoreMovement(A.filings)}<hr class="rule">${DS.investabilityComposition(S, 'openInvest')}<hr class="rule">${DS.strengthProfile(S, 'openInvest')}</div></div>
      <div class="tab-panel">${DS.marketMemo(A)}</div>
      <div class="tab-panel">${DS.teamMemo(A)}</div>
      <div class="tab-panel">${DS.diligenceEditorial(A)}</div>
      <div class="tab-panel">${DS.researchMemo(A, S)}</div>`;
  }

  // ── paint: mount once; refresh reloads on the verdict transition, else swaps masthead + body in place ──
  let mounted = false, lastVerdict = null;
  function paint() {
    const st = stateBits();
    // The Diligence tab carries a small count when the run recorded gaps it could not close. It is the ONLY
    // ambient signal the feature gets: not a 7th tab (a permanent chapter about US, empty on the good deals)
    // and not a masthead count (which would compete with Run/Confirm/Decline and read as a venture defect).
    // Only gaps that STILL ASK SOMETHING OF HIM. A gap he has already filed evidence against must stop
    // nagging him from the tab — DS.gapNeedsAction is the one derivation, shared with the row pill and counts.
    const nGaps = (A.gaps || []).filter(g => DS.gapNeedsAction(g)).length;
    const tabs = st.hasVerdict
      ? ['Verdict', 'Investability', 'Market', 'Team', { label: 'Diligence', badge: nGaps || null }, 'Research']
      : false;
    const bodyHtml = st.hasVerdict ? verdictTabs(st) : `<div class="tab-panel active">${statusBody(st)}</div>`;
    const mh = DS.masthead({
      breadcrumb: { label: 'Portfolio', href: 'dashboard-m3.html' }, crumbTail: A.name, avatar: A.initials,
      headline: A.name, status: statusPill(st), subheading: A.stageLine, compact: A.name,
      actions: mastheadActions(st), tabs, activeTab: 0
    });
    if (!mounted) {
      document.getElementById('app').outerHTML = DS.pageShell({
        active: 'portfolio', nav: wsNavConfig(), brand: wsBrandConfig(), account: wsAccountConfig(),
        aux: {}, drill: true, rail: acts.rail, railOverflow: acts.overflow, masthead: mh, body: bodyHtml
      });
      DS.initShell(); mountOrgSwitcherM3(); mounted = true;
    } else {
      const main = document.querySelector('.shell-main');
      const oldMh = main.querySelector('.masthead'); if (oldMh) oldMh.outerHTML = mh;
      const sb = main.querySelector('.shell-body'); if (sb) sb.innerHTML = bodyHtml;
    }
    if (tabs) DS.initTabs({ names: ['verdict', 'investability', 'market', 'team', 'diligence', 'research'] });
    wireResearchDrill();   // paint() swaps .shell-body — rebuild the reading room + DRILL_PAGES every time
    lastVerdict = st.hasVerdict;
  }

  // ---- deep research: every document opens as its own full DRILL PAGE ----
  // A.reading is the UNFILTERED set — every hubDoc that has a body, including the deal memo, which the
  // count-bearing A.research deliberately excludes. Nothing the run produced is hidden from the reader.
  // Keys are the deduped canonical slugs, so ?drill=<slug> deep-links stay stable across re-runs.
  function wireResearchDrill() {
    const room = DS.researchRoom((A.reading && A.reading.length) ? A.reading : (A.research || []));
    window.__room = room;
    window.DRILL_PAGES = {};
    room.all.forEach(d => { window.DRILL_PAGES[d.slug] = () => DS.researchDrillOpts(d, room); });
  }
  window.openResearchDrill = slug => {
    const o = window.DRILL_PAGES && window.DRILL_PAGES[slug];
    if (o) window.openDrill({ key: slug, source: document.activeElement, ...o() });
  };

  async function refresh() {
    // a re-render detaches the row that opened the drill — close it first so focus can't strand
    if (document.querySelector('.m3-app.drill-open')) window.closeDrill && window.closeDrill({ fromPop: true });
    await loadData();
    // a verdict appearing/disappearing changes the masthead tab structure — a clean reload beats surgical DOM
    if (mounted && stateBits().hasVerdict !== lastVerdict) { location.reload(); return; }
    paint();
    startTicker();   // a refresh may have landed us in (or out of) an active run
  }

  // the per-category drill also carries the gap triggers: a signal we scored down because our RESEARCH
  // missed something offers the file-evidence chip in its (otherwise empty) evidence slot.
  window.openInvest = (key) => { const d = DS.categoryDetail(S, key, A.gapBySlug); window.openAux({ mode: 'push', title: d.title, subtitle: d.subtitle, body: d.body }); };
  // "Read the full competitive teardown / founder diligence" now open the FULL document as a drill page,
  // rendered through renderArticle (real GFM). They previously showed a one-line summary through mdToHtml,
  // which silently deleted every table, rule, code block and heading.
  const findDoc = re => ((window.__room && window.__room.all) || []).find(d => re.test(d.slug) || re.test(d.title.toLowerCase()));
  window.openPeek = (kind, i) => {
    const room = window.__room;
    if (kind === 'research') { const d = room && room.all[i]; return d ? window.openResearchDrill(d.slug) : undefined; }
    const d = kind === 'benchmark' ? findDoc(/benchmark|competitor|competitive/) : findDoc(/team|diligence/);
    if (d) return window.openResearchDrill(d.slug);
    window.__toast && window.__toast(kind === 'benchmark' ? 'The competitive teardown has not been generated yet.' : 'The founder diligence has not been generated yet.');
  };
  window.RAIL_PANELS = { sources: () => DS.sourcesPanel(A) };
  // Deal memo / Share / Manage moved off the masthead → the utility rail. deal_memo downloads the PDF,
  // share opens the shareable-link flow, and the rail's overflow kebab (__more) opens the Manage menu.
  window.RAIL_ACTIONS = {
    deal_memo: () => stateBits().hasVerdict ? window.__eaDownload() : window.__toast('The deal memo is ready once the assessment has a verdict.'),
    share: () => stateBits().hasVerdict ? window.__eaShare() : window.__toast('You can share the memo once the assessment has a verdict.'),
    __more: () => window.__eaMore(),
  };
  window.openSources = () => window.openAux({ mode: 'push', ...DS.sourcesPanel(A) });
  window.addDocuments = () => window.__eaUpload('dataroom');
  window.rerunAssessment = () => window.__eaRun();

  // ONE place that repaints the run surface in place. #ea-memo (the whole assessing memo) and #ea-status
  // (a slim banner shown beside a verdict) are DIFFERENT surfaces — repainting the wrong one destroys the
  // other. Never write runBanner into #ea-memo.
  function repaintRun() {
    const st = stateBits();
    const memo = document.getElementById('ea-memo');
    if (memo && st.active) { memo.innerHTML = DS.assessingMemo(A, S, st.rs); return; }
    const el = document.getElementById('ea-status');
    if (el) el.innerHTML = (st.active || st.flagged) ? DS.runBanner(st.rs) : '';
  }

  // ── the run clock. The runner only writes to Firestore when its STEP changes (~11 pushes across a
  // multi-minute run), so between milestones there can be minutes of silence. Without a local tick the
  // elapsed counter freezes and a hung run looks alive forever — this is what makes the stall detector real.
  let tick = null;
  function stopTicker() { if (tick) { clearInterval(tick); tick = null; } }
  function startTicker() {
    stopTicker();
    if (!stateBits().active) return;
    tick = setInterval(() => {
      if (!stateBits().active) { stopTicker(); refresh(); return; }   // finished between pushes → full repaint
      repaintRun();
    }, 30000);
  }

  await loadData();
  paint();
  startTicker();

  // ── live: reflect run progress without a full reload (targeted #ea-status), reload once when the verdict lands ──
  if (live) {
    try {
      const data = await import('../firebase/data.js');
      if (data.watchEngagement) {
        data.watchEngagement(p.id, (eng) => {
          if (!eng) return;
          const hadVerdict = !!(p.assessment && p.assessment.recommendation);
          const wasActive = stateBits().active;
          Object.assign(p, eng);
          const hasVerdict = !!(p.assessment && p.assessment.recommendation);
          if (hasVerdict !== hadVerdict) { stopTicker(); location.reload(); return; }   // structural change → clean reload
          const st = stateBits();
          // A run that ends WITHOUT a verdict (error / needs-attention / limit-paused) produces no reload
          // above, and the masthead still holds the empty `st.active → []` action set. Repaint the page so
          // Republish / Re-run actually appear instead of stranding the operator with a dead banner.
          if (wasActive && !st.active) { stopTicker(); refresh(); return; }
          repaintRun();                                      // in-place refresh (no listener churn)
          startTicker();
        });
      }
    } catch (e) { console.warn('watchEngagement unavailable', e); }
  }
</script>
</body>
</html>
