<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Research-run banner + draft-card accents (page-local) */
    .run-banner { display:flex; align-items:center; justify-content:space-between; gap:1.25rem; background:var(--surface-2,#fff); border-radius:16px; padding:1.4rem 1.6rem; box-shadow:6px 6px 14px rgba(0,0,0,0.06),-6px -6px 14px rgba(255,255,255,0.7); margin-bottom:1.5rem; }
    .run-banner-main { flex:1; min-width:0; }
    .run-banner-title { font-weight:600; font-size:1rem; color:var(--text,#141414); display:flex; align-items:center; gap:0.5rem; }
    .run-banner-sub { font-size:0.85rem; color:var(--text-muted,#656565); margin-top:0.3rem; line-height:1.5; }
    .run-banner.run-running { background:linear-gradient(180deg, rgba(110,58,250,0.06), rgba(110,58,250,0.01)); }
    .run-spinner { width:14px; height:14px; border:2px solid rgba(110,58,250,0.25); border-top-color:var(--brand,#6E3AFA); border-radius:50%; display:inline-block; animation:run-spin 0.7s linear infinite; flex:none; }
    @keyframes run-spin { to { transform:rotate(360deg); } }
    .prov-card-draft { border-left:3px solid var(--brand,#6E3AFA); }
    @media (max-width:640px){ .run-banner{ flex-direction:column; align-items:stretch; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="agents.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    import { renderCardBody, ensureCardStyles } from '../shared/card-format.js';
    import { renderDataRoom, hydrateDataRoom, ensureHubStyles } from '../shared/hub-view.js';
    import { renderVSSScorecard, renderStrengthenSuggestions, ensureInvestabilityStyles } from '../shared/investability-view.js';
    import { esc as escBrief } from '../shared/util.js';
    await window.WORKSPACE_READY;
    ensureCardStyles();
    ensureHubStyles();
    ensureInvestabilityStyles();
    const W = window.WORKSPACE;
    const A = window.WORKSPACE_AGENTS;
    const { helpers, labels, programs: allPrograms } = W;

    // Read ?id= from URL, default to first program if any exist
    const params = new URLSearchParams(window.location.search);
    const fallback = allPrograms[0] || null;
    const id = params.get('id') || (fallback && fallback.id);
    const p = allPrograms.find(x => x.id === id) || fallback;
    const operator = p ? helpers.getOperator(p.assignedOperator) : null;
    const isAssess = !!(p && p.engagementType === 'assessment');

    // Guard: no engagements yet → render a minimal "not found" view
    if (!p) {
      window.renderShell(`
        <div style="text-align:center;padding:5rem 2rem;color:var(--text-muted, #656565);">
          <h1 style="font-size:1.4rem;margin-bottom:0.5rem;color:var(--text, #141414);">No engagement loaded</h1>
          <p style="margin-bottom:1.5rem;">There&rsquo;s no engagement at this URL yet. Start a new one to populate this view.</p>
          <a href="new-engagement.html" class="btn btn-primary">New engagement</a>
        </div>
      `);
      throw new Error('halt-render'); // stop the rest of this script
    }

    // ---- Agent-derived signals -----------------------------------------
    // engagement-health-monitor verdict + reasoning, and tier-compliance-
    // auditor completeness. Health follows the dashboard's demo/live split
    // (demo keeps the curated narrative; live computes from state).
    // Completeness is deterministic from hub state, so it's always computed.
    const useLive = (W.demoMode || 'off') === 'off';
    const health = (useLive && A) ? A.computeEngagementHealth(p) : null;
    const healthLevel = health ? health.level : p.health;
    const completeness = A ? A.computeCompleteness(p) : { pct: 0, completedItems: 0, expectedItems: 0 };

    // Provocation cards for this engagement (live mode reads from Firestore).
    let provCards = [];
    if (W.mode === 'live') {
      try { const data = await import('../firebase/data.js'); provCards = await data.listCardsForEngagement(p.id); }
      catch (e) { console.warn('cards load failed', e); }
    }
    // Latest investability snapshot (VSS v2) for the operator summary.
    let invSnapshot = null;
    if (W.mode === 'live') {
      try { const data = await import('../firebase/data.js'); const snaps = await data.listInvestabilitySnapshots(p.id); invSnapshot = snaps.length ? snaps[snaps.length - 1] : null; }
      catch (e) { console.warn('investability load failed', e); }
    } else if (p.investabilitySnapshot) {
      invSnapshot = p.investabilitySnapshot;   // demo/sample fixture
    }
    // Data-room L3 hub content (deep research / strategy / financials).
    let hubDocs = [];
    if (W.mode === 'live') {
      try { const data = await import('../firebase/data.js'); hubDocs = await data.listHubDocs(p.id); }
      catch (e) { console.warn('hub docs load failed', e); }
    }
    // Operator clicks "Run research agents" → queue a headless run. The banner
    // updates live (via the watchEngagement subscription below) as the runner
    // picks it up, progresses, and publishes draft cards.
    window.__triggerRun = async function(engagementId, phase) {
      phase = phase || 'research';
      const btn = document.getElementById('run-trigger-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Queuing…'; }
      try {
        const data = await import('../firebase/data.js');
        const me = (W.helpers.currentOperator && W.helpers.currentOperator()) || null;
        // Prefer the cloud dispatcher (GitHub Actions — no machine needed). Falls
        // back to local-daemon queue if dispatch isn't configured.
        try {
          const { auth } = await import('../firebase/firebase.js');
          const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
          if (idToken) {
            const resp = await fetch('/api/dispatch-run', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ idToken, engagementId, phase })
            });
            if (resp.ok) return;                 // cloud Action fired
          }
        } catch (e) { /* fall through to local-daemon queue */ }
        await data.requestRun(engagementId, phase, (me && me.email) || null);
      } catch (e) {
        alert('Could not start the run: ' + ((e && (e.code || e.message)) || e));
        if (btn) { btn.disabled = false; btn.textContent = 'Run'; }
      }
    };
    window.__runResearch = (id) => window.__triggerRun(id, 'research');

    // Deck/document upload on the Workspace (assessment mode). Reuses /api/ingest-docs.
    function __readFileB64(file) {
      return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error('read failed')); r.readAsDataURL(file); });
    }
    window.__uploadDeck = async function(engagementId) {
      const input = document.getElementById('deck-input');
      const files = Array.from((input && input.files) || []);
      if (input) input.value = '';
      if (!files.length) return;
      const stateEl = document.getElementById('deck-state');
      const { auth } = await import('../firebase/firebase.js');
      const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
      for (const file of files) {
        if (file.size > 4 * 1024 * 1024) { if (stateEl) stateEl.innerHTML = `<span style="color:var(--danger,#C0392B);">${escBrief(file.name)} is over 4MB.</span>`; continue; }
        if (stateEl) stateEl.innerHTML = `<span class="run-spinner"></span> Reading ${escBrief(file.name)}…`;
        try {
          const dataBase64 = await __readFileB64(file);
          const resp = await fetch('/api/ingest-docs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken, engagementId, file: { name: file.name, dataBase64 } }) });
          const d = await resp.json().catch(() => ({}));
          if (!resp.ok) throw new Error(d.detail || d.error || ('HTTP ' + resp.status));
        } catch (e) { if (stateEl) stateEl.innerHTML = `<span style="color:var(--danger,#C0392B);">Couldn&rsquo;t read ${escBrief(file.name)}: ${escBrief((e && e.message) || e)}</span>`; }
      }
      window.location.reload();   // refresh the deck count + list
    };
    // Best-effort email nudge to the other side — never blocks the action.
    async function notifyRecipient(direction) {
      try {
        const { auth } = await import('../firebase/firebase.js');
        const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
        if (!idToken) return;
        await fetch('/api/notify', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken, engagementId: p.id, direction })
        });
      } catch (e) { /* notification is best-effort */ }
    }
    window.__sendCard = async function(cardId) {
      const data = await import('../firebase/data.js');
      try { await data.sendCardToFounder(cardId); notifyRecipient('founder'); } // cards re-render live
      catch (e) { alert('Could not send the card: ' + ((e && (e.code || e.message)) || e)); }
    };
    window.__sendAllDrafts = async function(engagementId) {
      const data = await import('../firebase/data.js');
      try {
        const n = await data.sendDraftsToFounder(engagementId);
        if (n) notifyRecipient('founder'); else alert('No draft cards to send.');
      } catch (e) { alert('Could not send the cards: ' + ((e && (e.code || e.message)) || e)); }
    };
    window.__deleteEngagement = async function() {
      if (!window.confirm(`Delete "${p.name}" permanently?\n\nThis removes it from the Workspace AND ${p.founderName || 'the founder'}'s Studio, including all its provocation cards. This cannot be undone.`)) return;
      try {
        const data = await import('../firebase/data.js');
        await data.deleteEngagementDeep(p.id);
        window.location.href = 'dashboard.html';
      } catch (e) {
        alert('Could not delete the engagement: ' + ((e && (e.code || e.message)) || e));
      }
    };

    const reasonIcon = { critical: '⚠', warn: '!', opportunity: '↗', positive: '✓' };
    const healthReasonsHTML = (health && health.reasons && health.reasons.length) ? `
      <div class="program-detail-reasons">
        ${health.reasons.slice(0, 3).map(r => `
          <div class="program-card-reason ${health.level}">
            <span class="program-card-reason-icon">${reasonIcon[r.severity] || '•'}</span>
            <span>${r.text}</span>
          </div>
        `).join('')}
      </div>
    ` : '';

    function hubCardHTML(key, data) {
      const status = data.status || 'pending';
      if (status === 'disabled') {
        // Hub was unticked at wizard time → render a muted placeholder
        return `
          <div class="hub-card disabled">
            <div class="hub-card-head">
              <div class="hub-card-name" style="color:var(--text-muted,#656565);text-decoration:line-through;">${labels.hub[key]}</div>
              <span class="hub-card-status" style="opacity:0.4;">Not in scope</span>
            </div>
            <div class="hub-card-detail" style="color:var(--text-muted,#888);">Excluded from this engagement at launch.</div>
          </div>
        `;
      }
      const meta = (data.cards ? `${data.cards} cards` : 'Awaiting activation');
      const action = ({
        'signed': 'View hub &rarr;',
        'ready-to-sign': 'Review &amp; close gate &rarr;',
        'awaiting-founder': 'Open in the Studio &rarr;',
        'in-progress': 'Open hub &rarr;',
        'pending': 'Locked until phase opens'
      })[status] || '';
      return `
        <div class="hub-card ${status}">
          <div class="hub-card-head">
            <div class="hub-card-name">${labels.hub[key]}</div>
            <span class="hub-card-status ${status}">${helpers.hubStatusLabel(status)}</span>
          </div>
          <div class="hub-card-detail">${meta}</div>
          <div style="margin-top:auto;padding-top:0.5rem;">
            <span class="text-mono dim" style="font-size:0.78rem;">${action}</span>
          </div>
        </div>
      `;
    }

    const hubOrder = ['research','vision','strategy','financials','marketing','video','blog'];
    const hubsHTML = hubOrder.map(k => hubCardHTML(k, p.hubs[k] || { status: 'disabled' })).join('');

    // ---------------- Timeline ------------------------------------------
    // Pulls events from `p.activity[]` if present. Otherwise synthesises
    // a sensible timeline from phase + lastActivity so newly-launched
    // engagements aren't padded with fake history.
    function timelineEventsFor(p) {
      // If the engagement carries real activity events, use them as-is.
      if (Array.isArray(p.activity) && p.activity.length) {
        return p.activity.map(e => ({ when: e.when, detail: e.detail, pending: !!e.pending }));
      }
      // Phase 0 — just created → show launch + what's coming
      if (p.phase === 0) {
        return [
          { when: p.lastActivity || 'just now', detail: p.lastActivityDetail || 'Engagement launched via Workspace wizard' },
          { when: 'Pending', detail: `Studio invite sends to <span class="agent">${p.founderName}</span>`, pending: true },
          { when: 'Pending', detail: 'Welcome Pack PDF generated by <span class="agent">handoff:assemble</span>', pending: true },
          { when: 'Pending', detail: 'First daily briefing scheduled', pending: true },
          { when: 'Pending', detail: '<span class="agent">research-curator</span> drafts the first 5–7 Research Hub Provocation Cards', pending: true }
        ];
      }
      // Phases 1+ but no recorded activity → at least show lastActivity if it exists
      if (p.lastActivity) {
        return [{ when: p.lastActivity, detail: p.lastActivityDetail || 'Activity recorded' }];
      }
      return [];
    }
    const events = timelineEventsFor(p);
    const timelineHTML = events.length
      ? `<div class="timeline">${events.map(e => `
            <div class="timeline-item ${e.pending ? 'faded' : ''}">
              <div class="timeline-time">${e.when}</div>
              <div class="timeline-detail">${e.detail}</div>
            </div>
          `).join('')}</div>`
      : `<div style="text-align:center;padding:1.5rem;color:var(--text-muted,#656565);font-size:0.88rem;">No activity recorded yet.</div>`;

    // ---------------- Founder brief (operator read view) ---------------
    // Renders engagement.brief — what the founder submitted in the Studio —
    // so the operator can actually read it, not just see "submitted".
    // escBrief is imported from ../shared/util.js (esc) — one definition for all surfaces.
    function briefFieldHTML(label, key, b) {
      const value = b[key];
      if (key === 'features') {
        const items = (Array.isArray(value) ? value : []).filter(Boolean);
        if (!items.length) return '';
        return `<div class="brief-field"><div class="brief-field-label">${label}</div><ol class="brief-features">${items.map(f => `<li>${escBrief(f)}</li>`).join('')}</ol></div>`;
      }
      let display;
      if (Array.isArray(value)) display = value.filter(Boolean).map(escBrief).join(' · ');
      else display = (value == null) ? '' : escBrief(value);
      if (!display) return '';
      return `<div class="brief-field"><div class="brief-field-label">${label}</div><div class="brief-field-value">${display}</div></div>`;
    }
    const BRIEF_GROUPS = [
      { title: 'Overview', fields: [['One-liner','oneLine'],['Industry','industry'],['Problem','problem'],['Target user','targetUser'],['1-year vision','oneYearVision']] },
      { title: 'Goals', fields: [['Primary goal','primaryGoal'],['Motivations','motivations'],['Success looks like','successLooksLike']] },
      { title: 'Features', fields: [['Key features','features']] },
      { title: 'Inspiration & platform', fields: [['Comparables','comparables'],['Design style','designStyle'],['Preferred tools','preferredTools']] },
      { title: 'Team & notes', fields: [['Other stakeholders','otherStakeholders'],['Technical capability','technicalCapability'],['Notes','notes']] }
    ];
    function briefSectionHTML(p) {
      const b = p.brief;
      const submitted = (b && p.briefSubmittedAt) ? `<span class="text-mono dim" style="font-size:0.72rem;">Submitted ${escBrief(p.briefSubmittedAt)}</span>` : '';
      const head = `<div class="section-head"><div><div class="section-title">Founder brief</div><div class="section-sub">What the founder submitted in the Studio &mdash; the source for every downstream agent.</div></div>${submitted}</div>`;
      if (!b) {
        const msg = (p.briefSubmitted === false)
          ? `<strong style="color:var(--text);font-weight:600;">Awaiting brief from ${escBrief(p.founderName || 'the founder')}.</strong> Studio invite sent to ${escBrief(p.founderEmail || 'the founder')}. The brief appears here the moment it&rsquo;s submitted.`
          : `Brief on file. Full content isn&rsquo;t available in this view.`;
        return `<div class="section">${head}<div class="card" style="text-align:center;padding:2rem;color:var(--text-muted);">${msg}</div></div>`;
      }
      const groups = BRIEF_GROUPS.map(g => {
        const fields = g.fields.map(([label, key]) => briefFieldHTML(label, key, b)).join('');
        return fields ? `<div class="brief-group"><div class="brief-group-title">${g.title}</div>${fields}</div>` : '';
      }).join('');
      const pdf = b.pdfFilename ? `<div class="brief-group"><div class="brief-group-title">Uploaded document</div><div class="brief-field"><div class="brief-field-value">&#128196; ${escBrief(b.pdfFilename)}</div></div></div>` : '';
      const body = (groups || pdf) ? `<div class="card brief-view">${groups}${pdf}</div>` : `<div class="card" style="padding:1.5rem;color:var(--text-muted);">Brief submitted, but all fields were left blank.</div>`;
      return `<div class="section">${head}${body}</div>`;
    }

    // ---------------- Run banner (live agent-run status) ----------------
    // The single control for the research run. Locked until the brief is in;
    // then trigger → queued → running (live step/totalSteps) → done/error.
    function runBannerHTML(rs, p) {
      const briefIn = p.briefSubmitted !== false && !!p.brief;
      const status = (rs && rs.status) || 'idle';
      const active = ['queued', 'running', 'partial'].includes(status);

      if (!briefIn && !active) {
        return `<div class="run-banner run-idle">
          <div class="run-banner-main">
            <div class="run-banner-title">Research agents</div>
            <div class="run-banner-sub">Unlocks the moment ${escBrief(p.founderName || 'the founder')} submits the brief. Then one click runs the deep research and drafts the provocation cards &mdash; no VS Code needed.</div>
          </div>
          <button class="btn btn-primary" disabled style="opacity:0.5;cursor:not-allowed;">&#9654;&nbsp; Run research agents</button>
        </div>`;
      }

      if (active) {
        const total = rs.totalSteps || 0;
        const step = rs.step || 0;
        const pct = total ? Math.round((step / total) * 100) : (status === 'queued' ? 6 : 14);
        const label = rs.label || (status === 'queued' ? 'Queued &mdash; waiting for the engagement runner&hellip;' : 'Running research agents&hellip;');
        const counter = total ? `<span class="text-mono dim" style="font-size:0.8rem;">&middot; ${step}/${total} sections</span>` : '';
        return `<div class="run-banner run-running">
          <div class="run-banner-main">
            <div class="run-banner-title"><span class="run-spinner"></span> ${status === 'queued' ? 'Queued' : 'Research running'} ${counter}</div>
            <div class="run-banner-sub">${escBrief(label)}</div>
            <div class="progress" style="margin-top:0.75rem;"><div class="progress-bar" style="width:${pct}%;transition:width .5s ease;"></div></div>
          </div>
        </div>`;
      }

      // Terminal states — result + run-again.
      const meta = (rs && rs.finishedAt) ? `<span class="text-mono dim" style="font-size:0.72rem;">Last run ${escBrief(rs.finishedAt)}</span>` : '';
      let note;
      if (status === 'done') note = `<div class="run-banner-sub">&#10003; Research complete &mdash; review the draft cards below, then send them to the founder.</div>`;
      else if (status === 'error') note = `<div class="run-banner-sub" style="color:var(--danger,#C0392B);">Last run errored: ${escBrief((rs && rs.error) || 'unknown error')}. Safe to retry.</div>`;
      else if (status === 'limit-paused') note = `<div class="run-banner-sub" style="color:#C77700;">Paused &mdash; Claude usage limit reached. Resume when your window resets; it picks up where it left off.</div>`;
      else note = `<div class="run-banner-sub">Run the deep research and draft the provocation cards from the brief. Runs on your Claude subscription &mdash; no VS Code.</div>`;
      const btnLabel = status === 'limit-paused' ? '&#9654;&nbsp; Resume run' : (status === 'done' ? '&#8635;&nbsp; Re-run research' : '&#9654;&nbsp; Run research agents');
      return `<div class="run-banner run-idle">
        <div class="run-banner-main">
          <div class="run-banner-title">Research agents</div>
          ${note}
        </div>
        <div style="display:flex;flex-direction:column;gap:0.4rem;align-items:flex-end;">
          <button id="run-trigger-btn" class="btn btn-primary" onclick="window.__runResearch('${p.id}')">${btnLabel}</button>
          ${meta}
        </div>
      </div>`;
    }

    // ---------------- Provocation cards (operator playback) -------------
    function provCardHTML(c, opts) {
      opts = opts || {};
      const r = c.founderResponse;
      const statusPill = opts.hidePill ? '' : (c.status === 'draft'
        ? `<span class="pill" style="background:rgba(110,58,250,0.1);color:var(--brand,#6E3AFA);"><span class="dot"></span> Draft</span>`
        : (r
          ? `<span class="pill ${r.decision === 'accept' ? 'health-on-track' : r.decision === 'reject' ? 'health-stuck' : 'health-attention'}"><span class="dot"></span> Founder: ${escBrief(r.decision)}</span>`
          : `<span class="pill"><span class="dot"></span> Awaiting founder</span>`));
      const typePill = c.type ? `<span class="text-mono dim" style="font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;">&middot; ${escBrief(String(c.type).replace(/-/g, ' '))}</span>` : '';
      const response = r
        ? `<div class="prov-card-response">
             <div class="prov-card-response-label">Founder responded &middot; ${escBrief(r.decision)}${r.respondedAt ? ' &middot; ' + escBrief(r.respondedAt) : ''}</div>
             ${r.comment ? `<div class="prov-card-response-comment">&ldquo;${escBrief(r.comment)}&rdquo;</div>` : '<div class="prov-card-response-comment dim">No comment left.</div>'}
           </div>`
        : '';
      const sendBtn = opts.draft
        ? `<div style="margin-top:0.85rem;display:flex;justify-content:flex-end;"><button class="btn btn-outline btn-sm" onclick="window.__sendCard('${c.id}')">Send to founder &rarr;</button></div>`
        : '';
      return `
        <div class="prov-card${c.status === 'draft' ? ' prov-card-draft' : ''}">
          <div class="prov-card-head">
            <span class="prov-card-meta text-mono">${escBrief((c.hub || '').toUpperCase())} &middot; ${escBrief(c.level || 'L1')} #${c.number || ''} ${typePill}</span>
            ${statusPill}
          </div>
          <div class="prov-card-title">${escBrief(c.title || '')}</div>
          ${c.body ? `<div class="prov-card-body">${renderCardBody(c.body)}</div>` : ''}
          ${response}
          ${sendBtn}
        </div>`;
    }

    function draftCardsSectionHTML(drafts, p) {
      if (!drafts.length) return '';
      const head = `<div class="section-head"><div><div class="section-title">Draft cards &middot; your review</div><div class="section-sub">The agents drafted these from the brief. Review, then release them to ${escBrief(p.founderName || 'the founder')}&rsquo;s Studio &mdash; nothing reaches the founder until you send it.</div></div><button class="btn btn-primary btn-sm" onclick="window.__sendAllDrafts('${p.id}')">Send all ${drafts.length} to founder &rarr;</button></div>`;
      return `<div class="section">${head}<div class="prov-cards-list">${drafts.map(c => provCardHTML(c, { draft: true })).join('')}</div></div>`;
    }

    function sentCardsSectionHTML(cards, p) {
      const responded = cards.filter(c => c.founderResponse).length;
      const counter = cards.length ? `<span class="text-mono dim" style="font-size:0.72rem;">${responded}/${cards.length} answered</span>` : '';
      const head = `<div class="section-head"><div><div class="section-title">Provocation cards &middot; sent</div><div class="section-sub">L1 cards released to the founder&rsquo;s Studio &mdash; their responses reshape research &amp; strategy.</div></div><div style="display:flex;gap:0.75rem;align-items:center;">${counter}</div></div>`;
      if (!cards.length) {
        const hint = (W.mode === 'live')
          ? `Run the research agents above to draft cards from the brief, then send them here.`
          : `Provocation cards appear here once the engagement is live on the backend.`;
        return `<div class="section">${head}<div class="card" style="text-align:center;padding:2rem;color:var(--text-muted);">No cards sent to the founder yet. ${hint}</div></div>`;
      }
      return `<div class="section">${head}<div class="prov-cards-list">${cards.map(c => provCardHTML(c, { draft: false })).join('')}</div></div>`;
    }

    // Combined cards region: drafts (operator review) above sent (playback).
    function cardsRegionHTML(cards, p) {
      const drafts = cards.filter(c => c.status === 'draft');
      const sent = cards.filter(c => c.status !== 'draft');
      return draftCardsSectionHTML(drafts, p) + sentCardsSectionHTML(sent, p);
    }

    // ---------------- Investability (operator summary, VSS v2) ----------
    function investabilitySectionHTML(snap, p) {
      const subCopy = isAssess
        ? 'VSS v2 (TDK 7×5) &mdash; investor-lens score from the deck + diligence. Operator-only.'
        : 'VSS v2 (TDK 7×5) &mdash; the founder sees this in their Studio. Updates each gate.';
      const head = `<div class="section-head"><div><div class="section-title">Investability</div><div class="section-sub">${subCopy}</div></div></div>`;
      if (!snap) {
        const emptyCopy = isAssess
          ? 'No score yet. Run the assessment to score this venture against the TDK 7×5 rubric.'
          : 'No score yet. It computes automatically when the research run completes.';
        return `<div class="section">${head}<div class="card" style="text-align:center;padding:1.75rem;color:var(--text-muted);">${emptyCopy}</div></div>`;
      }
      const sg = (p.investabilitySuggestions && p.investabilitySuggestions.items) || [];
      return `<div class="section">${head}
        <div class="card">
          ${renderVSSScorecard(snap, { variant: 'operator', esc: escBrief, metaText: `Auto-scored · ${snap.ratedCount || 0} of 35 signals rated` })}
          ${renderStrengthenSuggestions(sg, { esc: escBrief })}
        </div></div>`;
    }

    function dangerZoneHTML(p) {
      return `
        <div class="section">
          <div class="section-head"><div><div class="section-title">Danger zone</div><div class="section-sub">Permanently delete this engagement &mdash; removes it from the Workspace and ${escBrief(p.founderName || 'the founder')}&rsquo;s Studio, with all its cards.</div></div></div>
          <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid rgba(192,57,43,0.25);">
            <div style="font-size:0.88rem;color:var(--text-muted);">This can&rsquo;t be undone.</div>
            <button class="btn btn-sm" style="background:rgba(192,57,43,0.1);color:var(--danger,#C0392B);border:1px solid rgba(192,57,43,0.3);font-weight:600;" onclick="window.__deleteEngagement()">Delete engagement</button>
          </div>
        </div>`;
    }

    // ---------------- Assessment view (investor mode, Workspace-only) ----------
    function deckUploadHTML(p) {
      const n = p.founderDocCount || 0;
      return `<div class="run-banner" style="display:block;">
        <div class="run-banner-title" style="margin-bottom:0.4rem;">Pitch deck &amp; documents</div>
        <div class="run-banner-sub" style="margin-bottom:0.9rem;">${n ? `${n} document${n === 1 ? '' : 's'} attached.` : 'Upload the pitch deck, financial model, or any documents (PDF, Word, Excel, text).'} The assessment reads these &mdash; producing a score, key findings, and how to strengthen the venture.</div>
        <input type="file" id="deck-input" accept=".pdf,.docx,.xlsx,.xls,.xlsm,.txt,.md,.csv" multiple style="display:none;" onchange="window.__uploadDeck('${p.id}')">
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('deck-input').click()">${n ? '+ Add more documents' : 'Upload documents'}</button>
        <span id="deck-state" style="margin-left:0.75rem;font-size:0.85rem;color:var(--text-muted);"></span>
      </div>`;
    }
    function assessRunBannerHTML(rs, p) {
      const deckIn = (p.founderDocCount || 0) > 0;
      const status = (rs && rs.status) || 'idle';
      const active = ['queued', 'running', 'partial'].includes(status);
      if (!deckIn && !active) {
        return `<div class="run-banner run-idle"><div class="run-banner-main"><div class="run-banner-title">Assessment</div><div class="run-banner-sub">Upload a document above, then run the assessment.</div></div><button class="btn btn-primary" disabled style="opacity:0.5;cursor:not-allowed;">&#9654;&nbsp; Run assessment</button></div>`;
      }
      if (active) {
        const total = rs.totalSteps || 0, step = rs.step || 0;
        const pct = total ? Math.round((step / total) * 100) : (status === 'queued' ? 6 : 14);
        const counter = total ? `<span class="text-mono dim" style="font-size:0.8rem;">&middot; ${step}/${total}</span>` : '';
        return `<div class="run-banner run-running"><div class="run-banner-main"><div class="run-banner-title"><span class="run-spinner"></span> ${status === 'queued' ? 'Queued' : 'Assessing'} ${counter}</div><div class="run-banner-sub">${escBrief(rs.label || 'Running the assessment…')}</div><div class="progress" style="margin-top:0.75rem;"><div class="progress-bar" style="width:${pct}%;transition:width .5s ease;"></div></div></div></div>`;
      }
      let note;
      if (status === 'done') note = `<div class="run-banner-sub">&#10003; Assessment complete &mdash; score &amp; findings below.</div>`;
      else if (status === 'error') note = `<div class="run-banner-sub" style="color:var(--danger,#C0392B);">Last run errored: ${escBrief((rs && rs.error) || 'unknown error')}. Safe to retry.</div>`;
      else if (status === 'limit-paused') note = `<div class="run-banner-sub" style="color:#C77700;">Paused &mdash; Claude usage limit reached.</div>`;
      else note = `<div class="run-banner-sub">Assess this venture from the uploaded documents &mdash; a score, key findings, and how to strengthen it.</div>`;
      const btnLabel = status === 'done' ? '&#8635;&nbsp; Re-run assessment' : '&#9654;&nbsp; Run assessment';
      return `<div class="run-banner run-idle"><div class="run-banner-main"><div class="run-banner-title">Assessment</div>${note}</div><button id="run-trigger-btn" class="btn btn-primary" onclick="window.__triggerRun('${p.id}','assess')">${btnLabel}</button></div>`;
    }
    function findingsSectionHTML(cards) {
      const head = `<div class="section-head"><div><div class="section-title">Key findings</div><div class="section-sub">The strategic forks, risks, and load-bearing assumptions the agents surfaced from the deck.</div></div></div>`;
      if (!cards.length) return `<div class="section">${head}<div class="card" style="text-align:center;padding:2rem;color:var(--text-muted);">No findings yet. Upload a document and run the assessment.</div></div>`;
      return `<div class="section">${head}<div class="prov-cards-list">${cards.map(c => provCardHTML(c, { draft: false, hidePill: true })).join('')}</div></div>`;
    }

    // ---- Decision-grade panels (render from engagement.assessment; empty if absent) ----
    function recColor(rec) {
      const r = String(rec || '').toLowerCase();
      if (r.startsWith('invest') || r.includes('back')) return '#00897b';
      if (r.startsWith('pass') || r.includes('decline')) return '#C0392B';
      return '#C77700'; // diligence further / conditional
    }
    function valColor(v) {
      const s = String(v || '').toLowerCase();
      if (s.startsWith('cheap') || s.includes('under')) return '#00897b';
      if (s.startsWith('rich') || s.startsWith('expensive') || s.includes('over')) return '#C0392B';
      return '#6E3AFA'; // fair
    }
    function prioColor(pr) { const s = String(pr || '').toLowerCase(); return s === 'high' ? '#C0392B' : s === 'low' ? '#6B7594' : '#C77700'; }

    function verdictHeaderHTML(p) {
      const a = p.assessment; if (!a || !a.recommendation) return '';
      const rc = recColor(a.recommendation);
      const must = a.mustBeTrue || a.must_be_true || [];
      const ask = a.theAsk || a.the_ask;
      const risk = a.biggestRisk || a.biggest_risk;
      const mustHTML = must.length ? `
        <div style="margin-top:1.1rem;border-top:1px solid rgba(0,0,0,0.07);padding-top:0.9rem;">
          <div class="text-mono" style="font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;font-weight:700;color:var(--accent,#00B8A0);margin-bottom:0.6rem;">For the thesis to hold, these must be true</div>
          <div style="display:flex;flex-direction:column;gap:0.5rem;">
            ${must.map((m, i) => `<div style="display:flex;gap:0.6rem;align-items:flex-start;"><span class="text-mono" style="color:${rc};font-weight:700;flex:none;">${i + 1}</span><div style="font-size:0.9rem;line-height:1.5;">${escBrief(m)}</div></div>`).join('')}
          </div>
        </div>` : '';
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">The call</div><div class="section-sub">The decision-grade verdict &mdash; recommendation, thesis, and the deal-breaker.</div></div></div>
        <div class="card" style="border-top:3px solid ${rc};">
          <div style="display:flex;align-items:center;gap:0.9rem;flex-wrap:wrap;margin-bottom:0.9rem;">
            <span style="background:${rc};color:#fff;font-weight:700;font-size:0.95rem;padding:0.4rem 0.95rem;border-radius:8px;">${escBrief(a.recommendation)}</span>
            ${a.conviction ? `<span class="text-mono dim" style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;">${escBrief(a.conviction)} conviction</span>` : ''}
            ${ask ? `<span class="text-mono dim" style="font-size:0.72rem;margin-left:auto;">Ask: <strong style="color:var(--text);">${escBrief(ask)}</strong></span>` : ''}
          </div>
          ${a.thesis ? `<div style="font-size:1.02rem;line-height:1.55;font-weight:500;color:var(--text);margin-bottom:0.9rem;">${escBrief(a.thesis)}</div>` : ''}
          ${risk ? `<div style="border-left:3px solid var(--danger,#C0392B);background:rgba(192,57,43,0.06);border-radius:0 8px 8px 0;padding:0.7rem 0.85rem;font-size:0.9rem;line-height:1.5;"><strong style="color:var(--danger,#C0392B);">Biggest kill-risk &mdash;</strong> ${escBrief(risk)}</div>` : ''}
          ${mustHTML}
        </div></div>`;
    }

    function bullBearHTML(p) {
      const a = p.assessment || {};
      const bull = a.bull || [], bear = a.bear || [];
      if (!bull.length && !bear.length) return '';
      const col = (title, items, color, arrow) => `
        <div style="flex:1;min-width:240px;">
          <div style="display:flex;align-items:center;gap:0.45rem;margin-bottom:0.75rem;">
            <span style="color:${color};font-weight:700;font-size:0.8rem;">${arrow}</span>
            <span class="text-mono" style="font-size:0.64rem;letter-spacing:0.07em;text-transform:uppercase;font-weight:700;color:${color};">${title}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:0.55rem;">
            ${items.length ? items.map(it => `<div style="display:flex;gap:0.5rem;align-items:flex-start;font-size:0.9rem;line-height:1.5;"><span style="color:${color};flex:none;">&bull;</span><div>${escBrief(it)}</div></div>`).join('') : '<div class="dim" style="font-size:0.85rem;">&mdash;</div>'}
          </div>
        </div>`;
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">The case, both ways</div><div class="section-sub">What it&rsquo;s like to invest &mdash; the bull case against the bear case, at a glance.</div></div></div>
        <div class="card" style="display:flex;gap:1.75rem;flex-wrap:wrap;">
          ${col('The case to invest', bull, '#00897b', '&#9650;')}
          ${col('The case to pass', bear, '#C0392B', '&#9660;')}
        </div></div>`;
    }

    function dealValuationHTML(p) {
      const v = p.assessment && p.assessment.valuation; if (!v || (!v.verdict && !v.note && !(v.comps || []).length)) return '';
      const vc = valColor(v.verdict);
      const comps = v.comps || [];
      const compHTML = comps.length ? `
        <div style="margin-top:0.9rem;display:flex;flex-direction:column;gap:0.45rem;">
          ${comps.map(c => `<div style="display:flex;justify-content:space-between;gap:0.8rem;font-size:0.86rem;border-bottom:1px solid rgba(0,0,0,0.05);padding-bottom:0.45rem;"><div><strong>${escBrief(c.name || '')}</strong>${c.stage ? ` <span class="dim">&middot; ${escBrief(c.stage)}</span>` : ''}</div><div class="text-mono dim" style="text-align:right;">${escBrief(c.detail || c.valuation || '')}</div></div>`).join('')}
        </div>` : '';
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">Deal &amp; valuation</div><div class="section-sub">Is the ask fair against comparable rounds at this stage and sector?</div></div></div>
        <div class="card">
          <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;">
            ${v.verdict ? `<span style="background:${vc};color:#fff;font-weight:700;font-size:0.82rem;padding:0.3rem 0.8rem;border-radius:7px;text-transform:uppercase;letter-spacing:0.03em;">${escBrief(v.verdict)}</span>` : ''}
            ${v.note ? `<div style="font-size:0.92rem;line-height:1.5;flex:1;min-width:240px;">${escBrief(v.note)}</div>` : ''}

          ${compHTML}

    function exitReturnsHTML(p) {
      const e = p.assessment && p.assessment.exit; if (!e || (!e.path && !(e.acquirers || []).length && !e.returns)) return '';
      const acq = e.acquirers || [];
      const acqHTML = acq.length ? `<div style="display:flex;flex-wrap:wrap;gap:0.45rem;margin:0.2rem 0 0.9rem;">${acq.map(a => `<span class="pill" style="background:rgba(110,58,250,0.08);color:var(--brand,#6E3AFA);font-size:0.78rem;">${escBrief(a)}</span>`).join('')}</div>` : '';
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">Exit &amp; returns</div><div class="section-sub">How this returns capital &mdash; realistic acquirers, the value-creation path, and the outcome.</div></div></div>
        <div class="card">
          ${acq.length ? `<div class="text-mono" style="font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;font-weight:700;color:var(--accent,#00B8A0);margin-bottom:0.4rem;">Likely acquirers</div>${acqHTML}` : ''}
          ${e.path ? `<div style="font-size:0.93rem;line-height:1.55;margin-bottom:${e.returns ? '0.8rem' : '0'};"><strong>Path:</strong> ${escBrief(e.path)}</div>` : ''}
          ${e.returns ? `<div style="font-size:0.93rem;line-height:1.55;"><strong>Returns:</strong> ${escBrief(e.returns)}</div>` : ''}
        </div></div>`;
    }

    function diligenceChecklistHTML(p) {
      const items = (p.assessment && p.assessment.diligence) || []; if (!items.length) return '';
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">Diligence checklist</div><div class="section-sub">What to verify before committing &mdash; the gaps to close first.</div></div></div>
        <div class="card"><div style="display:flex;flex-direction:column;gap:0.65rem;">
          ${items.map(it => { const pr = prioColor(it.priority); return `<div style="display:flex;gap:0.65rem;align-items:flex-start;">
            <span style="flex:none;width:14px;height:14px;border:2px solid ${pr};border-radius:4px;margin-top:0.15rem;"></span>
            <div style="font-size:0.9rem;line-height:1.5;flex:1;">${escBrief(it.item || it)}</div>
            ${it.priority ? `<span class="text-mono" style="flex:none;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.05em;color:${pr};font-weight:700;">${escBrief(it.priority)}</span>` : ''}
          </div>`; }).join('')}
        </div></div></div>`;
    }

    function assessMainHTML() {
      return `
        <div style="margin-bottom:1rem;"><a href="dashboard.html" class="text-small dim" style="font-size:0.85rem;">&larr; All engagements</a></div>
        <div class="program-detail-head">
          <div class="program-detail-identity">
            <div class="avatar avatar-lg" style="background:${p.founderAvatarColor || '#0036FF'};width:56px;height:56px;font-size:1.05rem;">${escBrief((p.name || 'V').slice(0, 2).toUpperCase())}</div>
            <div>
              <h1 class="program-detail-title">${escBrief(p.name)}</h1>
              <p class="program-detail-pitch">${escBrief(p.venturePitch || 'Investor assessment — upload a deck to begin.')}</p>
              <div class="program-detail-meta">
                <span class="pill" style="background:rgba(110,58,250,0.1);color:var(--brand,#6E3AFA);"><span class="dot"></span> Assessment</span>
                ${invSnapshot ? `<span class="pill"><span class="dot"></span> ${invSnapshot.pct}% investability</span>` : ''}
              </div>
            </div>
          </div>
        </div>
        ${deckUploadHTML(p)}

        <div id="verdict-region">${verdictHeaderHTML(p)}</div>

        <div id="exit-region">${exitReturnsHTML(p)}</div>
        <div id="cards-region">${findingsSectionHTML(provCards)}</div>
        <div id="diligence-region">${diligenceChecklistHTML(p)}</div>
        ${renderDataRoom(hubDocs)}

    }

    const main = isAssess ? assessMainHTML() : `
      <div style="margin-bottom:1rem;">
        <a href="dashboard.html" class="text-small dim" style="font-size:0.85rem;">&larr; All engagements</a>
      </div>

      <div class="program-detail-head">
        <div class="program-detail-identity">
          <div class="avatar avatar-lg" style="background:${p.founderAvatarColor};width:56px;height:56px;font-size:1.05rem;">${p.founderAvatar}</div>

              ${p.mvpDemoModeReady ? '<span class="pill pill-success"><span class="dot"></span> Demo build ready</span>' : ''}
            </div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.5rem;align-items:flex-end;">

          <button class="btn btn-outline btn-sm">Reassign operator</button>

    // ---- Live run + cards subscriptions (realtime, live mode only) -------
    // The run banner reflects runState as the headless runner drives it; the
    // cards region repaints the moment the runner publishes drafts or the
    // founder responds — no manual refresh.
    if (W.mode === 'live') {
      try {
        const data = await import('../firebase/data.js');
        data.watchEngagement(p.id, (eng) => {
          if (!eng) return;
          const region = document.getElementById('run-region');
          if (region) region.innerHTML = isAssess ? assessRunBannerHTML(eng.runState, { ...p, ...eng }) : runBannerHTML(eng.runState, { ...p, ...eng });
          // Decision panels appear the moment a run publishes engagement.assessment — no reload.
          if (isAssess && eng.assessment) {
            p.assessment = eng.assessment;
            const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
            set('verdict-region', verdictHeaderHTML(p));
            set('bullbear-region', bullBearHTML(p));
            set('dealval-region', dealValuationHTML(p));
            set('exit-region', exitReturnsHTML(p));
            set('diligence-region', diligenceChecklistHTML(p));
          }
        });
        data.watchCardsForEngagement(p.id, (cards) => {
          const region = document.getElementById('cards-region');
          if (region) region.innerHTML = isAssess ? findingsSectionHTML(cards) : cardsRegionHTML(cards, p);
        });
      } catch (e) { console.warn('live run/cards subscriptions failed', e); }
    }
  </script>
</body>
</html>
