<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Research-run banner + draft-card accents (page-local) */
    .run-banner { display:flex; align-items:center; justify-content:space-between; gap:1.25rem; background:var(--surface-2,#fff); border-radius:16px; padding:1.4rem 1.6rem; box-shadow:6px 6px 14px rgba(0,0,0,0.06),-6px -6px 14px rgba(255,255,255,0.7); margin-bottom:1.5rem; }
    .run-banner-main { flex:1; min-width:0; }
    .run-banner-title { font-weight:600; font-size:1rem; color:var(--text,#141414); display:flex; align-items:center; gap:0.5rem; }
    .run-banner-sub { font-size:0.85rem; color:var(--text-muted,#656565); margin-top:0.3rem; line-height:1.5; }
    .run-banner.run-running { background:linear-gradient(180deg, rgba(110,58,250,0.06), rgba(110,58,250,0.01)); }
    .run-spinner { width:14px; height:14px; border:2px solid rgba(110,58,250,0.25); border-top-color:var(--brand,#6E3AFA); border-radius:50%; display:inline-block; animation:run-spin 0.7s linear infinite; flex:none; }
    @keyframes run-spin { to { transform:rotate(360deg); } }
    .prov-card-draft { border-left:3px solid var(--brand,#6E3AFA); }
    .upload-rows { display:flex; flex-direction:column; gap:0.75rem; }
    .upload-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0.95rem 1.1rem; border-radius:12px; background:var(--surface,#F0F4F8); box-shadow:inset 2px 2px 5px rgba(0,0,0,0.05), inset -2px -2px 5px rgba(255,255,255,0.7); }
    .upload-row.is-required { box-shadow:inset 0 0 0 1.5px rgba(196,34,51,0.35); background:rgba(196,34,51,0.03); }
    .upload-row.is-set { box-shadow:inset 0 0 0 1.5px rgba(0,184,160,0.3); background:rgba(0,184,160,0.04); }
    .upload-row-main { min-width:0; }
    .upload-row-label { font-weight:600; font-size:0.92rem; color:var(--text,#141414); display:flex; align-items:center; gap:0.5rem; }
    .upload-row-state { font-size:0.82rem; color:var(--text-muted,#656565); margin-top:0.2rem; line-height:1.45; }
    .upload-req { font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase; font-weight:700; color:#C42233; background:rgba(196,34,51,0.1); padding:0.12rem 0.45rem; border-radius:5px; }
    .upload-row .btn { flex:none; white-space:nowrap; }
    @media (max-width:640px){ .run-banner{ flex-direction:column; align-items:stretch; } .upload-row{ flex-direction:column; align-items:stretch; } .upload-row .btn{ width:100%; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="agents.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    import { renderCardBody, ensureCardStyles } from '../shared/card-format.js';
    import { renderDataRoom, hydrateDataRoom, ensureHubStyles } from '../shared/hub-view.js';
    import { renderVSSScorecard, renderStrengthenSuggestions, ensureInvestabilityStyles, bandColor } from '../shared/investability-view.js';
    import { MAX_POSSIBLE } from '../shared/vss-rubric.js';
    import { renderWelcomePack, ensureWelcomePackStyles } from '../shared/welcome-pack-view.js';
    import { esc as escBrief } from '../shared/util.js';
    await window.WORKSPACE_READY;
    ensureCardStyles();
    ensureHubStyles();
    ensureInvestabilityStyles();
    ensureWelcomePackStyles();
    const W = window.WORKSPACE;
    const A = window.WORKSPACE_AGENTS;
    const { helpers, labels, programs: allPrograms } = W;

    // Read ?id= from URL, default to first program if any exist
    const params = new URLSearchParams(window.location.search);
    const fallback = allPrograms[0] || null;
    const id = params.get('id') || (fallback && fallback.id);
    const p = allPrograms.find(x => x.id === id) || fallback;
    const operator = p ? helpers.getOperator(p.assignedOperator) : null;
    const isAssess = !!(p && p.engagementType === 'assessment');

    // Guard: no engagements yet → render a minimal "not found" view
    if (!p) {
      window.renderShell(`
        <div style="text-align:center;padding:5rem 2rem;color:var(--text-muted, #656565);">
          <h1 style="font-size:1.4rem;margin-bottom:0.5rem;color:var(--text, #141414);">No engagement loaded</h1>
          <p style="margin-bottom:1.5rem;">There&rsquo;s no engagement at this URL yet. Start a new one to populate this view.</p>
          <a href="new-engagement.html" class="btn btn-primary">New engagement</a>
        </div>
      `);
      throw new Error('halt-render'); // stop the rest of this script
    }

    // ---- Agent-derived signals -----------------------------------------
    // engagement-health-monitor verdict + reasoning, and tier-compliance-
    // auditor completeness. Health follows the dashboard's demo/live split
    // (demo keeps the curated narrative; live computes from state).
    // Completeness is deterministic from hub state, so it's always computed.
    const useLive = (W.demoMode || 'off') === 'off';
    const health = (useLive && A) ? A.computeEngagementHealth(p) : null;
    const healthLevel = health ? health.level : p.health;
    const completeness = A ? A.computeCompleteness(p) : { pct: 0, completedItems: 0, expectedItems: 0 };

    // Provocation cards for this engagement (live mode reads from Firestore).
    let provCards = [];
    if (W.mode === 'live') {
      try { const data = await import('../firebase/data.js'); provCards = await data.listCardsForEngagement(p.id); }
      catch (e) { console.warn('cards load failed', e); }
    } else if (p.provCards) {
      provCards = p.provCards;   // demo/sample fixture
    }
    // Latest investability snapshot (VSS v2) for the operator summary.
    let invSnapshot = null;
    if (W.mode === 'live') {
      try { const data = await import('../firebase/data.js'); const snaps = await data.listInvestabilitySnapshots(p.id); invSnapshot = snaps.length ? snaps[snaps.length - 1] : null; }
      catch (e) { console.warn('investability load failed', e); }
    } else if (p.investabilitySnapshot) {
      invSnapshot = p.investabilitySnapshot;   // demo/sample fixture
    }
    // Data-room L3 hub content (deep research / strategy / financials).
    let hubDocs = [];
    if (W.mode === 'live') {
      try { const data = await import('../firebase/data.js'); hubDocs = await data.listHubDocs(p.id); }
      catch (e) { console.warn('hub docs load failed', e); }
    } else if (p.hubDocs) {
      hubDocs = p.hubDocs;   // demo/sample fixture
    }
    // Operator clicks "Run research agents" → queue a headless run. The banner
    // updates live (via the watchEngagement subscription below) as the runner
    // picks it up, progresses, and publishes draft cards.
    window.__triggerRun = async function(engagementId, phase) {
      phase = phase || 'research';
      const btn = document.getElementById('run-trigger-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Queuing…'; }
      try {
        const data = await import('../firebase/data.js');
        const me = (W.helpers.currentOperator && W.helpers.currentOperator()) || null;
        // Prefer the cloud dispatcher (GitHub Actions — no machine needed). Falls
        // back to local-daemon queue if dispatch isn't configured.
        try {
          const { auth } = await import('../firebase/firebase.js');
          const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
          if (idToken) {
            const resp = await fetch('/api/dispatch-run', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ idToken, engagementId, phase })
            });
            if (resp.ok) return;                 // cloud Action fired
            // A real rejection (e.g. no pitch deck attached) — surface it, don't
            // silently fall through to the local-daemon queue.
            if (resp.status >= 400 && resp.status < 500 && resp.status !== 503) {
              const d = await resp.json().catch(() => ({}));
              throw new Error(d.detail || d.error || ('Run rejected (' + resp.status + ')'));
            }
          }
        } catch (e) {
          if (e && /pitch|Run rejected|forbidden/i.test(String(e.message || ''))) throw e;
          /* otherwise fall through to local-daemon queue */
        }
        await data.requestRun(engagementId, phase, (me && me.email) || null);
      } catch (e) {
        alert('Could not start the run: ' + ((e && (e.code || e.message)) || e));
        if (btn) { btn.disabled = false; btn.textContent = 'Run'; }
      }
    };
    window.__runResearch = (id) => window.__triggerRun(id, 'research');

    // Republish — re-apply a run's SAVED output to the page (no AI re-run, no cost).
    // Every run autosaves its full output (score, verdict, research, cards); this
    // dispatches a ~2-min cloud step that recovers the latest bundle and re-applies
    // it. The live banner takes over once it's queued. Cloud-only (the saved bundle
    // lives in the cloud), so no local-daemon fallback here.
    window.__republish = async function(engagementId) {
      const btns = document.querySelectorAll('[data-republish]');
      btns.forEach(b => { b.disabled = true; b.textContent = 'Re-applying…'; });
      try {
        const { auth } = await import('../firebase/firebase.js');
        const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
        if (!idToken) throw new Error('Please sign in again.');
        const resp = await fetch('/api/dispatch-run', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken, engagementId, phase: 'republish' })
        });
        if (!resp.ok) { const d = await resp.json().catch(() => ({})); throw new Error(d.detail || d.error || ('Republish rejected (' + resp.status + ')')); }
        // success → the live runState banner now shows "Recovering your saved results…"
      } catch (e) {
        alert('Could not republish: ' + ((e && (e.code || e.message)) || e));
        btns.forEach(b => { b.disabled = false; b.innerHTML = '&#8635;&nbsp; Republish results'; });
      }
    };

    // Deck/document upload on the Workspace (assessment mode). Reuses /api/ingest-docs.
    function __readFileB64(file) {
      return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error('read failed')); r.readAsDataURL(file); });
    }
    // Large PDFs (e.g. an image-heavy pitch deck over 4MB) can't go whole through
    // the serverless body limit — so we extract their text in the browser with
    // pdf.js and send only the text. Small files still go as bytes (server extracts).
    let __pdfjs = null;
    async function __extractPdfText(arrayBuffer) {
      if (!__pdfjs) {
        __pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs');
        __pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';
      }
      const pdf = await __pdfjs.getDocument({ data: arrayBuffer }).promise;
      let out = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const tc = await (await pdf.getPage(i)).getTextContent();
        out += tc.items.map(it => it.str).join(' ') + '\n\n';
      }
      return out.trim();
    }
    // Large .docx can overflow the serverless body limit too (base64 inflates ~33%), which
    // truncates the upload and makes server-side extraction return empty. Extract their text
    // in the browser with mammoth and send only the text — no size limit.
    let __mammoth = null;
    async function __extractDocxText(arrayBuffer) {
      if (!__mammoth) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';
          s.onload = res; s.onerror = () => rej(new Error('mammoth failed to load'));
          document.head.appendChild(s);
        });
        __mammoth = window.mammoth;
      }
      const r = await __mammoth.extractRawText({ arrayBuffer });
      return ((r && r.value) || '').trim();
    }

    // Shared ingest core. docType: 'pitch' | 'dataroom'. Walks .zip data rooms and
    // handles oversized PDFs via client-side text extraction.
    async function __ingestFiles(engagementId, inputId, docType) {
      const input = document.getElementById(inputId);
      const files = Array.from((input && input.files) || []);
      if (input) input.value = '';
      if (!files.length) return;
      const stateEl = document.getElementById('deck-state');
      const { auth } = await import('../firebase/firebase.js');
      const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
      const SUPPORTED = /\.(pdf|docx?|xlsx?|xlsm|txt|md|csv)$/i;
      let ingested = 0; const skippedFiles = [];   // {name, reason} — never silently dropped

      async function ingestOne(name, blob) {
        let payload;
        if (blob.size > 4 * 1024 * 1024) {
          // Large file → upload straight to Storage (bypasses the serverless body limit);
          // the server downloads it to extract text. Works for ANY type & size.
          if (stateEl) stateEl.innerHTML = `<span class="run-spinner"></span> Uploading ${escBrief(name)}…`;
          const ext = (name.split('.').pop() || 'bin').toLowerCase();
          const storagePath = `founder-docs/${engagementId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
          const [{ storage }, { ref, uploadBytes }] = await Promise.all([
            import('../firebase/firebase.js'),
            import('https://www.gstatic.com/firebasejs/11.1.0/firebase-storage.js'),
          ]);
          await uploadBytes(ref(storage, storagePath), blob, { contentType: blob.type || undefined });
          payload = { idToken, engagementId, docType, file: { name }, storagePath };
        } else {
          if (stateEl) stateEl.innerHTML = `<span class="run-spinner"></span> Reading ${escBrief(name)}…`;
          payload = { idToken, engagementId, docType, file: { name, dataBase64: await __readFileB64(blob) } };
        }
        const resp = await fetch('/api/ingest-docs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const d = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(d.detail || d.error || ('HTTP ' + resp.status));
        ingested++;
      }

      for (const file of files) {
        try {
          if (/\.zip$/i.test(file.name)) {
            if (stateEl) stateEl.innerHTML = `<span class="run-spinner"></span> Opening ${escBrief(file.name)}…`;
            const JSZip = (await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm')).default;
            const zip = await JSZip.loadAsync(file);
            const entries = Object.values(zip.files).filter(e => !e.dir && SUPPORTED.test(e.name) && !/(^|\/)(__MACOSX\/|\.)/.test(e.name));
            if (!entries.length) { if (stateEl) stateEl.innerHTML = `<span style="color:var(--danger,#C0392B);">No readable documents found inside ${escBrief(file.name)}.</span>`; continue; }
            for (const entry of entries) { try { await ingestOne(entry.name, await entry.async('blob')); } catch (e) { skippedFiles.push({ name: entry.name, reason: (e && e.message) || String(e) }); } }
          } else {
            await ingestOne(file.name, file);
          }
        } catch (e) {
          skippedFiles.push({ name: file.name, reason: (e && e.message) || String(e) });
        }
      }
      // Reconciliation: report ingested AND every skip BY NAME — a dropped doc is never silent.
      if (stateEl) {
        const okMsg = ingested ? `<span style="color:var(--accent,#00B8A0);">${docType === 'pitch' ? 'Pitch deck added' : 'Ingested ' + ingested + ' document' + (ingested === 1 ? '' : 's')}.</span>` : '';
        const skipMsg = skippedFiles.length ? `<div style="color:var(--danger,#C0392B);margin-top:.4rem;"><strong>Couldn&rsquo;t ingest ${skippedFiles.length}:</strong> ${skippedFiles.map(s => escBrief(s.name) + ' &mdash; ' + escBrief(s.reason)).join('; ')}</div>` : '';
        stateEl.innerHTML = okMsg + skipMsg || '<span style="color:var(--danger,#C0392B);">No documents ingested.</span>';
      }
      // Only auto-reload on a clean run — otherwise the skip warning must stay on screen.
      if (!skippedFiles.length) setTimeout(() => window.location.reload(), ingested ? 900 : 1600);
    }
    window.__uploadPitch = (id) => __ingestFiles(id, 'pitch-input', 'pitch');
    window.__uploadDataRoom = (id) => __ingestFiles(id, 'dataroom-input', 'dataroom');
    // Best-effort email nudge to the other side — never blocks the action.
    async function notifyRecipient(direction) {
      try {
        const { auth } = await import('../firebase/firebase.js');
        const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : null;
        if (!idToken) return;
        await fetch('/api/notify', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken, engagementId: p.id, direction })
        });
      } catch (e) { /* notification is best-effort */ }
    }
    window.__sendCard = async function(cardId) {
      const data = await import('../firebase/data.js');
      try { await data.sendCardToFounder(cardId); notifyRecipient('founder'); } // cards re-render live
      catch (e) { alert('Could not send the card: ' + ((e && (e.code || e.message)) || e)); }
    };
    window.__sendAllDrafts = async function(engagementId) {
      const data = await import('../firebase/data.js');
      try {
        const n = await data.sendDraftsToFounder(engagementId);
        if (n) notifyRecipient('founder'); else alert('No draft cards to send.');
      } catch (e) { alert('Could not send the cards: ' + ((e && (e.code || e.message)) || e)); }
    };
    // Welcome pack — generate (cloud 'welcome' run) then operator reviews + sends.
    window.__generateWelcomePack = (id) => window.__triggerRun(id, 'welcome');
    window.__sendWelcomePack = async function(id) {
      const data = await import('../firebase/data.js');
      try { await data.sendWelcomePack(id); notifyRecipient('founder'); }
      catch (e) { alert('Could not send the welcome pack: ' + ((e && (e.code || e.message)) || e)); }
    };
    window.__deleteEngagement = async function() {
      if (!window.confirm(`Delete "${p.name}" permanently?\n\nThis removes it from the Workspace AND ${p.founderName || 'the founder'}'s Studio, including all its provocation cards. This cannot be undone.`)) return;
      try {
        const data = await import('../firebase/data.js');
        await data.deleteEngagementDeep(p.id);
        window.location.href = 'dashboard.html';
      } catch (e) {
        alert('Could not delete the engagement: ' + ((e && (e.code || e.message)) || e));
      }
    };

    const reasonIcon = { critical: '⚠', warn: '!', opportunity: '↗', positive: '✓' };
    const healthReasonsHTML = (health && health.reasons && health.reasons.length) ? `
      <div class="program-detail-reasons">
        ${health.reasons.slice(0, 3).map(r => `
          <div class="program-card-reason ${health.level}">
            <span class="program-card-reason-icon">${reasonIcon[r.severity] || '•'}</span>
            <span>${r.text}</span>
          </div>
        `).join('')}
      </div>
    ` : '';

    function hubCardHTML(key, data) {
      const status = data.status || 'pending';
      if (status === 'disabled') {
        // Hub was unticked at wizard time → render a muted placeholder
        return `
          <div class="hub-card disabled">
            <div class="hub-card-head">
              <div class="hub-card-name" style="color:var(--text-muted,#656565);text-decoration:line-through;">${labels.hub[key]}</div>
              <span class="hub-card-status" style="opacity:0.4;">Not in scope</span>
            </div>
            <div class="hub-card-detail" style="color:var(--text-muted,#888);">Excluded from this engagement at launch.</div>
          </div>
        `;
      }
      const meta = (data.cards ? `${data.cards} cards` : 'Awaiting activation');
      const action = ({
        'signed': 'View hub &rarr;',
        'ready-to-sign': 'Review &amp; close gate &rarr;',
        'awaiting-founder': 'Open in the Studio &rarr;',
        'in-progress': 'Open hub &rarr;',
        'pending': 'Locked until phase opens'
      })[status] || '';
      return `
        <div class="hub-card ${status}">
          <div class="hub-card-head">
            <div class="hub-card-name">${labels.hub[key]}</div>
            <span class="hub-card-status ${status}">${helpers.hubStatusLabel(status)}</span>
          </div>
          <div class="hub-card-detail">${meta}</div>
          <div style="margin-top:auto;padding-top:0.5rem;">
            <span class="text-mono dim" style="font-size:0.78rem;">${action}</span>
          </div>
        </div>
      `;
    }

    const hubOrder = ['research','vision','strategy','financials','marketing','video','blog'];
    const hubsHTML = hubOrder.map(k => hubCardHTML(k, (p.hubs || {})[k] || { status: 'disabled' })).join('');

    // ---------------- Timeline ------------------------------------------
    // Pulls events from `p.activity[]` if present. Otherwise synthesises
    // a sensible timeline from phase + lastActivity so newly-launched
    // engagements aren't padded with fake history.
    function timelineEventsFor(p) {
      // If the engagement carries real activity events, use them as-is.
      if (Array.isArray(p.activity) && p.activity.length) {
        return p.activity.map(e => ({ when: e.when, detail: e.detail, pending: !!e.pending }));
      }
      // Phase 0 — just created → show launch + what's coming
      if (p.phase === 0) {
        return [
          { when: p.lastActivity || 'just now', detail: p.lastActivityDetail || 'Engagement launched via Workspace wizard' },
          { when: 'Pending', detail: `Studio invite sends to <span class="agent">${p.founderName}</span>`, pending: true },
          { when: 'Pending', detail: 'Welcome Pack PDF generated by <span class="agent">handoff:assemble</span>', pending: true },
          { when: 'Pending', detail: 'First daily briefing scheduled', pending: true },
          { when: 'Pending', detail: '<span class="agent">research-curator</span> drafts the first 5–7 Research Hub Provocation Cards', pending: true }
        ];
      }
      // Phases 1+ but no recorded activity → at least show lastActivity if it exists
      if (p.lastActivity) {
        return [{ when: p.lastActivity, detail: p.lastActivityDetail || 'Activity recorded' }];
      }
      return [];
    }
    const events = timelineEventsFor(p);
    const timelineHTML = events.length
      ? `<div class="timeline">${events.map(e => `
            <div class="timeline-item ${e.pending ? 'faded' : ''}">
              <div class="timeline-time">${e.when}</div>
              <div class="timeline-detail">${e.detail}</div>
            </div>
          `).join('')}</div>`
      : `<div style="text-align:center;padding:1.5rem;color:var(--text-muted,#656565);font-size:0.88rem;">No activity recorded yet.</div>`;

    // ---------------- Founder brief (operator read view) ---------------
    // Renders engagement.brief — what the founder submitted in the Studio —
    // so the operator can actually read it, not just see "submitted".
    // escBrief is imported from ../shared/util.js (esc) — one definition for all surfaces.
    function briefFieldHTML(label, key, b) {
      const value = b[key];
      if (key === 'features') {
        const items = (Array.isArray(value) ? value : []).filter(Boolean);
        if (!items.length) return '';
        return `<div class="brief-field"><div class="brief-field-label">${label}</div><ol class="brief-features">${items.map(f => `<li>${escBrief(f)}</li>`).join('')}</ol></div>`;
      }
      let display;
      if (Array.isArray(value)) display = value.filter(Boolean).map(escBrief).join(' · ');
      else display = (value == null) ? '' : escBrief(value);
      if (!display) return '';
      return `<div class="brief-field"><div class="brief-field-label">${label}</div><div class="brief-field-value">${display}</div></div>`;
    }
    const BRIEF_GROUPS = [
      { title: 'Overview', fields: [['One-liner','oneLine'],['Industry','industry'],['Problem','problem'],['Target user','targetUser'],['1-year vision','oneYearVision']] },
      { title: 'Goals', fields: [['Primary goal','primaryGoal'],['Motivations','motivations'],['Success looks like','successLooksLike']] },
      { title: 'Features', fields: [['Key features','features']] },
      { title: 'Inspiration & platform', fields: [['Comparables','comparables'],['Design style','designStyle'],['Preferred tools','preferredTools']] },
      { title: 'Team & notes', fields: [['Other stakeholders','otherStakeholders'],['Technical capability','technicalCapability'],['Notes','notes']] }
    ];
    function briefSectionHTML(p) {
      const b = p.brief;
      const submitted = (b && p.briefSubmittedAt) ? `<span class="text-mono dim" style="font-size:0.72rem;">Submitted ${escBrief(p.briefSubmittedAt)}</span>` : '';
      const head = `<div class="section-head"><div><div class="section-title">Founder brief</div><div class="section-sub">What the founder submitted in the Studio &mdash; the source for every downstream agent.</div></div>${submitted}</div>`;
      if (!b) {
        const msg = (p.briefSubmitted === false)
          ? `<strong style="color:var(--text);font-weight:600;">Awaiting brief from ${escBrief(p.founderName || 'the founder')}.</strong> Studio invite sent to ${escBrief(p.founderEmail || 'the founder')}. The brief appears here the moment it&rsquo;s submitted.`
          : `Brief on file. Full content isn&rsquo;t available in this view.`;
        return `<div class="section">${head}<div class="card" style="text-align:center;padding:2rem;color:var(--text-muted);">${msg}</div></div>`;
      }
      const groups = BRIEF_GROUPS.map(g => {
        const fields = g.fields.map(([label, key]) => briefFieldHTML(label, key, b)).join('');
        return fields ? `<div class="brief-group"><div class="brief-group-title">${g.title}</div>${fields}</div>` : '';
      }).join('');
      const pdf = b.pdfFilename ? `<div class="brief-group"><div class="brief-group-title">Uploaded document</div><div class="brief-field"><div class="brief-field-value">&#128196; ${escBrief(b.pdfFilename)}</div></div></div>` : '';
      const body = (groups || pdf) ? `<div class="card brief-view">${groups}${pdf}</div>` : `<div class="card" style="padding:1.5rem;color:var(--text-muted);">Brief submitted, but all fields were left blank.</div>`;
      return `<div class="section">${head}${body}</div>`;
    }

    // ---------------- Run banner (live agent-run status) ----------------
    // The single control for the research run. Locked until the brief is in;
    // then trigger → queued → running (live step/totalSteps) → done/error.
    // Client-side run timing + stall detection. runState carries requestedAt (and
    // startedAt once the runner picks it up) as ISO strings. We surface elapsed time
    // so a multi-minute run never looks like a hang, and flag a likely stall (queued
    // and never picked up, or running far past the window) with an escape hatch — the
    // out-of-repo runner writes no client-visible error if it crashes mid-run, so
    // without this the operator can hit a permanent spinner they can't re-run.
    function runAge(rs) {
      const t = rs && (rs.startedAt || rs.requestedAt);
      if (!t) return null;
      const ms = Date.now() - new Date(t).getTime();
      return ms >= 0 ? ms : null;
    }
    function fmtElapsed(ms) {
      if (ms == null) return '';
      const m = Math.floor(ms / 60000);
      if (m < 1) return 'just started';
      if (m < 60) return m + 'm elapsed';
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm elapsed';
    }
    function runStalled(rs) {
      const ms = runAge(rs); if (ms == null) return false;
      const s = (rs && rs.status) || '';
      if (s === 'queued') return ms > 3 * 60000;                 // never picked up by the runner
      if (s === 'running' || s === 'partial') return ms > 20 * 60000; // hung far past the window
      return false;
    }

    function runBannerHTML(rs, p) {
      const briefIn = p.briefSubmitted !== false && !!p.brief;
      const status = (rs && rs.status) || 'idle';
      const active = ['queued', 'running', 'partial'].includes(status);

      if (!briefIn && !active) {
        return `<div class="run-banner run-idle">
          <div class="run-banner-main">
            <div class="run-banner-title">Research agents</div>
            <div class="run-banner-sub">Unlocks the moment ${escBrief(p.founderName || 'the founder')} submits the brief. Then one click runs the deep research and drafts the provocation cards &mdash; no VS Code needed.</div>
          </div>
          <button class="btn btn-primary" disabled style="opacity:0.5;cursor:not-allowed;">&#9654;&nbsp; Run research agents</button>
        </div>`;
      }

      if (active) {
        const total = rs.totalSteps || 0;
        const step = rs.step || 0;
        const pct = total ? Math.round((step / total) * 100) : (status === 'queued' ? 6 : 14);
        const label = rs.label || (status === 'queued' ? 'Queued &mdash; waiting for the engagement runner&hellip;' : 'Running research agents&hellip;');
        const elapsed = fmtElapsed(runAge(rs));
        const counter = `<span class="text-mono dim" style="font-size:0.8rem;">${total ? `&middot; ${step}/${total} sections` : ''}${elapsed ? ` &middot; ${elapsed}` : ''}</span>`;
        const stalled = runStalled(rs);
        const stallNote = stalled ? `<div class="run-banner-sub" style="color:#C77700;margin-top:0.55rem;">&#9888;&nbsp; This is taking longer than usual${status === 'queued' ? ' to start' : ''}. The run may have stalled &mdash; you can re-run it.</div>` : '';
        const stallBtn = stalled ? `<div style="margin-top:0.6rem;"><button class="btn btn-outline btn-sm" onclick="window.__runResearch('${p.id}')">&#8635;&nbsp; Re-run research</button></div>` : '';
        return `<div class="run-banner run-running">
          <div class="run-banner-main">
            <div class="run-banner-title"><span class="run-spinner"></span> ${status === 'queued' ? 'Queued' : 'Research running'} ${counter}</div>
            <div class="run-banner-sub">${escBrief(label)}</div>
            <div class="progress" style="margin-top:0.75rem;"><div class="progress-bar" style="width:${pct}%;transition:width .5s ease;"></div></div>
            ${stallNote}${stallBtn}
          </div>
        </div>`;
      }

      // Terminal states — result + run-again.
      const meta = (rs && rs.finishedAt) ? `<span class="text-mono dim" style="font-size:0.72rem;">Last run ${escBrief(rs.finishedAt)}</span>` : '';
      let note;
      const recoverable = (status === 'error');
      if (status === 'done') note = `<div class="run-banner-sub">&#10003; Research complete &mdash; review the draft cards below, then send them to the founder.</div>`;
      else if (status === 'error') note = `<div class="run-banner-sub" style="color:var(--danger,#C0392B);">Last run reported an error${(rs && rs.error) ? ': ' + escBrief(rs.error) : ''}. If it produced cards &amp; research they're <strong>saved</strong> &mdash; try <strong>Republish</strong> first; if nothing's recoverable it'll tell you, then re-run.</div>`;
      else if (status === 'limit-paused') note = `<div class="run-banner-sub" style="color:#C77700;">Paused &mdash; Claude usage limit reached. Resume when your window resets; it picks up where it left off.</div>`;
      else note = `<div class="run-banner-sub">Run the deep research and draft the provocation cards from the brief. Runs on your Claude subscription &mdash; no VS Code.</div>`;
      const btnLabel = status === 'limit-paused' ? '&#9654;&nbsp; Resume run' : (status === 'done' ? '&#8635;&nbsp; Re-run research' : '&#9654;&nbsp; Run research agents');
      const republishBtn = recoverable ? `<button data-republish class="btn btn-outline btn-sm" onclick="window.__republish('${p.id}')">&#8635;&nbsp; Republish saved results</button>` : '';
      return `<div class="run-banner run-idle">
        <div class="run-banner-main">
          <div class="run-banner-title">Research agents</div>
          ${note}
        </div>
        <div style="display:flex;flex-direction:column;gap:0.4rem;align-items:flex-end;">
          ${republishBtn}
          <button id="run-trigger-btn" class="btn btn-primary" onclick="window.__runResearch('${p.id}')">${btnLabel}</button>
          ${meta}
        </div>
      </div>`;
    }

    // ---------------- Provocation cards (operator playback) -------------
    function provCardHTML(c, opts) {

      const r = c.founderResponse;

    function draftCardsSectionHTML(drafts, p) {

    function assessRunBannerHTML(rs, p) {
      const hasPitch = !!p.pitchDoc;
      const status = (rs && rs.status) || 'idle';
      const active = ['queued', 'running', 'partial'].includes(status);
      if (!hasPitch && !active) {
        return `<div class="run-banner run-idle"><div class="run-banner-main"><div class="run-banner-title">Assessment</div><div class="run-banner-sub">Upload the <strong>pitch deck</strong> above to run the assessment &mdash; it&rsquo;s required.</div></div><button class="btn btn-primary" disabled style="opacity:0.5;cursor:not-allowed;">&#9654;&nbsp; Run assessment</button></div>`;
      }
      if (active) {
        const total = rs.totalSteps || 0, step = rs.step || 0;
        const pct = total ? Math.round((step / total) * 100) : (status === 'queued' ? 6 : 14);
        const elapsed = fmtElapsed(runAge(rs));
        const counter = `<span class="text-mono dim" style="font-size:0.8rem;">${total ? `&middot; ${step}/${total}` : ''}${elapsed ? ` &middot; ${elapsed}` : ''}</span>`;
        const stalled = runStalled(rs);
        const stallNote = stalled ? `<div class="run-banner-sub" style="color:#C77700;margin-top:0.55rem;">&#9888;&nbsp; This is taking longer than usual${status === 'queued' ? ' to start' : ''}. The run may have stalled &mdash; you can re-run it.</div>` : '';
        const stallBtn = stalled ? `<div style="margin-top:0.6rem;"><button class="btn btn-outline btn-sm" onclick="window.__triggerRun('${p.id}','assess')">&#8635;&nbsp; Re-run assessment</button></div>` : '';
        return `<div class="run-banner run-running"><div class="run-banner-main"><div class="run-banner-title"><span class="run-spinner"></span> ${status === 'queued' ? 'Queued' : 'Assessing'} ${counter}</div><div class="run-banner-sub">${escBrief(rs.label || 'Running the assessment…')}</div><div class="progress" style="margin-top:0.75rem;"><div class="progress-bar" style="width:${pct}%;transition:width .5s ease;"></div></div>${stallNote}${stallBtn}</div></div>`;
      }
      let note;
      // recoverable = the run finished its work but the display didn't land. The
      // assessment is SAVED; it just needs re-applying — say so honestly, and lead
      // with Republish (re-apply, no AI re-run) over a full Re-run.
      const recoverable = (status === 'needs-attention' || status === 'error');
      if (status === 'done') note = `<div class="run-banner-sub">&#10003; Assessment complete &mdash; score &amp; findings below.</div>`;
      else if (status === 'needs-attention') note = `<div class="run-banner-sub" style="color:#C77700;">&#9888;&nbsp; The assessment finished and all its research, analysis &amp; score are <strong>saved safely</strong> &mdash; they just need applying to this page. Click <strong>Republish results</strong> (no re-run needed).</div>`;
      else if (status === 'error') note = `<div class="run-banner-sub" style="color:var(--danger,#C0392B);">Last run reported an error${(rs && rs.error) ? ': ' + escBrief(rs.error) : ''}. If it produced results they're <strong>saved</strong> &mdash; try <strong>Republish results</strong> first; if nothing's recoverable it'll tell you, then re-run.</div>`;
      else if (status === 'limit-paused') note = `<div class="run-banner-sub" style="color:#C77700;">Paused &mdash; Claude usage limit reached.</div>`;
      else note = `<div class="run-banner-sub">&#10003; Pitch deck ready. Assess this venture from the uploaded documents &mdash; a score, key findings, and how to strengthen it.</div>`;
      const rerunLabel = (status === 'done' || recoverable) ? '&#8635;&nbsp; Re-run assessment' : '&#9654;&nbsp; Run assessment';
      const rerunBtn = `<button id="run-trigger-btn" class="btn ${recoverable ? 'btn-outline btn-sm' : 'btn-primary'}" onclick="window.__triggerRun('${p.id}','assess')">${rerunLabel}</button>`;
      const republishBtn = recoverable ? `<button data-republish class="btn btn-primary btn-sm" onclick="window.__republish('${p.id}')">&#8635;&nbsp; Republish results</button>` : '';
      return `<div class="run-banner run-idle"><div class="run-banner-main"><div class="run-banner-title">Assessment</div>${note}</div><div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">${republishBtn}${rerunBtn}</div></div>`;
    }

    // ---- Decision-grade panels (render from engagement.assessment; empty if absent) ----
    function recColor(rec) {
      const r = String(rec || '').toLowerCase();
      if (r.startsWith('invest') || r.includes('back')) return '#00897b';
      if (r.startsWith('pass') || r.includes('decline')) return '#C0392B';
      return '#C77700'; // diligence further / conditional
    }
    function valColor(v) {
      const s = String(v || '').toLowerCase();
      if (s.startsWith('cheap') || s.includes('under')) return 'var(--band-strong, #00A368)';
      if (s.startsWith('rich') || s.startsWith('expensive') || s.includes('over')) return 'var(--band-weak, #C42233)';

    }
    function prioColor(pr) { const s = String(pr || '').toLowerCase(); return s === 'high' ? '#C0392B' : s === 'low' ? '#6B7594' : '#C77700'; }

    function verdictHeaderHTML(p, snap) {
      const a = p.assessment; if (!a || !a.recommendation) return '';
      const rc = recColor(a.recommendation);
      const must = a.mustBeTrue || a.must_be_true || [];
      const ask = a.theAsk || a.the_ask;
      const risk = a.biggestRisk || a.biggest_risk;
      // Conviction → 3-segment meter (Low 1, Medium 2, High 3), filled in the rec colour.
      const conv = String(a.conviction || '').toLowerCase();
      const fill = conv.startsWith('high') ? 3 : conv.startsWith('med') ? 2 : conv.startsWith('low') ? 1 : 0;
      const convHTML = a.conviction ? `<div class="vh-conv"><div class="vh-conv-label">Conviction</div>
        <div class="vh-conv-row">${[1, 2, 3].map(n => `<span class="vh-conv-seg${n <= fill ? ' on' : ''}" style="--c:${rc};"></span>`).join('')}<span class="vh-conv-word" style="color:${rc};">${escBrief(a.conviction)}</span></div></div>` : '';
      // Scoreboard — the investability % is the hero; composite + band word beneath it.
      let scoreHTML = '';
      if (snap && (snap.pct != null || snap.composite != null)) {
        const bc = bandColor(snap.band);
        const pct = snap.pct != null ? snap.pct : Math.round((snap.composite / (snap.maxPossible || MAX_POSSIBLE)) * 100);
        const bandWord = String(snap.bandLabel || snap.band || '').split(/\s*[—–-]\s*|\s+/)[0];
        scoreHTML = `<div class="vh-score" style="--bc:${bc};">
          <div class="vh-score-pct">${escBrief(pct)}<span class="vh-score-sym">%</span></div>
          <div class="vh-score-comp">${escBrief(snap.composite)} / ${escBrief(snap.maxPossible || MAX_POSSIBLE)}</div>
          ${bandWord ? `<div class="vh-score-band">${escBrief(bandWord)}</div>` : ''}
        </div>`;
      }
      // Ask → its own strip; a trailing (round) parenthetical becomes a meta chip.
      let askHTML = '';
      if (ask) {
        const m = String(ask).match(/^(.*?)\s*\(([^)]*)\)\s*$/);
        const main = m ? m[1].trim() : String(ask).trim();
        askHTML = `<div class="vh-ask"><span class="vh-ask-label">Ask</span><span class="vh-ask-val">${escBrief(main)}</span>${m && m[2].trim() ? `<span class="vh-ask-meta">&middot; ${escBrief(m[2].trim())}</span>` : ''}</div>`;
      }
      const mustHTML = must.length ? `
        <div style="margin-top:1.1rem;border-top:1px solid rgba(0,0,0,0.07);padding-top:0.9rem;">
          <div class="text-mono" style="font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;font-weight:700;color:var(--accent,#00B8A0);margin-bottom:0.6rem;">For the thesis to hold, these must be true</div>

            ${must.map((m, i) => `<div style="display:flex;gap:0.6rem;align-items:flex-start;"><span class="text-mono" style="color:${rc};font-weight:700;flex:none;">${i + 1}</span><div style="font-size:0.9rem;line-height:1.5;">${escBrief(m)}</div></div>`).join('')}
          </div>
        </div>` : '';
      return `<div class="section">
        <div class="section-head" style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;">
          <div><div class="section-title">The call</div><div class="section-sub">The decision-grade verdict &mdash; recommendation, thesis, and the deal-breaker.</div></div>
          <button class="btn btn-outline btn-sm" onclick="window.__downloadMemo()" style="flex:none;white-space:nowrap;" title="Download a branded PDF deal memo to share with your team">&#8595;&nbsp; Deal memo</button>
        </div>
        <div class="card vh-card" style="border-top:3px solid ${rc};">
          <div class="vh-header">
            <div class="vh-left"><span class="vh-rec" style="background:${rc};">${escBrief(a.recommendation)}</span>${convHTML}</div>
            ${scoreHTML}
          </div>
          ${askHTML}
          ${a.thesis ? `<div class="vh-thesis">${escBrief(a.thesis)}</div>` : ''}
          ${risk ? `<div class="vh-risk"><strong>Biggest kill-risk &mdash;</strong> ${escBrief(risk)}</div>` : ''}
          ${mustHTML}
        </div></div>`;
    }

    function bullBearHTML(p) {
      const a = p.assessment || {};
      const bull = a.bull || [], bear = a.bear || [];
      if (!bull.length && !bear.length) return '';
      const col = (title, items, color, arrow) => `

          </div>
        </div>`;
      return `<div class="section">

    function dealValuationHTML(p) {
      const v = p.assessment && p.assessment.valuation; if (!v || (!v.verdict && !v.note && !(v.comps || []).length)) return '';
      const vc = valColor(v.verdict);
      const comps = v.comps || [];
      // A short band word for the chip (Cheap / Fair / Rich) if the verdict leads with one.
      const w = String(v.verdict || '').trim().split(/[\s,;.]/)[0];
      const chip = /^(cheap|fair|rich|under|over|expensive)$/i.test(w) ? w : '';
      const anchors = comps.length ? `
        <div class="dv-anchors">
          <div class="dv-anchors-title">Valuation anchors &middot; ${comps.length}</div>
          ${comps.map(c => `<div class="dv-anchor">
            <div class="dv-anchor-head"><span class="dv-anchor-name">${escBrief(c.name || '')}</span>${c.stage ? `<span class="dv-anchor-stage">${escBrief(c.stage)}</span>` : ''}</div>
            ${(c.detail || c.valuation) ? `<div class="dv-anchor-detail">${escBrief(c.detail || c.valuation)}</div>` : ''}
          </div>`).join('')}
        </div>` : '';
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">Deal &amp; valuation</div><div class="section-sub">Is the ask fair against comparable rounds at this stage and sector?</div></div></div>

          ${v.verdict ? `<div class="dv-verdict" style="--vc:${vc};">

            ${String(v.verdict).trim().toLowerCase() !== String(chip).toLowerCase() ? `<div class="dv-verdict-text">${escBrief(v.verdict)}</div>` : ''}
          </div>` : ''}
          ${v.note ? `<div class="dv-note">${escBrief(v.note)}</div>` : ''}
          ${anchors}
        </div></div>`;
    }

    function exitReturnsHTML(p) {
      const e = p.assessment && p.assessment.exit; if (!e || (!e.path && !(e.acquirers || []).length && !e.returns)) return '';
      const acq = e.acquirers || [];
      const acqHTML = acq.length ? `<div style="display:flex;flex-wrap:wrap;gap:0.45rem;margin:0.2rem 0 0.9rem;">${acq.map(a => `<span class="pill" style="background:rgba(110,58,250,0.08);color:var(--brand,#6E3AFA);font-size:0.78rem;">${escBrief(a)}</span>`).join('')}</div>` : '';
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">Exit &amp; returns</div><div class="section-sub">How this returns capital &mdash; realistic acquirers, the value-creation path, and the outcome.</div></div></div>
        <div class="card">
          ${acq.length ? `<div class="text-mono" style="font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;font-weight:700;color:var(--accent,#00B8A0);margin-bottom:0.4rem;">Likely acquirers</div>${acqHTML}` : ''}
          ${e.path ? `<div style="font-size:0.93rem;line-height:1.55;margin-bottom:${e.returns ? '0.8rem' : '0'};"><strong>Path:</strong> ${escBrief(e.path)}</div>` : ''}
          ${e.returns ? `<div style="font-size:0.93rem;line-height:1.55;"><strong>Returns:</strong> ${escBrief(e.returns)}</div>` : ''}
        </div></div>`;
    }

    // Canonical diligence priority — 3 tiers, normalized from whatever the agent emits
    // (critical/high/medium/low/p0…). See ASSESSMENT-CONTRACT.md → Diligence checklist.
    const DIL_TIERS = { blocker: { label: 'Blocker', dot: 'fill' }, key: { label: 'Key', dot: 'fill' }, standard: { label: 'Standard', dot: 'hollow' } };
    const DIL_NORM = {
      critical: 'blocker', blocker: 'blocker', blocking: 'blocker', dealbreaker: 'blocker', must: 'blocker', musthave: 'blocker', p0: 'blocker', urgent: 'blocker', showstopper: 'blocker', gate: 'blocker',
      high: 'key', hi: 'key', important: 'key', major: 'key', p1: 'key', key: 'key', significant: 'key',
      medium: 'standard', med: 'standard', moderate: 'standard', normal: 'standard', p2: 'standard', low: 'standard', lo: 'standard', minor: 'standard', optional: 'standard', p3: 'standard', standard: 'standard', routine: 'standard'
    };
    function dilTier(pr) {
      const s = String(pr == null ? '' : pr).toLowerCase();
      return DIL_NORM[s.replace(/[^a-z0-9]+/g, '')] || DIL_NORM[(s.split(/[^a-z0-9]+/).filter(Boolean)[0]) || ''] || 'standard';
    }
    function dilParse(txt) {
      const m = String(txt).match(/^(.*?\S)\s+[—–-]\s+([\s\S]*)$/);
      const label = m ? m[1].trim() : String(txt).trim();
      let clauses = (m ? m[2].trim() : '').split(/\s*;\s*/).map(c => c.trim()).filter(Boolean);
      let noWire = false;
      clauses = clauses.filter(c => { if (/no wire without this/i.test(c)) { noWire = true; return false; } return true; });
      return { label, clauses, noWire };
    }
    function diligenceChecklistHTML(p) {
      const items = (p.assessment && p.assessment.diligence) || []; if (!items.length) return '';
      const order = ['blocker', 'key', 'standard'];
      const buckets = { blocker: [], key: [], standard: [] };
      items.forEach(it => buckets[dilTier(it.priority)].push(it));
      const countTxt = { blocker: n => `${n} blocker${n === 1 ? '' : 's'}`, key: n => `${n} key`, standard: n => `${n} standard` };
      const summary = `<div class="dil-summary"><span class="dil-summary-label">Diligence</span>${
        order.filter(k => buckets[k].length).map(k => `<span class="dil-chip dil-chip-${k}">${countTxt[k](buckets[k].length)}</span>`).join('')
      }<span class="dil-chip">${items.length} item${items.length === 1 ? '' : 's'}</span></div>`;
      const groups = order.filter(k => buckets[k].length).map(k => {
        const rows = buckets[k].map((it, i) => {
          const { label, clauses, noWire } = dilParse(it.item || it);
          const detail = clauses.length > 1
            ? `<ul class="dil-clauses">${clauses.map(c => `<li>${escBrief(c)}</li>`).join('')}</ul>`
            : (clauses.length === 1 ? `<div class="dil-detail">${escBrief(clauses[0])}</div>` : '');
          return `<div class="dil-row dil-${k}${i === buckets[k].length - 1 ? ' dil-row-last' : ''}">
            <div class="dil-head">
              <span class="dil-dot dil-dot-${DIL_TIERS[k].dot}"></span>
              <span class="dil-label">${escBrief(label)}</span>
              ${noWire ? `<span class="dil-nowire">No wire</span>` : ''}
              <span class="dil-pill dil-pill-${k}">${DIL_TIERS[k].label}</span>
            </div>${detail}
          </div>`;
        }).join('');
        return `<div class="dil-group"><div class="dil-group-label">${DIL_TIERS[k].label} &middot; ${buckets[k].length}</div>${rows}</div>`;
      }).join('');
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">Diligence checklist</div><div class="section-sub">What to verify before wiring &mdash; ranked by what blocks the deal.</div></div></div>
        ${summary}
        <div class="card dil-card">${groups}</div>
      </div>`;
    }

    // Prominent entry point into the deep research (the Data Room below). Drills

    function deepResearchCTAHTML(hubDocs) {
      const docs = (hubDocs || []).filter(d => d.hub === 'research' || d.hub === 'assessment');
      if (!docs.length) return '';
      return `<div class="section">
        <a href="#deep-research" class="card deep-research-cta" style="display:flex;align-items:center;justify-content:space-between;gap:1.25rem;flex-wrap:wrap;border-left:3px solid var(--accent,#00B8A0);text-decoration:none;color:inherit;">
          <div style="min-width:240px;flex:1;">
            <div class="text-mono" style="font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;font-weight:700;color:var(--accent,#00B8A0);margin-bottom:0.4rem;">Deep research</div>
            <div style="font-size:1.02rem;font-weight:600;color:var(--text);margin-bottom:0.25rem;">Every call above traces to the evidence base.</div>
            <div style="font-size:0.9rem;color:var(--text-muted);line-height:1.5;">${docs.length} cited research document${docs.length === 1 ? '' : 's'} &mdash; market, competitors, demand and unit economics, web-researched. Drill into the findings behind the score, the cards and the verdict.</div>
          </div>
          <span class="btn btn-primary" style="flex:none;">View deep research &darr;</span>
        </a>
      </div>`;

    // Research provenance — a strip that surfaces the external rigor behind the score.
    function provenanceStripHTML(p) {
      const pr = (p.assessment && p.assessment.provenance) || null;
      if (!pr) return '';
      const items = [
        pr.competitors ? `${pr.competitors} competitors benchmarked` : null,

        pr.marketReports ? `${pr.marketReports} market reports` : null,

        pr.sources ? `${pr.sources} sources cited` : null
      ].filter(Boolean);
      if (!items.length) return '';
      return `<div class="assess-provenance"><span class="assess-provenance-label">Researched</span>${items.map(it => `<span class="assess-provenance-item">${escBrief(it)}</span>`).join('')}</div>`;
    }

    // Competitive benchmark — a side-by-side matrix vs named competitors.
    function benchmarkMatrixHTML(p) {
      const b = p.assessment && p.assessment.benchmark;
      if (!b || !(b.competitors || []).length) return '';
      const dims = b.dimensions || [];
      const rows = b.competitors.map(c => `<tr class="${c.isTarget ? 'bm-target' : ''}">
          <td class="bm-name">${escBrief(c.name)}${c.isTarget ? ' <span class="bm-you">THIS</span>' : ''}</td>

        <div class="card" style="overflow-x:auto;">
          <table class="bm-table"><thead><tr><th>Company</th>${dims.map(d => `<th>${escBrief(d)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
        </div></div>`;

    // Market sizing (TAM/SAM/SOM) + comparable funding rounds.
    function marketSizingHTML(p) {
      const m = p.assessment && p.assessment.market;
      const rounds = (p.assessment && p.assessment.rounds) || [];
      if (!m && !rounds.length) return '';
      const tier = (t, cls) => t ? `<div class="ms-tier ${cls}"><div class="ms-tier-val">${escBrief(t.value)}</div><div class="ms-tier-lbl">${escBrief(t.label)}</div></div>` : '';
      const sizing = m ? `<div class="ms-tiers">${tier(m.tam, 'ms-tam')}${tier(m.sam, 'ms-sam')}${tier(m.som, 'ms-som')}</div>${m.note ? `<div class="ms-note">${escBrief(m.note)}</div>` : ''}` : '';
      const roundsTable = rounds.length ? `<div class="ms-rounds-title">Comparable funding rounds</div><div style="overflow-x:auto;"><table class="bm-table"><thead><tr><th>Company</th><th>Stage</th><th>Raised</th><th>Valuation</th><th>Lead / investors</th></tr></thead><tbody>${rounds.map(r => `<tr><td class="bm-name">${escBrief(r.company)}</td><td>${escBrief(r.stage || '—')}</td><td>${escBrief(r.amount || '—')}</td><td>${escBrief(r.valuation || '—')}</td><td>${escBrief(r.investors || '—')}</td></tr>`).join('')}</tbody></table></div>` : '';
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">Market &amp; funding landscape</div><div class="section-sub">The sized market and the recent rounds that frame the ask.</div></div></div>
        <div class="card">${sizing}${roundsTable}</div></div>`;

    // Founder & team due diligence — external research on the people.
    function teamDDHTML(p) {
      const t = p.assessment && p.assessment.team;
      if (!t || (!(t.members || []).length && !t.summary)) return '';
      const sig = s => s === 'positive' ? 'var(--success,#00A368)' : s === 'flag' ? 'var(--danger,#C42233)' : 'var(--text-muted,#656565)';
      const members = (t.members || []).map(m => `<div class="tdd-member">
          <span class="tdd-dot" style="background:${sig(m.signal)};"></span>
          <div><div class="tdd-name">${escBrief(m.name)}${m.role ? ` <span class="tdd-role">${escBrief(m.role)}</span>` : ''}</div><div class="tdd-bg">${escBrief(m.background || '')}</div></div>
        </div>`).join('');
      const gaps = (t.gaps || []).length ? `<div class="tdd-gaps"><strong>Gaps:</strong> ${t.gaps.map(escBrief).join(' &middot; ')}</div>` : '';
      return `<div class="section">
        <div class="section-head"><div><div class="section-title">Team &amp; founder diligence</div><div class="section-sub">${escBrief(t.summary || 'External research on the people behind the venture.')}</div></div></div>

    // Welcome pack (build-only) — operator generates from the brief, reviews, sends.
    // First proof-of-understanding the founder sees; precedes the research run.
    function welcomePackSectionHTML(p) {
      if (isAssess || p.briefSubmitted === false) return '';
      const org = (W.org || {});
      const head = `<div class="section-head"><div><div class="section-title">Welcome pack</div><div class="section-sub">What you heard, the voice you&rsquo;ll keep, and three things you already see &mdash; sent to ${escBrief(p.founderName || 'the founder')}&rsquo;s Studio in your brand, before the deep work begins.</div></div></div>`;

    // ---- Deal-memo export -------------------------------------------------
    // A self-contained, branded PDF-ready document built from the same
    // assessment data shown on screen. Opens in its own window (fully isolated
    // from the app's styles) and prints — the operator saves it as a PDF to
    // forward to a partner / investment committee.
    function dealMemoHTML(p, snap, org) {
      const a = p.assessment || {};
      const esc = escBrief;
      const brand = (org && org.primaryColor) || '#0036FF';
      const orgName = (org && org.name) || 'Ventrify';
      const rc = recColor(a.recommendation);
      const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      const sec = (title, inner) => inner ? `<section class="m-sec"><h2>${esc(title)}</h2>${inner}</section>` : '';
      const list = (items, color) => (items || []).length ? `<ul class="m-list">${items.map(i => `<li${color ? ` style="--mk:${color}"` : ''}>${esc(i)}</li>`).join('')}</ul>` : '';

      // Score
      let scoreBlock = '';
      if (snap && (snap.pct != null || snap.composite != null)) {
        const pct = snap.pct != null ? snap.pct : Math.round((snap.composite / (snap.maxPossible || MAX_POSSIBLE)) * 100);
        const bandWord = String(snap.bandLabel || snap.band || '').split(/\s*[—–-]\s*|\s+/)[0];
        scoreBlock = `<div class="m-score"><div class="m-score-pct">${esc(pct)}<span>%</span></div><div class="m-score-meta">${esc(snap.composite)} / ${esc(snap.maxPossible || MAX_POSSIBLE)}${bandWord ? ` · ${esc(bandWord)}` : ''}<div class="m-score-cap">Investability</div></div></div>`;
      }
      const ask = a.theAsk || a.the_ask;
      const risk = a.biggestRisk || a.biggest_risk;
      const must = a.mustBeTrue || a.must_be_true || [];

      // Bull / bear
      const bb = (a.bull || []).length || (a.bear || []).length
        ? `<div class="m-two"><div><h3 style="color:#00897b">The case to invest</h3>${list(a.bull, '#00897b') || '<p class="m-dim">—</p>'}</div><div><h3 style="color:#C0392B">The case to pass</h3>${list(a.bear, '#C0392B') || '<p class="m-dim">—</p>'}</div></div>` : '';

      // Valuation
      const v = a.valuation || {};
      const vComps = (v.comps || []).length ? `<table class="m-tbl"><tbody>${v.comps.map(c => `<tr><td><strong>${esc(c.name || '')}</strong>${c.stage ? ` <span class="m-dim">${esc(c.stage)}</span>` : ''}</td><td>${esc(c.detail || c.valuation || '')}</td></tr>`).join('')}</tbody></table>` : '';
      const valBlock = (v.verdict || v.note || vComps) ? `${v.verdict ? `<p><strong>Verdict:</strong> ${esc(v.verdict)}</p>` : ''}${v.note ? `<p>${esc(v.note)}</p>` : ''}${vComps}` : '';

      // Market + rounds
      const m = a.market || null;
      const rounds = a.rounds || [];
      const tier = (t, l) => t ? `<div class="m-tier"><div class="m-tier-v">${esc(t.value)}</div><div class="m-tier-l">${esc(l)}</div></div>` : '';
      const marketBlock = (m || rounds.length) ? `${m ? `<div class="m-tiers">${tier(m.tam, 'TAM')}${tier(m.sam, 'SAM')}${tier(m.som, 'SOM')}</div>${m.note ? `<p>${esc(m.note)}</p>` : ''}` : ''}${rounds.length ? `<table class="m-tbl"><thead><tr><th>Company</th><th>Stage</th><th>Raised</th><th>Valuation</th><th>Lead / investors</th></tr></thead><tbody>${rounds.map(r => `<tr><td>${esc(r.company || '')}</td><td>${esc(r.stage || '—')}</td><td>${esc(r.amount || '—')}</td><td>${esc(r.valuation || '—')}</td><td>${esc(r.investors || '—')}</td></tr>`).join('')}</tbody></table>` : ''}` : '';

      // Benchmark
      const b = a.benchmark || null;
      const benchBlock = (b && (b.competitors || []).length) ? `${b.note ? `<p class="m-dim">${esc(b.note)}</p>` : ''}<table class="m-tbl"><thead><tr><th>Company</th>${(b.dimensions || []).map(d => `<th>${esc(d)}</th>`).join('')}</tr></thead><tbody>${b.competitors.map(c => `<tr${c.isTarget ? ' class="m-target"' : ''}><td><strong>${esc(c.name)}</strong>${c.isTarget ? ' ◂ this' : ''}</td>${(b.dimensions || []).map(d => `<td>${esc((c.cells || {})[d] || '—')}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '';

      // Exit
      const e = a.exit || {};
      const exitBlock = (e.path || (e.acquirers || []).length || e.returns) ? `${(e.acquirers || []).length ? `<p><strong>Likely acquirers:</strong> ${e.acquirers.map(esc).join(' · ')}</p>` : ''}${e.path ? `<p><strong>Path:</strong> ${esc(e.path)}</p>` : ''}${e.returns ? `<p><strong>Returns:</strong> ${esc(e.returns)}</p>` : ''}` : '';

      // Team
      const t = a.team || {};
      const sig = s => s === 'positive' ? '#00A368' : s === 'flag' ? '#C42233' : '#888';
      const teamBlock = ((t.members || []).length || t.summary) ? `${t.summary ? `<p class="m-dim">${esc(t.summary)}</p>` : ''}${(t.members || []).map(mm => `<div class="m-member"><span class="m-dot" style="background:${sig(mm.signal)}"></span><div><strong>${esc(mm.name)}</strong>${mm.role ? ` — ${esc(mm.role)}` : ''}<div class="m-dim">${esc(mm.background || '')}</div></div></div>`).join('')}${(t.gaps || []).length ? `<p style="margin-top:8px"><strong>Gaps:</strong> ${t.gaps.map(esc).join(' · ')}</p>` : ''}` : '';

      // Investability breakdown

      // Mirror the on-screen scorecard EXACTLY: each category is a fraction of its
      // RATED sub-criteria (sum / rated), not sum / max — build-only signals are

      // PDF would disagree with the app (and the headline %).
      const catBlock = cats.length ? `<table class="m-tbl m-cat"><tbody>${cats.map(c => { const rated = c.rated != null ? c.rated : (c.subs || []).filter(s => s.score != null).length; const pc = rated ? Math.round((c.sum / rated) * 100) : 0; return `<tr><td>${esc(c.label)}</td><td class="m-bar"><span style="width:${pc}%;background:${brand}"></span></td><td class="m-num">${esc(c.sum)} / ${esc(rated)}</td></tr>`; }).join('')}</tbody></table>` : '';

        dilBlock = order.filter(k => buckets[k].length).map(k => buckets[k].map(it => {
          const { label, clauses, noWire } = dilParse(it.item || it);
          return `<div class="m-dil"><span class="m-dil-tier m-dil-${k}">${DIL_TIERS[k].label}</span><div><strong>${esc(label)}</strong>${noWire ? ' <em>· no wire without this</em>' : ''}${clauses.length ? `<ul class="m-list">${clauses.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}</div></div>`;
        }).join('')).join('');

      // Provenance footer

      const provItems = [pr.competitors ? `${pr.competitors} competitors benchmarked` : '', pr.rounds ? `${pr.rounds} comparable rounds` : '', pr.marketReports ? `${pr.marketReports} market reports` : '', pr.sources ? `${pr.sources} sources cited` : ''].filter(Boolean);

      const metaChips = [p.stage, ask].filter(Boolean).map(x => `<span class="m-chip">${esc(x)}</span>`).join('');

      return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(p.name || 'Venture')} — Deal Memo</title>

  <div class="m-page">

      <div>${metaChips}</div>
      <div class="m-verdict">

    function assessMainHTML() {
      return `

    const main = isAssess ? assessMainHTML() : `
      <div style="margin-bottom:1rem;">

      </div>

      <div class="program-detail-head">

            <h1 class="program-detail-title">${p.name}</h1>

    // the elapsed time keeps moving and the stall guard fires even when the runner

    let latestRunState = p.runState;
    function paintRunBanner() {
      const region = document.getElementById('run-region');
      if (region) region.innerHTML = isAssess ? assessRunBannerHTML(latestRunState, p) : runBannerHTML(latestRunState, p);

      const active = latestRunState && ['queued', 'running', 'partial'].includes(latestRunState.status);
      if (active && !__runTicker) __runTicker = setInterval(paintRunBanner, 30000);
      else if (!active && __runTicker) { clearInterval(__runTicker); __runTicker = null; }
    }
    ensureRunTicker();

    // Deep-link focus from the action queue (?focus=<action-type>) → scroll to the
    // section where the work is, so "Review cards" / "Run assessment" land in context.
    try {
      const focus = new URLSearchParams(location.search).get('focus');
      if (focus) {
        const FOCUS_REGION = { 'cards-to-review': 'cards-region', 'assessment-ready': 'verdict-region', 'qa-flag': 'investability-region', 'l3-rebuild': 'deep-research' };
        const el = document.getElementById(FOCUS_REGION[focus] || 'run-region') || document.getElementById('run-region');
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 250);
      }
    } catch (e) {}

    // ---- Live run + cards subscriptions (realtime, live mode only) -------
    // The run banner reflects runState as the headless runner drives it; the
    // cards region repaints the moment the runner publishes drafts or the
    // founder responds — no manual refresh.
    if (W.mode === 'live') {
      try {
        const data = await import('../firebase/data.js');
        data.watchEngagement(p.id, async (eng) => {
          if (!eng) return;
          const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
          const region = document.getElementById('run-region');
          if (region) region.innerHTML = isAssess ? assessRunBannerHTML(eng.runState, { ...p, ...eng }) : runBannerHTML(eng.runState, { ...p, ...eng });
          latestRunState = eng.runState || latestRunState;
          ensureRunTicker();

          // Strengthen-suggestions can land with (or independently of) a score change —
          // copy them every tick so the scorecard's repaint below always uses the latest.
          if (eng.investabilitySuggestions) p.investabilitySuggestions = eng.investabilitySuggestions;

          // Live-refresh the investability score + the whole VSS scorecard when a run
          // updates the score. The runner writes the light denormalised summary to
          // eng.investability (composite/pct — NO status, NO categories), so we diff on
          // composite/pct only (comparing status would loop forever, since the full
          // snapshot has none) and re-fetch the full snapshot from the subcollection for
          // the categories, then repaint the headline % + the scorecard — no reload.
          const engScore = eng.investability || eng.investabilityScore;
          if (engScore && (!invSnapshot || engScore.composite !== invSnapshot.composite || engScore.pct !== invSnapshot.pct)) {
            try {
              const snaps = await data.listInvestabilitySnapshots(p.id);
              invSnapshot = snaps.length ? snaps[snaps.length - 1] : engScore;
            } catch (e) { invSnapshot = invSnapshot || engScore; }
            set('verdict-region', verdictHeaderHTML(p, invSnapshot));
            set('investability-region', investabilitySectionHTML(invSnapshot, p));

          if (isAssess && eng.assessment) {
            p.assessment = eng.assessment;
            set('provenance-region', provenanceStripHTML(p));
            set('verdict-region', verdictHeaderHTML(p, invSnapshot));
            set('bullbear-region', bullBearHTML(p));
            set('dealval-region', dealValuationHTML(p));
            set('market-region', marketSizingHTML(p));
            set('benchmark-region', benchmarkMatrixHTML(p));
            set('exit-region', exitReturnsHTML(p));
            set('team-region', teamDDHTML(p));
            set('diligence-region', diligenceChecklistHTML(p));
          }
        });
        data.watchCardsForEngagement(p.id, (cards) => {
          const region = document.getElementById('cards-region');
          if (region) region.innerHTML = isAssess ? findingsSectionHTML(cards) : cardsRegionHTML(cards, p);
        });
      } catch (e) { console.warn('live run/cards subscriptions failed', e); }
