<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="agents.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    await window.WORKSPACE_READY;
    const W = window.WORKSPACE;
    const A = window.WORKSPACE_AGENTS;
    const { actions, operators, programs, helpers, org } = W;

    // Aggregate stats. Action queue is now computed by workflow-orchestrator
    // (agents.js) across the operator's own engagements — same shape as the
    // sample actions, but derived from real engagement state.
    const totalPrograms = programs.length;
    const inFlight = programs.filter(p => p.phase < 5 && p.phase > 0).length;
    const cardsAwaiting = programs.reduce((acc, p) => acc + (p.cards && p.cards.awaitingFounder || 0), 0);
    const liveQueue = A ? A.computeActionQueue(programs, W.currentOperatorId) : [];
    const computedHighUrgency = liveQueue.filter(a => a.urgency === 'high').length;
    // In demo mode (sample programs without computed signals), fall back to
    // the hand-curated actions list so the populated dashboard still reads well.
    const useLiveQueue = (W.demoMode || 'off') === 'off';
    const highUrgencyActions = useLiveQueue ? computedHighUrgency : actions.filter(a => a.urgency === 'high').length;
    const portfolioCompleteness = A ? A.computePortfolioCompleteness(programs) : { pct: 0 };

    // ----- Empty-state view: shown when no engagements exist yet ---------
    if (totalPrograms === 0) {
      const orgName = (org && org.name) ? org.name : 'your Workspace';
      const emptyMain = `
        <div class="page-header">
          <div class="page-eyebrow">Portfolio</div>
          <h1 class="page-title">Welcome to ${orgName}.</h1>
          <p class="page-sub">No engagements yet. Create your first one &mdash; the platform scaffolds the rest.</p>
        </div>

        <div class="empty-hero">
          <div class="empty-hero-body">
            <div class="empty-hero-eyebrow">First engagement</div>
            <h2 class="empty-hero-title">Create your first<br>engagement.</h2>
            <p class="empty-hero-sub">Click &ldquo;New engagement&rdquo;. A five-step wizard captures the brief. The platform sets up the workspace, seeds the agents, opens Phase 0, and slots the venture into this portfolio.</p>
            <a href="new-engagement.html" class="btn btn-primary btn-lg empty-hero-cta">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Start your first engagement
            </a>
          </div>

          <div class="empty-hero-steps">
            <div class="empty-hero-step">
              <span class="empty-hero-step-tag">Brief</span>
              <div class="empty-hero-step-title">Brief intake</div>
              <p>Venture name, founder, industry, tier. An eight-section brief stored against the engagement.</p>
            </div>
            <div class="empty-hero-step">
              <span class="empty-hero-step-tag">Hubs</span>
              <div class="empty-hero-step-title">Hub seeding</div>
              <p>The three-layer data room is scaffolded and all seven hubs are primed.</p>
            </div>
            <div class="empty-hero-step">
              <span class="empty-hero-step-tag">Agents</span>
              <div class="empty-hero-step-title">Agent wiring</div>
              <p>The research agents are wired up and Phase 0 opens.</p>
            </div>
            <div class="empty-hero-step">
              <span class="empty-hero-step-tag">Live</span>
              <div class="empty-hero-step-title">Portal &amp; portfolio</div>
              <p>The Studio goes live and the engagement appears in your portfolio.</p>
            </div>
          </div>
        </div>

        <div class="empty-explorers">
          <a href="setup.html" class="empty-explorer-card">
            <div class="empty-explorer-card-head">
              <span class="empty-explorer-card-icon">&#x25C7;</span>
              <span class="empty-explorer-card-title">Refine your brand</span>
            </div>
            <p>Edit your organisation name, primary colour, or logo before your first engagement goes live.</p>
            <span class="empty-explorer-card-cta">Open setup &rarr;</span>
          </a>
          <a href="../the-workspace.html" target="_blank" class="empty-explorer-card">
            <div class="empty-explorer-card-head">
              <span class="empty-explorer-card-icon">&#x25A4;</span>
              <span class="empty-explorer-card-title">How the Workspace works</span>
            </div>
            <p>Three surfaces, three audiences. The marketing tour explains how operators, founders, and investors connect.</p>
            <span class="empty-explorer-card-cta">Read the tour &rarr;</span>
          </a>
          <a href="../agents.html" target="_blank" class="empty-explorer-card">
            <div class="empty-explorer-card-head">
              <span class="empty-explorer-card-icon">&#x25C6;</span>
              <span class="empty-explorer-card-title">Meet the 47 agents</span>
            </div>
            <p>The fleet behind every engagement. Substrate keystones, Build-First 8, and the full domain breakdown.</p>
            <span class="empty-explorer-card-cta">Explore the fleet &rarr;</span>
          </a>
        </div>
      `;
      window.renderShell(emptyMain);
      throw new Error('halt-render');
    }

    function programCardHTML(p) {
      // Defensive defaults for the pre-brief state — null industry/pitch
      // appear when the operator has launched the engagement but the founder
      // hasn't submitted the brief yet.
      const industry = p.industry || 'Awaiting brief';
      const cards = p.cards || { drafted: 0, awaitingFounder: 0, resolved: 0 };
      const briefSubmitted = p.briefSubmitted !== false;

      // Health: in live mode, agent computes verdict + reasons from state.
      // In demo mode, fall back to the sample data's hand-set health value.
      const computed = (useLiveQueue && A) ? A.computeEngagementHealth(p) : null;
      const healthLevel = computed ? computed.level : (p.health || 'on-track');
      const healthReasons = computed ? computed.reasons : null;
      const reasonsTitle = healthReasons
        ? healthReasons.slice(0, 3).map(r => '• ' + r.text).join('\n')
        : '';
      const completeness = A ? A.computeCompleteness(p) : { pct: 0 };

      // Investability at a glance — from the latest published snapshot summary.
      const inv = p.investability;
      const invColor = inv ? (inv.band === 'approved' ? '#00897b' : inv.band === 'feedback' ? '#C77700' : '#C0392B') : null;
      const invBadge = inv ? `<span class="pill" title="Investability ${inv.composite}/${inv.maxPossible || 35}" style="color:${invColor};font-weight:600;"><span class="dot" style="background:${invColor};"></span> ${inv.pct}% inv</span>` : '';

      return `
        <a href="program.html?id=${p.id}" class="program-card">
          <div class="program-card-head">
            <div class="program-card-identity">
              <div class="avatar avatar-lg" style="background:${p.founderAvatarColor};">${p.founderAvatar}</div>
              <div>
                <div class="program-card-name">${p.name}</div>
                <div class="program-card-founder">${p.founderName} &middot; ${industry}</div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:0.35rem;align-items:flex-end;">
              <span class="pill ${window.healthClass(healthLevel)}" title="${reasonsTitle.replace(/"/g, '&quot;')}">
                <span class="dot"></span>
                ${window.healthLabel(healthLevel)}
              </span>
              ${invBadge}
            </div>
          </div>

          <div>
            <div class="program-card-phase">${helpers.phaseLabel(p.phase)}</div>
            <div class="program-card-gate">${p.gateStatus}</div>
            <div class="progress"><div class="progress-bar" style="width:${helpers.phaseProgressPct(p.phase)}%"></div></div>
          </div>

          <div class="program-card-meta">
            <span>Started ${p.startDate}</span>
            <span class="sep"></span>
            <span>${p.daysActive || 0} days active</span>
            <span class="sep"></span>
            <span>Last activity: ${p.lastActivity || 'just now'}</span>
          </div>

          ${(healthReasons && healthReasons[0] && healthLevel !== 'on-track') ? `
            <div class="program-card-reason ${healthLevel}">
              <span class="program-card-reason-icon">${healthLevel === 'stuck' ? '⚠' : healthLevel === 'attention' ? '!' : '↗'}</span>
              <span>${healthReasons[0].text}</span>
            </div>
          ` : ''}

          ${briefSubmitted
            ? `<div class="program-card-stats">
                 <div class="program-card-stat">
                   <div class="v">${cards.resolved || 0}</div>
                   <div class="l">Cards resolved</div>
                 </div>
                 <div class="program-card-stat">
                   <div class="v">${cards.awaitingFounder || 0}</div>
                   <div class="l">Awaiting founder</div>
                 </div>
                 <div class="program-card-stat">
                   <div class="v">${cards.drafted || 0}</div>
                   <div class="l">Total drafted</div>
                 </div>
               </div>`
            : `<div class="program-card-stats" style="background:rgba(var(--primary-rgb,0,54,255),0.04);border:1px dashed rgba(var(--primary-rgb,0,54,255),0.25);border-radius:10px;padding:0.75rem;">
                 <div style="font-size:0.82rem;color:var(--text-muted);text-align:center;width:100%;">
                   <strong style="color:var(--text);font-weight:600;">Awaiting brief from founder.</strong> Studio invite sent to ${p.founderName}. No cards drafted until brief is signed.
                 </div>
               </div>`
          }
        </a>
      `;
    }

    const main = `
      <div class="page-header-row">
        <div class="page-header">
          <div class="page-eyebrow">Portfolio</div>
          <h1 class="page-title">All engagements · ${totalPrograms} active</h1>
          <p class="page-sub">Every venture running on your Workspace. Click an engagement for the full hub view and timeline.</p>
        </div>
        <div class="page-header-cta">
          <a href="new-engagement.html" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New engagement
          </a>
        </div>
      </div>

      <div class="dashboard-stats">
        <div class="card">
          <div class="stat-block">
            <div class="stat-val">${totalPrograms}</div>
            <div class="stat-lbl">Active programs</div>
          </div>
        </div>
        <div class="card">
          <div class="stat-block">
            <div class="stat-val">${inFlight}</div>
            <div class="stat-lbl">In flight (Phase 1–4)</div>
          </div>
        </div>
        <div class="card">
          <div class="stat-block">
            <div class="stat-val">${cardsAwaiting}</div>
            <div class="stat-lbl">Cards awaiting founder</div>
          </div>
        </div>
        <div class="card" title="Computed by tier-compliance-auditor across active engagements">
          <div class="stat-block">
            <div class="stat-val">${portfolioCompleteness.pct}%</div>
            <div class="stat-lbl">Portfolio completeness</div>
            <div class="stat-sub text-mono dim" style="font-size:0.66rem;letter-spacing:0.06em;text-transform:uppercase;margin-top:0.35rem;">${portfolioCompleteness.items}/${portfolioCompleteness.of} expected outputs</div>
          </div>
        </div>
      </div>

      <div class="filter-bar">
        <button class="filter-pill active">All</button>
        <button class="filter-pill">On track</button>
        <button class="filter-pill">Needs attention</button>
        <button class="filter-pill">Stuck</button>
        <button class="filter-pill">Assigned to me</button>
        <div class="filter-spacer"></div>
        <div class="search">
          <span class="search-icon">&#x1F50D;</span>
          <input type="text" placeholder="Search programs or founders...">
        </div>
      </div>

      <div class="programs-grid">
        ${programs.map(programCardHTML).join('')}
      </div>
    `;

    window.renderShell(main);
  </script>
</body>
</html>
