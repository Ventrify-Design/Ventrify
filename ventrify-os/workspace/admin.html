<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="agents.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    await window.WORKSPACE_READY;
    const W = window.WORKSPACE;
    const me = W.helpers.currentOperator();
    const myEmail = ((me && me.email) || '').toLowerCase();
    const isSuper = !!W.isSuperAdmin;
    const isOwner = !!(W.org && String(W.org.ownerEmail || '').toLowerCase() === myEmail);
    const PLAN = window.VentrifyPlan;

    if (!isSuper && !isOwner) { window.location.href = 'dashboard.html'; throw new Error('halt'); }

    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // ----- Plan picker (preset dropdown + a custom capabilities/limits block) -
    // `plan` is a resolved plan object (from PLAN.resolvePlan) or null for a
    // fresh org. Reused by the create-org form and each org's inline editor.
    function planFieldHTML(prefix, plan) {
      const preset = (plan && plan.preset) || 'full';
      const isCustom = preset === 'custom';
      const capAssess = plan ? plan.capabilities.assess : true;
      const capBuild = plan ? plan.capabilities.build : true;
      const limA = (plan && plan.limits.assessments != null) ? plan.limits.assessments : '';
      const limB = (plan && plan.limits.builds != null) ? plan.limits.builds : '';
      const opt = v => `<option value="${v}" ${v === preset ? 'selected' : ''}>${PLAN.PLAN_PRESETS[v].label}</option>`;
      return `
        <select id="${prefix}-preset" class="login-input" style="margin:0;" onchange="window.__togglePlanCustom('${prefix}')">
          ${['full','assess','one-off','custom'].map(opt).join('')}
        </select>
        <div id="${prefix}-custom" style="display:${isCustom ? 'block' : 'none'};margin-top:0.75rem;padding:0.85rem 1rem;background:rgba(0,0,0,0.03);border-radius:10px;">
          <div style="display:flex;gap:1.25rem;margin-bottom:0.75rem;flex-wrap:wrap;">
            <label style="display:flex;align-items:center;gap:0.45rem;font-size:0.88rem;cursor:pointer;"><input type="checkbox" id="${prefix}-cap-assess" ${capAssess ? 'checked' : ''}> Assess ventures</label>
            <label style="display:flex;align-items:center;gap:0.45rem;font-size:0.88rem;cursor:pointer;"><input type="checkbox" id="${prefix}-cap-build" ${capBuild ? 'checked' : ''}> Build MVPs</label>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div><label class="wiz-label" style="font-size:0.7rem;">Max assessments</label><input id="${prefix}-lim-assess" class="login-input" value="${limA}" placeholder="unlimited" style="margin:0;"></div>
            <div><label class="wiz-label" style="font-size:0.7rem;">Max builds</label><input id="${prefix}-lim-build" class="login-input" value="${limB}" placeholder="unlimited" style="margin:0;"></div>
          </div>
          <div class="text-mono dim" style="font-size:0.62rem;margin-top:0.5rem;">Leave a limit blank for unlimited.</div>
        </div>`;
    }
    window.__togglePlanCustom = function(prefix) {
      const sel = document.getElementById(prefix + '-preset');
      const block = document.getElementById(prefix + '-custom');
      if (block) block.style.display = (sel && sel.value === 'custom') ? 'block' : 'none';
    };
    function readPlan(prefix) {
      const preset = (document.getElementById(prefix + '-preset') || {}).value || 'full';
      if (preset !== 'custom') return { preset };
      const val = id => (document.getElementById(prefix + '-' + id) || {}).value;
      const ck = id => !!(document.getElementById(prefix + '-' + id) || {}).checked;
      const num = s => (s == null || String(s).trim() === '') ? null : Math.max(0, Math.floor(Number(s)) || 0);
      return { preset: 'custom', capabilities: { assess: ck('cap-assess'), build: ck('cap-build') }, limits: { assessments: num(val('lim-assess')), builds: num(val('lim-build')) } };
    }

    async function adminCall(payload) {
      const { auth } = await import('../firebase/firebase.js');
      const idToken = await auth.currentUser.getIdToken();
      const resp = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...payload, idToken }) });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
      return data;
    }

    window.__createOrg = async function() {
      const name = document.getElementById('org-name').value.trim();
      const slug = document.getElementById('org-slug').value.trim();
      const ownerEmail = document.getElementById('org-owner').value.trim();
      if (!name || !ownerEmail) { window.__toast('Organisation name and owner email are required.', true); return; }
      try { await adminCall({ action: 'create-org', name, slug, ownerEmail, plan: readPlan('neworg') }); window.location.reload(); }
      catch (e) { window.__toast('Could not create org: ' + e.message, true); }
    };
    window.__setOrgPlan = async function(orgId) {
      try { await adminCall({ action: 'set-plan', orgId, plan: readPlan('plan-' + orgId) }); window.location.reload(); }
      catch (e) { window.__toast('Could not update plan: ' + e.message, true); }
    };
    window.__addOperator = async function(orgId) {
      const input = document.getElementById('addop-' + orgId);
      const email = (input && input.value || '').trim();
      if (!email) return;
      try { await adminCall({ action: 'add-operator', orgId, email }); window.location.reload(); }
      catch (e) { window.__toast('Could not add operator: ' + e.message, true); }
    };
    window.__removeOperator = async function(orgId, email) {
      if (!(await window.__confirm({ title: 'Remove operator?', message: email + ' loses Workspace access.', confirmLabel: 'Remove', danger: true }))) return;
      try { await adminCall({ action: 'remove-operator', orgId, email }); window.location.reload(); }
      catch (e) { window.__toast('Could not remove operator: ' + e.message, true); }
    };
    window.__deleteOrg = async function(orgId) {
      const o = (orgs || []).find(x => x.id === orgId) || {};
      const name = o.name || orgId;
      const typed = window.prompt('This permanently deletes "' + name + '" and ALL of its engagements, cards, and scores. This cannot be undone.\n\nType the organisation name to confirm:');
      if (typed == null) return;
      if (typed.trim() !== name) { window.__toast('Name did not match — deletion cancelled.', true); return; }
      try {
        const r = await adminCall({ action: 'delete-org', orgId });
        const d = r.deleted || {};
        window.__toast('Deleted "' + name + '" — removed ' + (d.engagements || 0) + ' engagement(s) and ' + (d.cards || 0) + ' card(s).', false);
        setTimeout(() => window.location.reload(), 2600);
      } catch (e) { window.__toast('Could not delete org: ' + e.message, true); }
    };

    let orgs = [];
    let loadError = false;
    if (isSuper) {
      try { orgs = (await adminCall({ action: 'list-orgs' })).orgs || []; }
      catch (e) { loadError = true; }   // a failed fetch must NOT read as "no orgs"
    } else {
      orgs = [W.org];
    }

    function orgCardHTML(o) {
      const ops = o.operatorEmails || [];
      const owner = String(o.ownerEmail || '').toLowerCase();
      const sp = PLAN.planSummary(PLAN.resolvePlan(o));
      return `
        <div class="card" style="margin-bottom:1rem;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:0.85rem;">
            <div>
              <div style="font-weight:600;font-size:1.05rem;">${esc(o.name)}</div>
              <div class="text-mono dim" style="font-size:0.7rem;">${esc(o.id)} &middot; owner ${esc(o.ownerEmail || '—')}</div>
            </div>
            <div style="display:flex;gap:0.6rem;align-items:center;">
              <span class="pill" title="${esc(sp.detail || sp.label)}">${esc(sp.label)}</span>
              <span class="pill"><span class="dot"></span> ${ops.length} operator${ops.length === 1 ? '' : 's'}</span>
              ${(isSuper && o.id !== 'default') ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger,#C0392B);" onclick="window.__deleteOrg('${o.id}')">Delete org</button>` : ''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.9rem;">
            ${ops.map(e => `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;padding:0.5rem 0.8rem;background:rgba(0,0,0,0.03);border-radius:8px;">
                <span style="font-size:0.88rem;">${esc(e)}${owner === e.toLowerCase() ? ' <span class="text-mono dim" style="font-size:0.62rem;letter-spacing:0.06em;">OWNER</span>' : ''}</span>
                ${owner === e.toLowerCase() ? '' : `<button class="btn btn-ghost btn-sm" onclick="window.__removeOperator('${o.id}','${esc(e)}')">Remove</button>`}
              </div>`).join('')}
          </div>
          <div style="display:flex;gap:0.5rem;">
            <input id="addop-${o.id}" class="login-input" type="email" placeholder="operator@email.com" style="flex:1;height:40px;margin:0;">
            <button class="btn btn-primary btn-sm" onclick="window.__addOperator('${o.id}')">Add operator</button>
          </div>
          ${isSuper ? `
          <div style="margin-top:0.95rem;padding-top:0.95rem;border-top:1px solid rgba(0,0,0,0.06);">
            <label class="wiz-label" style="display:block;margin-bottom:0.45rem;">Plan</label>
            ${planFieldHTML('plan-' + o.id, PLAN.resolvePlan(o))}
            <div style="margin-top:0.75rem;"><button class="btn btn-outline btn-sm" onclick="window.__setOrgPlan('${o.id}')">Save plan</button></div>
          </div>` : ''}
        </div>`;
    }

    const createOrgHTML = isSuper ? `
      <div class="section">
        <div class="section-head"><div><div class="section-title">Create a client org</div><div class="section-sub">Stand up a new organisation and assign its owner. They get their own fully isolated Workspace.</div></div></div>
        <div class="card">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="wiz-field"><label class="wiz-label">Organisation name</label><input id="org-name" class="login-input" placeholder="e.g. Acme Accelerator" style="margin:0;"></div>
            <div class="wiz-field"><label class="wiz-label">Slug (optional)</label><input id="org-slug" class="login-input" placeholder="acme-accelerator" style="margin:0;"></div>
            <div class="wiz-field" style="grid-column:1/-1;"><label class="wiz-label">Owner email (their lead operator)</label><input id="org-owner" class="login-input" type="email" placeholder="lead@acme.com" style="margin:0;"></div>
            <div class="wiz-field" style="grid-column:1/-1;"><label class="wiz-label">Plan — what this org can do</label>${planFieldHTML('neworg', null)}</div>
          </div>
          <div style="margin-top:1.1rem;"><button class="btn btn-primary" onclick="window.__createOrg()">Create org</button></div>
        </div>
      </div>` : '';

    const main = `
      <div class="page-header">
        <div class="page-eyebrow">${isSuper ? 'Platform admin' : 'Team'}</div>
        <h1 class="page-title">${isSuper ? 'Organisations &amp; operators' : 'Your operators'}</h1>
        <p class="page-sub">${isSuper
          ? 'Create client orgs and manage who can operate each one. Every org is a fully isolated Workspace — operators only ever see their own org’s engagements.'
          : 'Add or remove operators for ' + esc(W.org.name) + '. They get access to this Workspace and can run engagements.'}</p>
      </div>
      ${createOrgHTML}
      <div class="section">
        <div class="section-head"><div><div class="section-title">${isSuper ? 'All organisations' : esc(W.org.name)}</div></div></div>
        ${loadError
          ? `<div class="error-state"><div style="font-weight:600;color:var(--text);">Couldn&rsquo;t load organisations</div><div style="font-size:0.9rem;color:var(--text-muted);max-width:42ch;">The request failed &mdash; this isn&rsquo;t an empty list. Check your connection and retry.</div><button class="btn btn-outline btn-sm" onclick="window.location.reload()">Retry</button></div>`
          : orgs.length ? orgs.map(orgCardHTML).join('') : '<div class="card" style="text-align:center;padding:2rem;color:var(--text-muted);">No organisations yet.</div>'}
      </div>
    `;
    window.renderShell(main);
  </script>
</body>
</html>
