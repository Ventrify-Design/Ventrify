<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Ventrify OS Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="sample-data.js"></script>
  <script src="agents.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    await window.WORKSPACE_READY;
    const W = window.WORKSPACE;
    const me = W.helpers.currentOperator();
    const myEmail = ((me && me.email) || '').toLowerCase();
    const isSuper = !!W.isSuperAdmin;
    const isOwner = !!(W.org && String(W.org.ownerEmail || '').toLowerCase() === myEmail);

    if (!isSuper && !isOwner) { window.location.href = 'dashboard.html'; throw new Error('halt'); }

    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    async function adminCall(payload) {
      const { auth } = await import('../firebase/firebase.js');
      const idToken = await auth.currentUser.getIdToken();
      const resp = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...payload, idToken }) });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
      return data;
    }

    window.__createOrg = async function() {
      const name = document.getElementById('org-name').value.trim();
      const slug = document.getElementById('org-slug').value.trim();
      const ownerEmail = document.getElementById('org-owner').value.trim();
      if (!name || !ownerEmail) { alert('Organisation name and owner email are required.'); return; }
      try { await adminCall({ action: 'create-org', name, slug, ownerEmail }); window.location.reload(); }
      catch (e) { alert('Could not create org: ' + e.message); }
    };
    window.__addOperator = async function(orgId) {
      const input = document.getElementById('addop-' + orgId);
      const email = (input && input.value || '').trim();
      if (!email) return;
      try { await adminCall({ action: 'add-operator', orgId, email }); window.location.reload(); }
      catch (e) { alert('Could not add operator: ' + e.message); }
    };
    window.__removeOperator = async function(orgId, email) {
      if (!window.confirm('Remove ' + email + ' as an operator? They lose Workspace access.')) return;
      try { await adminCall({ action: 'remove-operator', orgId, email }); window.location.reload(); }
      catch (e) { alert('Could not remove operator: ' + e.message); }
    };

    let orgs = [];
    if (isSuper) {
      try { orgs = (await adminCall({ action: 'list-orgs' })).orgs || []; }
      catch (e) { orgs = []; }
    } else {
      orgs = [W.org];
    }

    function orgCardHTML(o) {
      const ops = o.operatorEmails || [];
      const owner = String(o.ownerEmail || '').toLowerCase();
      return `
        <div class="card" style="margin-bottom:1rem;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:0.85rem;">
            <div>
              <div style="font-weight:600;font-size:1.05rem;">${esc(o.name)}</div>
              <div class="text-mono dim" style="font-size:0.7rem;">${esc(o.id)} &middot; owner ${esc(o.ownerEmail || '—')}</div>
            </div>
            <span class="pill"><span class="dot"></span> ${ops.length} operator${ops.length === 1 ? '' : 's'}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.9rem;">
            ${ops.map(e => `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;padding:0.5rem 0.8rem;background:rgba(0,0,0,0.03);border-radius:8px;">
                <span style="font-size:0.88rem;">${esc(e)}${owner === e.toLowerCase() ? ' <span class="text-mono dim" style="font-size:0.62rem;letter-spacing:0.06em;">OWNER</span>' : ''}</span>
                ${owner === e.toLowerCase() ? '' : `<button class="btn btn-ghost btn-sm" onclick="window.__removeOperator('${o.id}','${esc(e)}')">Remove</button>`}
              </div>`).join('')}
          </div>
          <div style="display:flex;gap:0.5rem;">
            <input id="addop-${o.id}" class="login-input" type="email" placeholder="operator@email.com" style="flex:1;height:40px;margin:0;">
            <button class="btn btn-primary btn-sm" onclick="window.__addOperator('${o.id}')">Add operator</button>
          </div>
        </div>`;
    }

    const createOrgHTML = isSuper ? `
      <div class="section">
        <div class="section-head"><div><div class="section-title">Create a client org</div><div class="section-sub">Stand up a new organisation and assign its owner. They get their own fully isolated Workspace.</div></div></div>
        <div class="card">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="wiz-field"><label class="wiz-label">Organisation name</label><input id="org-name" class="login-input" placeholder="e.g. Acme Accelerator" style="margin:0;"></div>
            <div class="wiz-field"><label class="wiz-label">Slug (optional)</label><input id="org-slug" class="login-input" placeholder="acme-accelerator" style="margin:0;"></div>
            <div class="wiz-field" style="grid-column:1/-1;"><label class="wiz-label">Owner email (their lead operator)</label><input id="org-owner" class="login-input" type="email" placeholder="lead@acme.com" style="margin:0;"></div>
          </div>
          <div style="margin-top:1.1rem;"><button class="btn btn-primary" onclick="window.__createOrg()">Create org</button></div>
        </div>
      </div>` : '';

    const main = `
      <div class="page-header">
        <div class="page-eyebrow">${isSuper ? 'Platform admin' : 'Team'}</div>
        <h1 class="page-title">${isSuper ? 'Organisations &amp; operators' : 'Your operators'}</h1>
        <p class="page-sub">${isSuper
          ? 'Create client orgs and manage who can operate each one. Every org is a fully isolated Workspace — operators only ever see their own org’s engagements.'
          : 'Add or remove operators for ' + esc(W.org.name) + '. They get access to this Workspace and can run engagements.'}</p>
      </div>
      ${createOrgHTML}
      <div class="section">
        <div class="section-head"><div><div class="section-title">${isSuper ? 'All organisations' : esc(W.org.name)}</div></div></div>
        ${orgs.length ? orgs.map(orgCardHTML).join('') : '<div class="card" style="text-align:center;padding:2rem;color:var(--text-muted);">No organisations yet.</div>'}
      </div>
    `;
    window.renderShell(main);
  </script>
</body>
</html>
