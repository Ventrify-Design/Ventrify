<!DOCTYPE html>
<html lang="en" data-brand="verdictscore">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portfolio · new UI preview — Ventrify OS</title>
<meta name="description" content="Preview of the Material-3 operator portfolio, rendered from the live workspace data.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The brand's faces. These MUST match what --font-text / --font-display name in
     brand.css: the page used to fetch Roboto (M3's default, which brand-map.css
     overrides) and never fetch Inter at all, so the product rendered in Inter only
     on machines that happened to have it installed locally. tools/font-sync.mjs
     now fails the build if a page stops fetching a family its tokens name. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<!-- BRAND LAYER. Order is load-bearing and brand-map.css documents why:
     the :root variables would resolve from anywhere, but the handful of real
     SELECTORS in brand-map lose to ds.css at equal specificity if ds.css
     loads later. brand.css FIRST (the tokens everything else resolves
     against), brand-map LAST (the M3 role overrides). -->
<link rel="stylesheet" href="../assets/brand/brand.css">
<link rel="stylesheet" href="../shared/m3/theme.css">
<link rel="stylesheet" href="../shared/m3/ds.css">
<link rel="stylesheet" href="../shared/m3/assess-editorial.css">
<link rel="stylesheet" href="../shared/m3/transitions.css">
<link rel="stylesheet" href="../shared/m3/workspace-chrome.css">
<link rel="stylesheet" href="../shared/m3/brand-map.css">
</head>
<body>
<div id="app"></div>
<script src="sample-data.js"></script>
<script src="agents.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  // Stage 2 M3 migration — flagged, side-by-side preview of the operator PORTFOLIO on live
  // workspace data. Same reads as dashboard.html (no pipeline change), rendered in the M3 shell.
  // dashboard.html is untouched; revert = delete this file.
  import * as DS from '../shared/m3/ds.js';
  import { adaptEngagementRow } from '../shared/m3/workspace-adapter.js';
  import { workspaceEmpty, planGateBanner } from '../shared/m3/workspace-cards.js';
  import { defaultTier } from '../shared/entitlements.js';
  import { wsNavConfig, wsBrandConfig, wsAccountConfig, mountOrgSwitcherM3 } from './workspace-m3.js';
  import * as EA from './engagement-actions.js';

  await window.WORKSPACE_READY;
  const W = window.WORKSPACE;
  const A = window.WORKSPACE_AGENTS;
  const { org, helpers } = W;
  // ?demo=empty previews the first-run empty state on a populated workspace (inert by default).
  const _p = new URLSearchParams(location.search);
  const programs = _p.get('demo') === 'empty' ? [] : W.programs;

  // ---- plan gating (mirrors dashboard.html) ----
  const Plan = window.VentrifyPlan;
  const plan = W.plan;
  const ALLOWED_TYPES = Plan ? Plan.allowedTypes(plan) : ['engagement'];
  const ASSESS_ONLY = ALLOWED_TYPES.length === 1 && ALLOWED_TYPES[0] === 'assessment';
  // THE TIER THIS ORG WOULD ACTUALLY CREATE AT. A free account has limits.assessments = 0 and
  // limits.prescreens = 3, so asking the old 3-argument canCreate() — which assumes full tier —
  // answered "no allowance" and hid the only button that account can press. Its first screen read
  // "Plan limit reached" before it had done anything at all.
  // WHAT THEY CAN CREATE TODAY, not what the licence prefers. defaultTier() answers the second and
  // was being used for the first, so a one-off licensee who had spent their single assessment got
  // "Plan limit reached" and no way forward — while pre-screens are unlimited on every preset and
  // the server would have accepted one. See plan.js createableTier.
  const CREATABLE = Plan ? Plan.createableTier(plan, programs) : 'full';
  const TIER = CREATABLE || defaultTier(plan);
  const PRESCREEN_FIRST = TIER === 'prescreen';
  /* THE COPY FOLLOWS THE LICENCE. Same screen, different plan, different sentence — a workspace
     that cannot run a full assessment must not open with four steps promising one. `planLine` states
     what this plan actually includes, in planSummary's established voice: an allowance of zero is
     omitted rather than printed, because "0 assessments" states a plan's shape as a deficiency. */
  const PLAN_LINE = Plan ? (() => {
    const { label, detail } = Plan.planSummary(plan);
    return detail ? `${label} — ${detail}` : label;
  })() : '';
  const NEW_LABEL = PRESCREEN_FIRST ? 'Pre-screen a venture' : ASSESS_ONLY ? 'New assessment' : 'New engagement';
  const canCreateAny = Plan
    ? ALLOWED_TYPES.some(t => t === 'assessment' ? !!CREATABLE : Plan.canCreate(plan, programs, t).allowed)
    : true;

  // ---- aggregates (mirrors dashboard.html) ----
  const useLive = (W.demoMode || 'off') === 'off';
  const totalPrograms = programs.length;
  const inFlight = programs.filter(p => p.phase < 5 && p.phase > 0).length;
  const cardsAwaiting = programs.reduce((acc, p) => acc + ((p.cards && p.cards.awaitingFounder) || 0), 0);
  const portfolioCompleteness = A ? A.computePortfolioCompleteness(programs) : { pct: 0, items: 0, of: 0 };
  const ctx = { helpers, A, useLive, currentOperatorId: W.currentOperatorId };

  // ---- shared chrome ----
  const chrome = { nav: wsNavConfig(), brand: wsBrandConfig(), account: wsAccountConfig() };
  const newAction = { variant: 'filled', icon: 'add', label: NEW_LABEL, onclick: 'window.openNewAssessment&&window.openNewAssessment()' };

  function mount(masthead, body) {
    document.getElementById('app').outerHTML = DS.pageShell({ active: 'portfolio', aux: {}, ...chrome, masthead, body });
    DS.initShell();
    mountOrgSwitcherM3();
  }

  // ---- empty state ----
  if (totalPrograms === 0) {
    mount(
      DS.masthead({ eyebrow: 'Portfolio', headline: `Welcome to ${org && org.name ? org.name : 'your workspace'}`, subheading: ASSESS_ONLY ? 'No assessments yet — run your first one.' : 'No engagements yet — create your first one.', actions: canCreateAny ? [newAction] : [] }),
      `<div class="brief">${workspaceEmpty({ assessOnly: ASSESS_ONLY, prescreen: PRESCREEN_FIRST, planLine: PLAN_LINE, orgName: (org && org.name) || 'your Workspace', canCreate: canCreateAny })}</div>`
    );
    // Halts by never resolving, not by throwing — see the same idiom in
    // admin-m3.html, and app.js's three `return new Promise(() => {})` guards.
    // A throw here is a real uncaught Error in the console, indistinguishable
    // from a page that actually broke; this one fired on a brand-new org's
    // FIRST screen, because an empty portfolio takes this branch.
    await new Promise(() => {});
  }

  // ---- populated: stats + filter machine + grid (filter logic copied VERBATIM from dashboard.html) ----
  const hasAssessments = programs.some(p => p.engagementType === 'assessment');
  function recBucket(p) {
    if (p.engagementType !== 'assessment') return null;
    const r = String((p.assessment && p.assessment.recommendation) || '').toLowerCase();
    if (!r) return null;
    if (r.startsWith('invest') || r.includes('back')) return 'invest';
    if (r.startsWith('pass') || r.includes('decline')) return 'pass';
    return 'consider';
  }
  let view = { health: 'all', rec: 'all', sort: 'recent', q: '' };
  try { const s = JSON.parse(localStorage.getItem('workspace.dashView') || 'null'); if (s) view = { ...view, health: s.health || 'all', rec: s.rec || 'all', sort: s.sort || 'recent' }; } catch (e) {}

  // the filter bar is now single-sourced through DS.filterBar (config form); the delegated click handler
  // below reads data-health / data-rec and toggles .selected — same state machine, DS-owned markup.
  const healthChips = [['all', 'All'], ['on-track', 'On track'], ['attention', 'Needs attention'], ['stuck', 'Stuck'], ['mine', 'Assigned to me']].map(([k, l]) => ({ k, l }));
  const recChips = [['all', 'All'], ['invest', 'Invest'], ['consider', 'Consider'], ['pass', 'Pass']].map(([k, l]) => ({ k, l }));
  function filterBarHTML() {
    const groups = ASSESS_ONLY
      ? [{ dim: 'rec', chips: recChips, active: view.rec }]
      : [{ dim: 'health', chips: healthChips, active: view.health }, ...(hasAssessments ? [{ dim: 'rec', label: 'Recommendation', chips: recChips, active: view.rec }] : [])];
    return DS.filterBar({
      groups,
      sort: hasAssessments ? { id: 'dash-sort', value: view.sort, options: [{ v: 'recent', l: 'Recently active' }, { v: 'scoreDesc', l: 'Score: high → low' }, { v: 'scoreAsc', l: 'Score: low → high' }] } : undefined,
      search: { id: 'dash-search', placeholder: `Search ${ASSESS_ONLY ? 'ventures' : 'ventures or founders'}…` },
    });
  }
  function applyView() {
    let list = programs.map((p, i) => ({ p, i }));
    if (view.health !== 'all') list = list.filter(({ p }) => view.health === 'mine' ? p.assignedOperator === W.currentOperatorId : p.health === view.health);
    if (view.rec !== 'all') list = list.filter(({ p }) => recBucket(p) === view.rec);
    const q = view.q.trim().toLowerCase();
    if (q) list = list.filter(({ p }) => [p.name, p.founderName, p.industry, p.stage].filter(Boolean).some(s => String(s).toLowerCase().includes(q)));
    const score = p => (p.investability && p.investability.pct != null) ? p.investability.pct : null;
    if (view.sort === 'scoreDesc') list.sort((a, b) => ((score(b.p) ?? -1) - (score(a.p) ?? -1)) || (a.i - b.i));
    else if (view.sort === 'scoreAsc') list.sort((a, b) => ((score(a.p) ?? 1e9) - (score(b.p) ?? 1e9)) || (a.i - b.i));
    else list.sort((a, b) => a.i - b.i);
    return list.map(({ p }) => p);
  }
  function renderGrid() {
    const host = document.getElementById('ws-grid-host');
    if (!host) return;
    const list = applyView();
    // the hero counts the WHOLE book; when a (persisted) filter narrows the table below the total, say so
    // and offer a one-click clear — otherwise "6 on the book / 2 in the table" reads as ventures gone missing.
    const noun = ASSESS_ONLY ? 'assessment' : 'venture';
    const filtered = list.length < programs.length;
    const statusLine = filtered
      ? `<div class="ws-filter-status">Showing <b>${list.length}</b> of ${programs.length} ${noun}${programs.length === 1 ? '' : 's'} · <button class="ws-clear-filters" onclick="window.__clearDashFilters()">Clear filters</button></div>`
      : '';
    host.innerHTML = statusLine + (list.length
      ? DS.engagementTable(list.map(p => adaptEngagementRow(p, ctx)), { onDelete: W.mode === 'live' ? 'window.__wsDeleteRow' : '' })   // the DS portfolio component (single source)
      : DS.noteCard({ center: true, text: `No matching ${noun}s under the current filter.` }));
    try { localStorage.setItem('workspace.dashView', JSON.stringify({ health: view.health, rec: view.rec, sort: view.sort })); } catch (e) {}
  }
  // ---- delete an engagement from its portfolio row (LIVE only) ----
  // Destructive + irreversible: deleteEngagementDeep removes the engagement AND its provocation cards, from
  // BOTH the Workspace and the founder's Studio. Hence a confirm (window.__confirm focuses Cancel on danger,
  // so a reflexive Enter can't fire it) and a quiet, hover-revealed affordance rather than a bare icon.
  const renderHero = () => { const h = document.getElementById('ws-hero-host'); if (h) h.innerHTML = DS.portfolioHero(programs, {}); };
  window.__wsDeleteRow = async (id) => {
    const p = programs.find(x => x.id === id);
    if (!p) return;
    const isAssess = p.engagementType === 'assessment';
    const ok = await window.__confirm({
      title: `Delete “${p.name}” permanently?`,
      message: isAssess
        ? 'This removes the assessment and everything it produced — research, cards and the verdict. This cannot be undone.'
        : `This removes it from the Workspace and ${p.founderName || 'the founder'}’s Studio, including all its provocation cards. This cannot be undone.`,
      confirmLabel: 'Delete', danger: true,
    });
    if (!ok) return;
    try {
      await EA.deleteEngagement({ engagementId: id });
      const i = programs.indexOf(p);
      if (i > -1) programs.splice(i, 1);              // `programs` IS W.programs — one splice keeps every reader in sync
      window.__toast(`“${p.name}” deleted.`);
      if (!programs.length) { location.reload(); return; }   // last one gone → let the empty state take over
      renderHero(); renderGrid();                     // the hero must re-count, or it keeps counting a deleted venture
    } catch (e) {
      window.__toast('Could not delete: ' + ((e && (e.code || e.message)) || e), true);
    }
  };

  // reset every filter dimension back to "all" + sync the chips/search, then re-render (reveals anything a
  // saved filter was hiding — e.g. assessments that don't match a Recommendation/Assigned-to-me chip).
  window.__clearDashFilters = () => {
    view.health = 'all'; view.rec = 'all'; view.q = '';
    document.querySelectorAll('[data-health]').forEach(b => b.classList.toggle('selected', b.dataset.health === 'all'));
    document.querySelectorAll('[data-rec]').forEach(b => b.classList.toggle('selected', b.dataset.rec === 'all'));
    const s = document.getElementById('dash-search'); if (s) s.value = '';
    renderGrid();
  };

  // the flat stat row is replaced by the editorial portfolio hero — DS.portfolioHero owns the derived numbers now
  const body = `<div class="brief">
    ${canCreateAny ? '' : planGateBanner(NEW_LABEL)}
    <div id="ws-hero-host">${DS.portfolioHero(programs, {})}</div>
    ${filterBarHTML()}
    <div id="ws-grid-host"></div>
  </div>`;

  mount(
    DS.masthead({ eyebrow: 'Portfolio', headline: (org && org.name) ? org.name : 'Portfolio', actions: canCreateAny ? [newAction] : [] }),
    body
  );
  renderGrid();

  // wire the filter controls (delegated, mirrors dashboard.html)
  document.addEventListener('click', (e) => {
    const hp = e.target.closest('[data-health]');
    const rp = e.target.closest('[data-rec]');
    if (hp) { view.health = hp.dataset.health; document.querySelectorAll('[data-health]').forEach(b => b.classList.toggle('selected', b === hp)); renderGrid(); }
    else if (rp) { view.rec = rp.dataset.rec; document.querySelectorAll('[data-rec]').forEach(b => b.classList.toggle('selected', b === rp)); renderGrid(); }
  });
  const sortEl = document.getElementById('dash-sort');
  if (sortEl) { sortEl.value = view.sort; sortEl.addEventListener('change', () => { view.sort = sortEl.value; renderGrid(); }); }
  const searchEl = document.getElementById('dash-search');
  if (searchEl) searchEl.addEventListener('input', () => { view.q = searchEl.value; renderGrid(); });
</script>
</body>
</html>
