<!DOCTYPE html>
<html lang="en" data-brand="verdictscore">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Set up your workspace — VerdictScore</title>
  <meta name="description" content="One-time setup for your VerdictScore workspace — your name, your brand, your first operator account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The brand's faces. These MUST match what --font-text / --font-display name in
     brand.css: the page used to fetch Roboto (M3's default, which brand-map.css
     overrides) and never fetch Inter at all, so the product rendered in Inter only
     on machines that happened to have it installed locally. tools/font-sync.mjs
     now fails the build if a page stops fetching a family its tokens name. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
  <!-- Same brand-layer order as every other page; see brand-map.css. No shell:
       there is no workspace yet, which is the entire point of this screen. -->
  <link rel="stylesheet" href="../assets/brand/brand.css">
  <link rel="stylesheet" href="../shared/m3/theme.css">
  <link rel="stylesheet" href="../shared/m3/ds.css">
  <link rel="stylesheet" href="../shared/m3/workspace-chrome.css">
  <link rel="stylesheet" href="../shared/m3/brand-map.css">
</head>
<body class="signin">
  <main class="signin-shell setup-shell">
    <div class="m3-card signin-card setup-card" id="setup-card"></div>
  </main>

  <script type="module">
    import { formField, inkOn } from '../shared/m3/ds.js';
    import { brandLockup } from '../shared/m3/brand-lockup.js';
    import { brandPreview, brandSwatches } from '../shared/m3/workspace-cards.js';

    // ── State. Same shape the old page kept, minus `tier`. ──────────────────
    // THE LICENCE TIER PICKER IS GONE. It offered Starter $4,800 / Cohort
    // "Contact us" / Enterprise $150k+ and wrote org.tier, programsLimit and
    // operatorSeatsLimit. NOTHING READS ANY OF THE THREE — the real licence is
    // VentrifyPlan.resolvePlan(org.plan), which is admin-set and server-enforced
    // (api/admin.js set-plan, and the rules lock it). So the screen was asking a
    // new operator to pick a price the product does not charge and cannot honour,
    // and a self-serve tier contradicts the admin-set model besides. No plan is
    // written here: no plan resolves to the full licence, which is the documented
    // default for a local first-run workspace.
    const state = { orgName: '', primaryColor: '#0036FF', logoDataUrl: null, opName: '', opEmail: '' };

    const SW = ['#0036FF', '#7A3FFF', '#00B8A0', '#FF3F7A', '#FF7A3F', '#141414'];
    const esc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const slugify = s => (s || '').toLowerCase().trim().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').slice(0, 40) || 'workspace';
    const initialsOf = s => {
      const parts = (s || '').trim().split(/\s+/);
      return (((parts[0] || '?')[0] || '?') + (parts.length > 1 ? (parts[parts.length - 1][0] || '') : '')).toUpperCase().slice(0, 2);
    };
    // What the live preview is previewing. brandPreview() is the SAME component
    // Settings' hero uses, so the first thing an operator sees at setup and the
    // thing they edit afterwards cannot drift apart — one function draws both.
    const orgOf = () => ({ name: state.orgName.trim(), primaryColor: state.primaryColor, logoUrl: state.logoDataUrl });

    const card = document.getElementById('setup-card');
    card.innerHTML = `
      <div class="signin-mark">${brandLockup({ label: 'VerdictScore' })}</div>
      <h1 class="signin-title">Welcome. Let's set up your workspace.</h1>
      <p class="signin-sub">A one-time setup — about 30 seconds. Your name, your brand, your first operator account. You can edit any of it in Settings later.</p>

      <div class="setup-sec"><span class="overline">Your organisation</span>
        ${formField({ label: 'Organisation name', id: 'org-name', placeholder: 'e.g. TCA Venture Group', hint: 'Appears across your workspace and in every founder’s Studio.' })}
      </div>

      <div class="setup-sec"><span class="overline">Brand kit</span>
        <div class="setup-field"><span class="field-lab">Primary colour</span>${brandSwatches(SW, state.primaryColor)}</div>
        <div class="setup-field"><span class="field-lab">Logo <span class="field-opt">optional</span></span>
          <div class="setup-drop">
            <div id="b-logo" class="setup-droplogo"></div>
            <div class="setup-dropcopy"><div class="body-m" style="font-weight:500">Click to upload</div><div class="body-s variant">PNG or SVG. Square works best — skip to use initials.</div></div>
            <button type="button" class="m3-btn text" onclick="document.getElementById('logo-input').click()">Upload</button>
            <input type="file" id="logo-input" accept="image/png,image/svg+xml,image/jpeg" hidden>
          </div>
        </div>
        <div class="setup-field"><span class="field-lab">Live preview</span>
          <div class="m3-card setup-preview" id="setup-preview"></div>
        </div>
      </div>

      <div class="setup-sec"><span class="overline">Your account</span>
        <div class="setup-two">
          ${formField({ label: 'Your name', id: 'op-name', placeholder: 'e.g. Alex Doré' })}
          ${formField({ label: 'Your email', id: 'op-email', type: 'email', placeholder: 'you@yourfund.com' })}
        </div>
        <p class="signin-meta">You'll be set as Program Lead. Add more operators from Settings later.</p>
      </div>

      <button class="m3-btn filled signin-go" id="setup-go">Create workspace</button>
      <p class="signin-meta setup-skip"><a href="#" id="setup-demo">Skip — explore with sample data instead</a></p>`;

    // ── Live preview ────────────────────────────────────────────────────────
    const preview = document.getElementById('setup-preview');
    const logoTile = document.getElementById('b-logo');
    function repaint() {
      preview.innerHTML = brandPreview(orgOf());
      const c = state.primaryColor;
      logoTile.style.background = c;
      logoTile.style.color = inkOn(c);
      logoTile.innerHTML = state.logoDataUrl
        ? `<img src="${esc(state.logoDataUrl)}" alt="">`
        : `<span>${esc(initialsOf(state.orgName))}</span>`;
    }

    function setColour(value) {
      if (!/^#[0-9a-fA-F]{6}$/.test(value)) return;
      state.primaryColor = value.toUpperCase();
      document.getElementById('b-pick').value = state.primaryColor;
      document.getElementById('b-hex').value = state.primaryColor;
      document.querySelectorAll('.bsw').forEach(s => s.classList.toggle('on', s.dataset.color.toUpperCase() === state.primaryColor));
      const tile = document.querySelector('.bsw-custom');
      if (tile) { tile.classList.remove('empty'); tile.style.background = state.primaryColor;
        const g = tile.querySelector('.material-symbols-rounded'); if (g) g.style.color = inkOn(state.primaryColor); }
      repaint();
    }
    document.querySelectorAll('.bsw').forEach(s => s.addEventListener('click', () => setColour(s.dataset.color)));
    document.getElementById('b-pick').addEventListener('input', e => setColour(e.target.value));
    document.getElementById('b-hex').addEventListener('change', e => setColour(e.target.value));

    document.getElementById('org-name').addEventListener('input', e => { state.orgName = e.target.value; repaint(); });
    document.getElementById('logo-input').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => { state.logoDataUrl = ev.target.result; repaint(); };
      reader.readAsDataURL(file);
    });
    setColour(state.primaryColor);

    // ── Submit. Written keys UNCHANGED from the pre-migration page, because
    //    app.js reads exactly these four on first run. ────────────────────────
    const DASH = 'dashboard-m3.html';   // was dashboard.html — the LEGACY page, which
    // login has not sent anyone to since Material-3 became the only workspace UI.
    // First-run was the one path still landing a brand-new org on the old dashboard.
    document.getElementById('setup-go').addEventListener('click', () => {
      state.opName = document.getElementById('op-name').value.trim();
      state.opEmail = document.getElementById('op-email').value.trim();
      if (!state.orgName.trim() || !state.opName || !state.opEmail) {
        window.__toast ? window.__toast('Organisation name, your name and your email are all required.', true)
                       : alert('Organisation name, your name and your email are all required.');
        return;
      }
      const operatorId = 'op-' + Math.random().toString(36).slice(2, 8);
      const organisation = {
        name: state.orgName.trim(),
        slug: slugify(state.orgName),
        primaryColor: state.primaryColor,
        logoDataUrl: state.logoDataUrl,
        createdAt: new Date().toISOString(),
        renewalDate: null,
        successContact: null,
      };
      const operator = {
        id: operatorId, name: state.opName, email: state.opEmail, role: 'Program Lead',
        avatar: initialsOf(state.opName), avatarColor: state.primaryColor, programsAssigned: [],
      };
      localStorage.setItem('workspace.organisation', JSON.stringify(organisation));
      localStorage.setItem('workspace.operators', JSON.stringify([operator]));
      localStorage.setItem('workspace.currentOperator', operatorId);
      localStorage.setItem('workspace.demoMode', 'off');
      window.location.href = DASH;
    });
    document.getElementById('setup-demo').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.setItem('workspace.demoMode', 'on');
      window.location.href = DASH;
    });
  </script>
</body>
</html>
