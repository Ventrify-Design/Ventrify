<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Assessment · assessing… · Ventrify OS</title>
<meta name="description" content="The ASSESSING state of an assessment — the memo before the ink lands. The same editorial surface as the finished verdict, caught mid-formation.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<script>try{if(localStorage.getItem("ventrify-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds.css">
<link rel="stylesheet" href="assess-editorial.css">
<link rel="stylesheet" href="transitions.css">
</head>
<body>
<div id="app"></div>
<script type="module">
  import * as DS from './ds.js';
  import { ASSESSMENT_RUNNING as A, SCORE_FORMING as S, RUN_STATES } from './data.js';
  import { resolveActions } from '../../shared/actions.js';
  const acts = resolveActions({ page: 'assess' });

  // ── THE ASSESSING SCREEN — "the memo, before the ink lands." ──────────────────────────────────────
  // A run in flight is not a loading state: it is the assessment ITSELF, mid-formation. So this is the SAME
  // editorial surface the finished verdict lives on — the section hero, the reading column, the .sec/.rule
  // rhythm — with the answer's placeholders sitting exactly where the answer will land. When the verdict
  // arrives, nothing MOVES; the placeholders simply resolve.
  //
  // ?state= proves every honest state, not just the flattering one:
  //   running (the hero shot) · silent (the agent hasn't reported — the MOST LIKELY first state)
  //   queued · quiet (a long, legitimate silence) · paused · error · republish (the 3-step plan swap)
  const STATE = new URLSearchParams(location.search).get('state') || 'running';
  const rs = RUN_STATES[STATE] || RUN_STATES.running;

  const body = `<div class="tab-panel active"><div class="brief" id="ea-status">${DS.assessingMemo(A, S, rs)}</div></div>`;

  document.getElementById('app').outerHTML = DS.pageShell({
    active: 'portfolio',
    aux: {}, auxMode: 'push', rail: acts.rail, railOverflow: acts.overflow,
    masthead: DS.masthead({
      breadcrumb: { label: 'Portfolio', href: 'portfolio.html' },
      crumbTail: A.name,
      avatar: A.initials,
      headline: A.name,
      subheading: A.stageLine,
      compact: A.name,
      status: { kind: 'n', label: 'Assessing…', icon: 'autorenew' },
      // NO TABS — there is no verdict yet, so there is nothing to switch between. One panel.
      tabs: false,
      // STOP is the ONLY masthead control while a run is live, and it is OUTLINED (never a primary — the run
      // is the work, not the button). canStopRun() is the guard: a run can only truly be stopped if we can
      // name its GitHub Actions run, so until the runner reports its id this renders NOTHING rather than a
      // button that lies. See the note in the panel — this needs one runner-repo commit to become real.
      actions: DS.canStopRun(rs)
        ? [{ variant: 'outlined', icon: 'stop_circle', label: 'Stop run', onclick: 'window.__stop()' }]
        : []
    }),
    body
  });
  DS.initShell();

  // the investability drill still works mid-run — the categories are there, just unrated
  window.openInvest = (key) => {
    const d = DS.categoryDetail(S, key);
    window.openAux({ mode: 'push', title: d.title, subtitle: d.subtitle, body: d.body });
  };

  // Stop — confirm first. Nothing is published until the very END of a run, so stopping saves nothing:
  // say that plainly rather than implying partial results are kept.
  window.__stop = async () => {
    const ok = await (window.__confirm ? window.__confirm({
      title: 'Stop the assessment?',
      message: 'Nothing has been published yet — the run only publishes at the very end — so stopping saves nothing and you would need to run it again from the start.',
      confirmLabel: 'Stop run', danger: true
    }) : Promise.resolve(confirm('Stop the assessment?')));
    if (!ok) return;
    (window.__toast || alert)('Design-system preview — the live Stop needs the runner to report its run id.');
  };

  // ── the 30s clock. The runner only writes to Firestore when its STEP changes (~11 writes across a run that
  //    can last well over an hour), so between milestones there is real silence. Without a local tick the
  //    elapsed counter freezes and a hung run looks alive forever — this is what keeps "elapsed" honest.
  setInterval(() => {
    const host = document.getElementById('ea-status');
    if (host) host.innerHTML = DS.assessingMemo(A, S, rs);
  }, 30000);
</script>
</body>
</html>
