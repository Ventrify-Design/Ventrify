<!-- THE BRAND LAYER, which the _redesign workshop pages do not load — they render in the pre-brand
     M3 default, which is why they show "Ventrify OS" with both product lockups. Order is load-bearing
     and brand-map.css documents why: brand.css first (the tokens), then theme/ds, then brand-map last
     so its remaps win. Identical on all three demo pages; shot-check --boot asserts they stay that way. -->
<link rel="stylesheet" href="../../assets/brand/brand.css">

<style>
  /* Embedded in a marketing page at a fixed 1440 and scaled, so it never needs the responsive
     shell. The scrollbar would be scaled with everything else and read as a stray grey bar. */
  html, body { scrollbar-width: none; }
  body::-webkit-scrollbar { display: none; }

  /* NO FOCUS RING ON THE DRILL HEADLINE — here only, never in the product. openDrill() moves focus
     to the companion page's title so a screen-reader or keyboard user lands where the new content
     starts, and the ring is how a sighted keyboard user sees that happen. These pages are driven by
     a script and read by nobody's keyboard, so the ring is just a box that appears around a title
     for no reason the viewer can explain. The real workspace keeps it. */
  .m3-drill .mh-hero .headline-m:focus,
  .m3-drill:focus { outline: none; box-shadow: none; }
</style>
