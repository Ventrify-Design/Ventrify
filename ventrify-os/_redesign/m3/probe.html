<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds.css">
<style>body{padding:40px;display:flex;flex-direction:column;gap:20px;align-items:flex-start;}</style>
</head><body>
  <button class="m3-btn filled">Filled button</button>
  <button class="m3-btn outlined">Outlined</button>
  <button class="m3-chip selected">Filter chip</button>
  <div style="width:300px"><div class="m3-prog"><span style="width:calc(0.72 * 100%)"></span></div></div>
  <div style="width:300px"><div class="m3-prog indeterminate"><span></span></div></div>
  <div class="m3-list" style="max-width:360px;">
    <div class="m3-li button">
      <div class="m3-li-body"><div class="m3-li-headline">List item headline</div><div class="m3-li-support">Supporting text</div></div>
      <div class="m3-li-end"><span class="material-symbols-rounded">chevron_right</span></div>
    </div>
  </div>
  <span class="material-symbols-rounded" style="font-size:32px;color:var(--md-sys-color-primary);">verified</span>
</body></html>
