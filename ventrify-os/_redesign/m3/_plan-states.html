<!DOCTYPE html>
<html lang="en" data-brand="verdictscore">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan states — the first screen</title>
<meta name="description" content="The workspace's first screen rendered for every licence shape, so plan-dependent copy can be reviewed without creating five organisations.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter+Tight:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="../../assets/brand/brand.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds.css">
<link rel="stylesheet" href="assess-editorial.css">
<link rel="stylesheet" href="../../shared/m3/workspace-chrome.css">
<link rel="stylesheet" href="../../shared/m3/brand-map.css">
<script src="_preview-brand-switch.js" defer></script>
<style>
  /* WHY THIS PAGE EXISTS. The workspace's first screen changes with the licence, and until now the
     only way to see any version of it was to create an organisation on that plan and look. So
     nobody did — and a customer on a plan with no full-assessment allowance was shown four steps
     promising a full assessment, a "Plan limit reached" banner and no way forward, for a pre-screen
     their licence grants without limit. Six shapes, one page, no Firebase. */
  body { margin:0; background:var(--surface-ground); color:var(--text-1);
         font:400 15px/1.6 var(--font-text); -webkit-font-smoothing:antialiased; }
  .pg { max-width:1180px; margin:0 auto; padding:48px 40px 140px; }
  h1 { font:600 clamp(1.7rem,3vw,2.3rem)/1.1 var(--font-display); letter-spacing:-.02em; margin:0 0 .4rem; }
  .sub { color:var(--text-2); max-width:78ch; margin:0 0 .2rem; font-size:14px; }
  .cx { margin:54px 0 0; padding-top:28px; border-top:1px solid var(--line-1); }
  .cx-t { font:600 1.15rem/1.2 var(--font-display); letter-spacing:-.01em; }
  .cx-m { color:var(--text-4); font:500 11.5px/1.6 var(--font-mono); margin:.4rem 0 0; letter-spacing:.04em; }
  .stage { width:1020px; max-width:100%; box-sizing:border-box; margin-top:18px;
           padding:28px 36px 36px; background:var(--surface-base);
           border:1px solid var(--line-1); border-radius:var(--r-lg); }
  @media (max-width:640px){ .pg{padding:28px 16px 80px} .stage{padding:18px 16px} }
</style>
</head>
<body>
<main class="pg">
  <h1>The first screen, on every licence</h1>
  <p class="sub">Rendered by the real <code>workspaceEmpty</code> against the real <code>plan.js</code>
  derivations — the same functions <code>dashboard-m3.html</code> calls — so what is reviewed here is
  what a customer on that plan actually sees.</p>
  <div id="out"></div>
</main>

<script type="module">
import { PLAN_PRESETS, resolvePlan, createableTier, allowedTypes, canCreate, planSummary } from '../../workspace/plan.js';
import { defaultTier } from '../../shared/entitlements.js';
import { workspaceEmpty } from '../../shared/m3/workspace-cards.js';

const spent = n => Array.from({ length: n }, (_, i) => ({ engagementType: 'assessment', tier: 'full', id: 'f' + i }));

/* The six shapes that matter. The last two are not presets — they are what an admin produces with
   the Custom editor, and they are where the bug lived. */
const CASES = [
  ['Free account', { preset: 'self-serve', ...PLAN_PRESETS['self-serve'] }, []],
  ['One-off assessment — unused', { preset: 'one-off', ...PLAN_PRESETS['one-off'] }, []],
  ['One-off assessment — SPENT', { preset: 'one-off', ...PLAN_PRESETS['one-off'] }, spent(1)],
  ['Assessment licence', { preset: 'assess', ...PLAN_PRESETS['assess'] }, []],
  ['Full platform licence', { preset: 'full', ...PLAN_PRESETS['full'] }, []],
  ['Custom — assess only, 0 full assessments (the shape that was blocked)',
   { preset: 'custom', capabilities: { assess: true, build: false }, limits: { assessments: 0, builds: 0, prescreens: null } }, []],
];

document.getElementById('out').innerHTML = CASES.map(([label, raw, programs]) => {
  const plan = resolvePlan({ plan: raw });
  const TYPES = allowedTypes(plan);
  const ASSESS_ONLY = TYPES.length === 1 && TYPES[0] === 'assessment';
  const CREATABLE = createableTier(plan, programs);
  const PRESCREEN_FIRST = (CREATABLE || defaultTier(plan)) === 'prescreen';
  const can = TYPES.some(t => t === 'assessment' ? !!CREATABLE : canCreate(plan, programs, t).allowed);
  const { label: L, detail } = planSummary(plan);
  const meta = `capabilities ${JSON.stringify(plan.capabilities)} · limits ${JSON.stringify(plan.limits)}\n` +
               `createableTier → ${CREATABLE}   ·   can create → ${can}`;
  return `<section class="cx">
    <div class="cx-t">${label}</div>
    <pre class="cx-m" style="white-space:pre-wrap;margin:.4rem 0 0">${meta}</pre>
    <div class="stage"><div class="brief">${workspaceEmpty({
      assessOnly: ASSESS_ONLY, prescreen: PRESCREEN_FIRST,
      planLine: detail ? `${L} — ${detail}` : L,
      orgName: 'Acme', canCreate: can,
    })}</div></div>
  </section>`;
}).join('');
</script>
</body>
</html>
