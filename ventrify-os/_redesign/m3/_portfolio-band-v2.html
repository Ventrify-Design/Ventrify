<!DOCTYPE html>
<html lang="en" data-brand="verdictscore">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio band v2 — the book, at any size</title>
<meta name="description" content="Headline figures plus a score distribution that holds its shape from 3 ventures to 40.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter+Tight:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="../../assets/brand/brand.css"><link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds.css"><link rel="stylesheet" href="assess-editorial.css">
<link rel="stylesheet" href="../../shared/m3/brand-map.css">
<script src="_preview-brand-switch.js" defer></script>
<style>
  body { margin:0; background:var(--md-sys-color-surface); color:var(--md-sys-color-on-surface); font:400 15px/1.6 Inter,sans-serif; -webkit-font-smoothing:antialiased; }
  .pg { max-width:1240px; margin:0 auto; padding:52px 36px 140px; }
  h1 { font:600 clamp(1.8rem,3.4vw,2.5rem)/1.05 'Space Grotesk',sans-serif; letter-spacing:-.02em; margin:0 0 .5rem; }
  .sub { color:var(--md-sys-color-on-surface-variant); max-width:88ch; margin:0 0 18px; }
  .ctl { display:flex; gap:8px; align-items:center; margin:0 0 6px; font-size:13px; color:var(--md-sys-color-on-surface-variant); }
  .ctl button { height:32px; padding:0 14px; border-radius:8px; border:1px solid var(--md-sys-color-outline-variant);
                background:transparent; color:inherit; font:inherit; font-size:13px; cursor:pointer; }
  .ctl button.on { background:var(--md-sys-color-secondary-container); color:var(--md-sys-color-on-secondary-container); border-color:transparent; }
  .cx { margin:46px 0 0; padding-top:24px; border-top:1px solid var(--md-sys-color-outline-variant); }
  .cx-h { display:flex; align-items:baseline; gap:14px; }
  .cx-n { font:500 12px/1 ui-monospace,monospace; color:var(--md-sys-color-primary); letter-spacing:.1em; }
  .cx-t { font:600 1.25rem/1.2 'Space Grotesk',sans-serif; letter-spacing:-.01em; }
  .cx-d { color:var(--md-sys-color-on-surface-variant); max-width:92ch; margin:.3rem 0 0; font-size:14px; }
  .stage { margin-top:16px; border:1px solid var(--md-sys-color-outline-variant); border-radius:14px; padding:26px 30px 28px; }

  /* the shared opening band: headline figures left, distribution right */
  .band { display:grid; grid-template-columns:minmax(210px,auto) minmax(0,1fr); gap:clamp(28px,4vw,56px); align-items:start; }
  .hero .n { font:600 clamp(44px,5vw,60px)/.88 'Space Grotesk',sans-serif; letter-spacing:-.035em; }
  .hero .n small { display:block; font:400 13px/1.3 Inter,sans-serif; letter-spacing:0; color:var(--md-sys-color-on-surface-variant); margin-top:11px; }
  .hero .subs { display:flex; gap:26px; margin-top:22px; }
  .hero .s b { display:block; font:600 22px/1 'Space Grotesk',sans-serif; letter-spacing:-.02em; }
  .hero .s b.warnv { color:#f0c073; }
  .hero .s em { font-style:normal; font-size:11.5px; color:var(--md-sys-color-on-surface-variant); display:block; margin-top:6px; }
  .dist-h { display:flex; align-items:baseline; gap:10px; margin:0 0 14px; }
  .dist-h .l { font:500 10.5px/1 ui-monospace,monospace; letter-spacing:.11em; text-transform:uppercase; color:var(--md-sys-color-on-surface-variant); }
  .dist-h .m { margin-left:auto; font-size:12px; color:var(--md-sys-color-on-surface-variant); }

  /* A — banded columns, one cell per venture, stacking upward */
  .cols { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; align-items:end; min-height:132px; }
  .col { display:flex; flex-direction:column; justify-content:flex-end; gap:3px; }
  .col .cells { display:flex; flex-wrap:wrap-reverse; gap:3px; align-content:flex-end; }
  .col .cells i { width:14px; height:14px; border-radius:4px; }
  .col .cap { margin-top:9px; padding-top:9px; border-top:1px solid var(--md-sys-color-outline-variant); }
  .col .cap b { font:600 17px/1 'Space Grotesk',sans-serif; letter-spacing:-.02em; }
  .col .cap em { font-style:normal; display:block; font-size:11px; color:var(--md-sys-color-on-surface-variant); margin-top:5px; line-height:1.3; }
  .t-good i { background:var(--md-sys-color-primary); }
  .t-mid  i { background:color-mix(in srgb,var(--md-sys-color-primary) 42%,transparent); }
  .t-bad  i { background:color-mix(in srgb,#f2b8b5 55%,transparent); }
  .t-form i { background:color-mix(in srgb,var(--md-sys-color-on-surface) 14%,transparent); }

  /* B — beeswarm on the real axis */
  .swarm { position:relative; height:120px; }
  .swarm .ln { position:absolute; left:0; right:0; bottom:26px; height:1px; background:var(--md-sys-color-outline-variant); }
  .swarm .tk { position:absolute; bottom:6px; transform:translateX(-50%); font:500 10.5px/1 ui-monospace,monospace; color:var(--md-sys-color-on-surface-variant); }
  .swarm .tk i { position:absolute; left:50%; bottom:14px; width:1px; height:6px; background:var(--md-sys-color-outline-variant); }
  .swarm .sw-gate { position:absolute; bottom:27px; top:14px; width:0; border-left:1px dashed color-mix(in srgb,var(--md-sys-color-on-surface) 22%,transparent); }
  .swarm .sw-gate em { position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-style:normal; font:500 10px/1 ui-monospace,monospace; color:var(--md-sys-color-on-surface-variant); white-space:nowrap; }
  .swarm .d { position:absolute; width:13px; height:13px; border-radius:99px; transform:translateX(-50%); }
  .swarm .d.good { background:var(--md-sys-color-primary); }
  .swarm .d.mid  { background:color-mix(in srgb,var(--md-sys-color-primary) 45%,transparent); }
  .swarm .d.bad  { background:color-mix(in srgb,#f2b8b5 60%,transparent); }

  .note { font-size:12.5px; color:var(--md-sys-color-on-surface-variant); margin:18px 0 0; }
  .note b { color:var(--md-sys-color-on-surface); }
</style>
</head>
<body><main class="pg">
  <h1>The book, at any size</h1>
  <p class="sub">Concept 03's idea — open on how the book is scoring — but executed so it holds its shape as the book grows,
     with 04's headline figures folded in. Use the switch to see each at <b>3</b>, the real <b>11</b>, and <b>24</b> ventures.</p>
  <div class="ctl"><span>Book size:</span><span id="sw"></span></div>
  <section class="cx" id="cA"></section>
  <section class="cx" id="cB"></section>
</main>
<script type="module">
import { ENGAGEMENTS as E } from './data.js';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* The runner STAMPS the guidance band on the snapshot (vss-rubric.js GUIDANCE_BANDS) — the UI names it,
   it never recomputes it from the score, because the band also carries gates the score alone cannot see.
   The demo rows predate that field, so this reads band if present and only then falls back to the score. */
const BANDS = [
  { k:'READY',             label:'Investment ready', tone:'good', min:80 },
  { k:'PROMISING',         label:'Promising',        tone:'mid',  min:60 },
  { k:'HIGH_RISK',         label:'High risk',        tone:'bad',  min:40 },
  { k:'POTENTIAL_DECLINE', label:'Potential decline',tone:'bad',  min:0  },
];
const bandOf = r => r.band ? BANDS.find(b=>b.k===r.band) : BANDS.find(b => +r.rec.score >= b.min);
const inFlight = r => r.runState && ['queued','running','partial'].includes(r.runState.status);
const needs = r => (r.status && (r.status.kind==='err'||r.status.kind==='warn')) || (r.runState&&r.runState.status==='idle') || r.danger;

/* a synthetic book for the SCALE test only — real rows, re-scored, so the shape is plausible */
function book(n){
  if (n <= E.length) return E.slice(0, n);
  const out = E.slice();
  for (let i = 0; out.length < n; i++) {
    const src = E[i % E.length];
    const s = Math.max(12, Math.min(96, Math.round((src.rec ? +src.rec.score : 55) + (((i*37)%41) - 20))));
    out.push({ ...src, i: src.i, name: `${src.name} ${Math.floor(i/E.length)+2}`,
               rec: { ...(src.rec||{kind:'consider',label:'Diligence further',icon:'balance'}), score: String(s) } });
  }
  return out;
}

const hero = rows => {
  const scored = rows.filter(r=>r.rec);
  return `<div class="hero">
    <div class="n">${rows.length}<small>Active engagements</small></div>
    <div class="subs">
      <div class="s"><b class="${rows.filter(needs).length?'warnv':''}">${rows.filter(needs).length}</b><em>need you</em></div>
      <div class="s"><b>${rows.filter(inFlight).length}</b><em>in flight</em></div>
      <div class="s"><b>${scored.length}</b><em>scored</em></div>
    </div></div>`;
};

/* ── A · banded columns ─────────────────────────────────────────────── */
function colsView(rows){
  const scored = rows.filter(r=>r.rec);
  const groups = BANDS.map(b => ({ ...b, rows: scored.filter(r => bandOf(r).k === b.k) }));
  const forming = rows.length - scored.length;
  return `<div class="band">${hero(rows)}<div>
    <div class="dist-h"><span class="l">How the book scores</span><span class="m">${scored.length} scored · ${forming} still forming</span></div>
    <div class="cols">
      ${groups.map(g=>`<div class="col">
        <div class="cells t-${g.tone}">${g.rows.map(r=>`<i title="${esc(r.name)} · ${esc(r.rec.score)}"></i>`).join('')}</div>
        <div class="cap"><b>${g.rows.length}</b><em>${g.label}</em></div></div>`).join('')}
    </div>
    <p class="note">One cell per venture, stacking inside its band — so <b>24 ventures draw 24 cells</b>, the columns just get taller.
       Buckets are the runner's four guidance bands, not invented thresholds.</p>
  </div></div>`;
}

/* ── B · beeswarm ───────────────────────────────────────────────────── */
function swarmView(rows){
  const scored = rows.filter(r=>r.rec).map(r=>({ ...r, s:+r.rec.score, tone:bandOf(r).tone })).sort((a,b)=>a.s-b.s);
  const R = 7.5, W = 820;                                  // collision radius in % of a nominal width
  const placed = [];
  scored.forEach(p => {                                    // first free row where nothing is within 2R
    let lane = 0;
    while (placed.some(q => q.lane === lane && Math.abs(q.s - p.s) * (W/100) < 15)) lane++;
    placed.push({ ...p, lane });
  });
  const lanes = Math.max(1, ...placed.map(p=>p.lane+1));
  const x = s => `${3 + (s/100)*94}%`;
  return `<div class="band">${hero(rows)}<div>
    <div class="dist-h"><span class="l">How the book scores</span><span class="m">${scored.length} scored · ${rows.length-scored.length} still forming</span></div>
    <div class="swarm" style="height:${Math.max(120, 46 + lanes*16)}px">
      <div class="ln"></div>
      ${[60,80].map(v=>`<div class="sw-gate" style="left:${x(v)}"><em>${v}</em></div>`).join('')}
      ${[0,25,50,75,100].map(v=>`<div class="tk" style="left:${x(v)}"><i></i>${v}</div>`).join('')}
      ${placed.map(p=>`<div class="d ${p.tone}" style="left:${x(p.s)};bottom:${33 + p.lane*16}px" title="${esc(p.name)} · ${p.s}"></div>`).join('')}
    </div>
    <p class="note">Every venture keeps its <b>exact score</b>; dots stack into lanes only when they would overlap, so the
       axis never lies about position. The two gate lines are the band thresholds. Grows in height, not in clutter.</p>
  </div></div>`;
}

const SIZES = [3, 11, 24];
let size = 11;
function render(){
  document.getElementById('sw').innerHTML = SIZES.map(n=>`<button data-n="${n}" class="${n===size?'on':''}">${n}</button>`).join(' ');
  const rows = book(size);
  document.getElementById('cA').innerHTML =
    `<div class="cx-h"><span class="cx-n">A</span><span class="cx-t">Banded columns</span></div>
     <p class="cx-d">The book bucketed into the runner's four guidance bands, one cell per venture stacking inside each.
        Reads as a distribution at a glance, and the unit stays the venture — nothing is averaged away.</p>
     <div class="stage">${colsView(rows)}</div>`;
  document.getElementById('cB').innerHTML =
    `<div class="cx-h"><span class="cx-n">B</span><span class="cx-t">Beeswarm on the axis</span></div>
     <p class="cx-d">Keeps concept 03's real 0–100 axis and every venture's exact position, but drops the labels and lets
        colliding dots stack into lanes. More precise than buckets; taller as the book grows.</p>
     <div class="stage">${swarmView(rows)}</div>`;
}
document.getElementById('sw').addEventListener('click', e => {
  const b = e.target.closest('[data-n]'); if (!b) return; size = +b.dataset.n; render();
});
render();
</script></body></html>
