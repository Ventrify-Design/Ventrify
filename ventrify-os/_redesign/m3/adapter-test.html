<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Adapter test · Verdana Bio (live-shaped) · Ventrify OS</title>
<script>try{if(localStorage.getItem("ventrify-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds.css">
<link rel="stylesheet" href="assess-editorial.css">
<link rel="stylesheet" href="transitions.css">
</head>
<body>
<div id="app"></div>
<!-- the LIVE workspace sample fixtures (classic script → window.WORKSPACE_SAMPLE) -->
<script src="../../workspace/sample-data.js"></script>
<script type="module">
  import * as DS from './ds.js';
  import { adaptEngagement } from '../../shared/m3/adapter.js';
  import { resolveActions } from '../../shared/actions.js';

  // take the LIVE-shaped fixture (Verdana Bio = prg-07, the runner's _verdict.json shape) and adapt it
  const p = window.WORKSPACE_SAMPLE.programs.find(x => x.id === 'prg-07');
  const { A, S } = adaptEngagement(p);
  window.__A = A; window.__S = S;   // exposed for the validation probe
  const acts = resolveActions({ page: 'assess' });

  const body = `
    <div class="tab-panel active">${DS.verdictMemo(A, S)}</div>
    <div class="tab-panel"><div class="brief">${DS.investabilityHero(S, A)}<hr class="rule">${DS.investabilityComposition(S, 'openInvest')}<hr class="rule">${DS.strengthProfile(S, 'openInvest')}</div></div>
    <div class="tab-panel">${DS.marketMemo(A)}</div>
    <div class="tab-panel">${DS.teamMemo(A)}</div>
    <div class="tab-panel">${DS.diligenceEditorial(A)}</div>
    <div class="tab-panel">${DS.researchMemo(A, S)}</div>`;

  document.getElementById('app').outerHTML = DS.pageShell({
    active: 'portfolio', aux: {}, rail: acts.rail, railOverflow: acts.overflow,
    masthead: DS.masthead({
      breadcrumb: { label: 'Portfolio', href: 'portfolio.html' }, crumbTail: A.name, avatar: A.initials,
      headline: A.name, status: A.status, subheading: A.stageLine, compact: A.name,
      actions: acts.primary ? [acts.primary] : [],
      tabs: ['Verdict', 'Investability', 'Market', 'Team', 'Diligence', 'Research'], activeTab: 0
    }),
    body
  });
  DS.initShell();
  DS.initTabs({ names: ['verdict', 'investability', 'market', 'team', 'diligence', 'research'] });
  window.openInvest = (key) => { const d = DS.categoryDetail(S, key); window.openAux({ mode: 'push', title: d.title, subtitle: d.subtitle, body: d.body }); };
  window.openPeek = () => {};
  window.RAIL_PANELS = { sources: () => DS.sourcesPanel(A) };
  window.openSources = () => window.openAux({ mode: 'push', ...DS.sourcesPanel(A) });
</script>
</body>
</html>
