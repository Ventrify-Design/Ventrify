<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>New assessment · Ventrify OS</title>
<meta name="description" content="Set up a venture assessment in the auxiliary panel — name it, upload the pitch deck, and run. The assessment researches the deck and returns a scored verdict.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<script>try{if(localStorage.getItem("ventrify-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds.css">
<link rel="stylesheet" href="assess-editorial.css">
<link rel="stylesheet" href="transitions.css">
</head>
<body>
<div id="app"></div>
<script type="module">
  import * as DS from './ds.js';
  import { ENGAGEMENTS } from './data.js';
  import { resolveActions } from '../../shared/actions.js';

  // The new-assessment flow lives in the AUXILIARY PANEL OVERLAY — a side sheet over the current context, never a
  // full page. This page demonstrates it in context: the populated portfolio with the wizard opened over it.
  const acts = resolveActions({ page: 'portfolio' });
  const rows = ENGAGEMENTS;
  const stats = [
    { n: String(rows.length), l: 'Active engagements' },
    { n: String(rows.filter(r => r.runState && ['queued', 'running', 'partial'].includes(r.runState.status)).length), l: 'Assessments in flight' },
    { n: String(rows.filter(r => r.rec).length), l: 'Verdicts ready' },
    { n: String(rows.filter(r => r.runState && r.runState.status === 'idle').length), l: 'Awaiting a deck' }
  ];
  document.getElementById('app').outerHTML = DS.pageShell({
    active: 'portfolio', aux: {}, rail: acts.rail, railOverflow: acts.overflow,
    masthead: DS.masthead({
      breadcrumb: false, eyebrow: 'Portfolio', headline: 'All engagements', headlineMeta: `· ${rows.length} active`,
      subheading: 'Every venture on your workspace — open one for the full assessment and timeline.',
      actions: [{ ...acts.primary, label: 'New assessment', onclick: 'window.openNewAssessment&&window.openNewAssessment()' }]
    }),
    body: `<div class="grid-4">${stats.map(DS.statCard).join('')}</div>${DS.filterBar(['All', 'On track', 'Needs attention', 'Stuck', 'Assessment'], 'Search ventures or founders')}${DS.engagementTable(rows)}`
  });
  DS.initShell();
  DS.initAssessmentWizard();
  // open the wizard overlay on load so the Pages specimen shows the surface in context
  requestAnimationFrame(() => window.openNewAssessment && window.openNewAssessment());
</script>
</body>
</html>
