<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Action queue · Ventrify OS</title>
<meta name="description" content="Everything the Ventrify OS platform needs from you, across every engagement — prioritised by urgency.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<script>try{if(localStorage.getItem("ventrify-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds.css">
<link rel="stylesheet" href="transitions.css">
</head>
<body>
<div id="app"></div>
<script type="module">
  import * as DS from './ds.js';
  import { QUEUE } from './data.js';
  import { resolveActions } from '../../shared/actions.js';
  const acts = resolveActions({ page: 'queue' });
  document.getElementById('app').outerHTML = DS.pageShell({
    active: 'queue',
    badges: { queue: QUEUE.length },
    aux: {}, rail: acts.rail, railOverflow: acts.overflow,
    masthead: DS.masthead({
      breadcrumb: false,
      eyebrow: 'Action queue',
      headline: 'Your work this week',
      subheading: 'Everything the platform needs from you, prioritised by urgency — gate sign-offs and stuck founders surface to the top.',
      actions: acts.primary ? [acts.primary] : []
    }),
    body: DS.queueBoard(QUEUE)
  });
  DS.initShell();
</script>
</body>
</html>
