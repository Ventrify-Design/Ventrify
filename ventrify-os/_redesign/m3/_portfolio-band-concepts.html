<!DOCTYPE html>
<html lang="en" data-brand="verdictscore">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The portfolio band — four ways to open the page</title>
<meta name="description" content="Concepts to replace the four counts at the top of the portfolio with something that earns its space.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter+Tight:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="../../assets/brand/brand.css">
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="ds.css"><link rel="stylesheet" href="assess-editorial.css">
<link rel="stylesheet" href="../../shared/m3/brand-map.css">
<script src="_preview-brand-switch.js" defer></script>
<style>
  body { margin:0; background:var(--md-sys-color-surface); color:var(--md-sys-color-on-surface); font:400 15px/1.6 Inter,sans-serif; -webkit-font-smoothing:antialiased; }
  .pg { max-width:1240px; margin:0 auto; padding:52px 36px 140px; }
  h1 { font:600 clamp(1.8rem,3.4vw,2.5rem)/1.05 'Space Grotesk',sans-serif; letter-spacing:-.02em; margin:0 0 .5rem; }
  .sub { color:var(--md-sys-color-on-surface-variant); max-width:86ch; margin:0 0 .4rem; }
  .cx { margin:50px 0 0; padding-top:24px; border-top:1px solid var(--md-sys-color-outline-variant); }
  .cx-h { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .cx-n { font:500 12px/1 ui-monospace,monospace; color:var(--md-sys-color-primary); letter-spacing:.1em; }
  .cx-t { font:600 1.25rem/1.2 'Space Grotesk',sans-serif; letter-spacing:-.01em; }
  .cx-d { color:var(--md-sys-color-on-surface-variant); max-width:92ch; margin:.3rem 0 0; font-size:14px; }
  .stage { margin-top:18px; border:1px solid var(--md-sys-color-outline-variant); border-radius:14px; padding:28px 30px 32px; }
  .ph { display:flex; align-items:baseline; gap:14px; margin:0 0 20px; }
  .ph .eyebrow { font:500 10.5px/1 ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--md-sys-color-primary); }
  .ph .t { font:600 21px/1.2 'Space Grotesk',sans-serif; letter-spacing:-.015em; }
  .ph .meta { margin-left:auto; font-size:12.5px; color:var(--md-sys-color-on-surface-variant); }
  .note { font-size:12.5px; color:var(--md-sys-color-on-surface-variant); margin:16px 0 0; }
  .note b { color:var(--md-sys-color-on-surface); }

  /* 01 — the book as a flow */
  .flow { display:flex; align-items:stretch; gap:3px; }
  .flow .seg { position:relative; padding:14px 16px 15px; border-radius:8px; min-width:0;
               background:color-mix(in srgb,var(--md-sys-color-on-surface) 5%,transparent); }
  .flow .seg.need { background:color-mix(in srgb,#e0a33a 14%,transparent); }
  .flow .seg.live { background:color-mix(in srgb,var(--md-sys-color-primary) 15%,transparent); }
  .flow .seg.done { background:color-mix(in srgb,var(--md-sys-color-primary) 26%,transparent); }
  .flow .n { font:600 26px/1 'Space Grotesk',sans-serif; letter-spacing:-.02em; }
  .flow .l { font-size:11.5px; color:var(--md-sys-color-on-surface-variant); margin-top:6px; white-space:nowrap; }

  /* 02 — one cell per venture */
  .book { display:flex; flex-wrap:wrap; gap:5px; margin:2px 0 0; }
  .book i { width:30px; height:30px; border-radius:7px; display:grid; place-items:center; cursor:default;
            font:600 9.5px/1 ui-monospace,monospace; letter-spacing:.02em; }
  .book i.need { background:color-mix(in srgb,#e0a33a 20%,transparent); color:#f0c073; }
  .book i.risk { background:color-mix(in srgb,#f2b8b5 18%,transparent); color:#f2b8b5; }
  .book i.live { background:color-mix(in srgb,var(--md-sys-color-primary) 18%,transparent); color:var(--md-sys-color-primary); }
  .book i.done { background:color-mix(in srgb,var(--md-sys-color-primary) 34%,transparent); color:var(--md-sys-color-primary); }
  .bk-leg { display:flex; gap:18px; margin-top:14px; font-size:12px; color:var(--md-sys-color-on-surface-variant); }
  .bk-leg span { display:inline-flex; align-items:center; gap:7px; }
  .bk-leg b { width:10px; height:10px; border-radius:3px; display:inline-block; }

  /* 03 — the scored book on one axis */
  .axis { position:relative; height:94px; margin-top:6px; }
  .axis .ln { position:absolute; left:0; right:0; top:58px; height:2px; background:var(--md-sys-color-outline-variant); }
  .axis .band { position:absolute; top:50px; height:18px; border-radius:4px;
                background:color-mix(in srgb,var(--md-sys-color-primary) 16%,transparent); }
  .axis .tk { position:absolute; top:66px; transform:translateX(-50%); font:500 10.5px/1 ui-monospace,monospace; color:var(--md-sys-color-on-surface-variant); }
  .axis .tk i { position:absolute; left:50%; top:-10px; width:1px; height:7px; background:var(--md-sys-color-outline-variant); }
  .axis .pt { position:absolute; top:44px; transform:translateX(-50%); text-align:center; }
  .axis .pt b { display:block; width:30px; height:30px; border-radius:99px; display:grid; place-items:center;
                font:600 11px/1 ui-monospace,monospace; background:var(--md-sys-color-primary); color:var(--md-sys-color-on-primary); }
  .axis .pt em { display:block; font-style:normal; font-size:11px; color:var(--md-sys-color-on-surface-variant); margin-top:7px; white-space:nowrap; }

  /* 04 — headline + split */
  .hl { display:flex; align-items:flex-end; gap:30px; }
  .hl .big { font:600 62px/.9 'Space Grotesk',sans-serif; letter-spacing:-.035em; }
  .hl .big small { font:500 14px/1 Inter,sans-serif; color:var(--md-sys-color-on-surface-variant); display:block; margin-top:10px; letter-spacing:0; }
  .hl .bars { flex:1; }
  .hl .bar { display:flex; height:10px; border-radius:99px; overflow:hidden; gap:2px; }
  .hl .bar i { display:block; }
  .hl .bar i.need { background:#e0a33a; } .hl .bar i.live { background:var(--md-sys-color-primary); }
  .hl .bar i.done { background:color-mix(in srgb,var(--md-sys-color-primary) 45%,transparent); }
  .hl .keys { display:flex; gap:22px; margin-top:14px; font-size:12.5px; }
  .hl .keys span { color:var(--md-sys-color-on-surface-variant); }
  .hl .keys b { color:var(--md-sys-color-on-surface); font-weight:600; margin-right:5px; }
</style>
</head>
<body><main class="pg">
  <h1>Opening the portfolio</h1>
  <p class="sub">Four replacements for the row of counts. Each renders from the real <code>ENGAGEMENTS</code>, and each
     tries to answer a question the four numbers don't: <i>what shape is this book in?</i></p>
  <section class="cx" id="c1"></section><section class="cx" id="c2"></section>
  <section class="cx" id="c3"></section><section class="cx" id="c4"></section>
</main>
<script type="module">
import { ENGAGEMENTS as E } from './data.js';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inFlight = r => r.runState && ['queued','running','partial'].includes(r.runState.status);
const needs = r => (r.status && (r.status.kind==='err'||r.status.kind==='warn')) || (r.runState&&r.runState.status==='idle') || r.danger;
const live  = r => !needs(r) && (inFlight(r) || (r.status && r.status.label==='Assessment'));
const done  = r => !needs(r) && !live(r);
const N = E.length, nNeed = E.filter(needs).length, nLive = E.filter(live).length, nDone = E.filter(done).length;
const scored = E.filter(r=>r.rec).map(r=>({ n:r.name, i:r.i, s:+r.rec.score })).sort((a,b)=>a.s-b.s);
const head = (e,t,m) => `<div class="ph"><span class="eyebrow">${e}</span><span class="t">${t}</span><span class="meta">${m}</span></div>`;
const shell = (n,t,d,inner) => `<div class="cx-h"><span class="cx-n">${n}</span><span class="cx-t">${t}</span></div><p class="cx-d">${d}</p><div class="stage">${inner}</div>`;

/* 01 — the book as a flow, segments sized by count */
document.getElementById('c1').innerHTML = shell('01','The book as a flow',
 'The four counts become one bar, split by state and <b>sized by how many ventures are in each</b>. The row stops being four unrelated numbers and becomes a shape you can read at a glance — today it is middle-heavy, which is the honest picture of a book mid-assessment.',
 head('Portfolio','All engagements', `${N} active`) + `<div class="flow">
   <div class="seg need" style="flex:${nNeed}"><div class="n">${nNeed}</div><div class="l">Need you</div></div>
   <div class="seg live" style="flex:${nLive}"><div class="n">${nLive}</div><div class="l">In flight</div></div>
   <div class="seg done" style="flex:${nDone}"><div class="n">${nDone}</div><div class="l">Settled</div></div>
 </div><p class="note">Reads as a proportion, not four tiles. The segment widths <b>are</b> the data.</p>`);

/* 02 — one cell per venture (the Diligence unit grid, applied to the book) */
const cls = r => needs(r) ? (r.status&&r.status.kind==='err'?'risk':'need') : live(r) ? 'live' : 'done';
document.getElementById('c2').innerHTML = shell('02','One cell per venture',
 'The same unit grid the Diligence tab uses, pointed at the book: <b>eleven ventures, eleven cells</b> — nothing averaged, nothing rounded. Hovering names the venture. It scales honestly: forty ventures draw forty cells and the shape still reads.',
 head('Portfolio','All engagements', `${N} active`) + `<div class="book">
   ${E.map(r=>`<i class="${cls(r)}" title="${esc(r.name)} — ${esc((r.status&&r.status.label)||'')}">${esc(r.i)}</i>`).join('')}
 </div><div class="bk-leg">
   <span><b style="background:color-mix(in srgb,#e0a33a 50%,transparent)"></b>${nNeed} need you</span>
   <span><b style="background:color-mix(in srgb,var(--md-sys-color-primary) 50%,transparent)"></b>${nLive} in flight</span>
   <span><b style="background:color-mix(in srgb,var(--md-sys-color-primary) 90%,transparent)"></b>${nDone} settled</span>
 </div><p class="note">The unit is the venture, so the chart cannot lie about scale the way a count can.</p>`);

/* 03 — the scored book on one axis */
const x = s => `${4 + (s/100)*92}%`;
document.getElementById('c3').innerHTML = shell('03','Where the book scores',
 'The measured axis from the Market tab, carrying the whole book: every scored venture plotted 0–100, so the page opens with <b>the quality of the deals</b> rather than a count of them. The unscored sit in the meta line — they have no position yet, and inventing one would be a lie.',
 head('Portfolio','Where the book scores', `${scored.length} scored · ${N - scored.length} still forming`) + `<div class="axis">
   <div class="ln"></div>
   <div class="band" style="left:${x(0)};width:calc(${x(100)} - ${x(0)})"></div>
   ${[0,25,50,75,100].map(v=>`<div class="tk" style="left:${x(v)}"><i></i>${v}</div>`).join('')}
   ${scored.map(p=>`<div class="pt" style="left:${x(p.s)}"><b>${p.s}</b><em>${esc(p.n)}</em></div>`).join('')}
 </div><p class="note">Three verdicts in, the book spans <b>${scored[0].s}</b> to <b>${scored[scored.length-1].s}</b>.</p>`);

/* 04 — one headline figure + the split beneath it */
document.getElementById('c4').innerHTML = shell('04','Headline and split',
 'The quietest option. One number at display size because one number is the answer, with the split as a thin bar under it. Keeps the figure-strip discipline but stops pretending four counts deserve equal weight.',
 head('Portfolio','All engagements','') + `<div class="hl">
   <div class="big">${N}<small>Active engagements</small></div>
   <div class="bars"><div class="bar">
     <i class="need" style="flex:${nNeed}"></i><i class="live" style="flex:${nLive}"></i><i class="done" style="flex:${nDone}"></i>
   </div><div class="keys">
     <span><b>${nNeed}</b>need you</span><span><b>${nLive}</b>in flight</span><span><b>${nDone}</b>settled</span>
   </div></div>
 </div><p class="note">Smallest change from what is there now; least new to maintain.</p>`);
</script></body></html>
